# Default profile: fast, fail-fast.
[profile.default]
failure-output = "immediate"
slow-timeout = { period = "60s", terminate-after = 5 }

# `kat` profile: long per-test budget for sign_kat_derand_NNN tests.
# Each test runs `sign_derand` + `verify` on one KAT vector. Some
# KAT seeds drop into deterministically-rejection-heavy trajectories
# in the response phase that take 150-200+ s under 8-way CPU
# contention; 10 min covers the long tail observed during the
# dual-LLL switch (the longest passing KAT solo was ~183 s, so under
# parallel contention it can reach a few minutes).
[profile.kat]
test-threads = "num-cpus"
slow-timeout = { period = "60s", terminate-after = 10 }
fail-fast = false
