# Default profile: fast, fail-fast.
[profile.default]
failure-output = "immediate"
slow-timeout = { period = "60s", terminate-after = 5 }

# `coverage` profile: same fast suite as `default`, but with a longer
# per-test cap to absorb llvm-cov instrumentation overhead. Without
# this, CT-by-construction loops like `BigInt::trailing_zeros` push
# KAT-parsing tests past `default`'s 5-min cap under coverage.
[profile.coverage]
slow-timeout = { period = "60s", terminate-after = 30 }

# `kat` profile: long per-test budget for sign_kat_derand_NNN tests.
# Each test runs `sign_derand` + `verify` on one KAT vector. Some
# KAT seeds drop into deterministically-rejection-heavy trajectories
# in the response phase that take 5-30 min depending on how many
# Cornacchia / LLL retries the alpha sampling needs, since our
# pure-Rust Fp arithmetic is ~10-30x slower than C ref's `gf/broadwell/`
# asm. The per-test budget here (30 min) accommodates the long tail
# until the asm-Fp work closes the gap; the GitHub Actions job that
# wraps this is given the full 360 min hard cap to absorb 8-way
# parallel contention on the slowest KATs.
[profile.kat]
test-threads = "num-cpus"
slow-timeout = { period = "60s", terminate-after = 30 }
fail-fast = false
