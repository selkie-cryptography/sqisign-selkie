# Default profile: fast, fail-fast.
[profile.default]
failure-output = "immediate"
slow-timeout = { period = "60s", terminate-after = 5 }

# Cap sign-side tests at 360s in the default profile (terminate-after
# = 2 × 180s window). After the random_norm β off-by-one, cross-order
# product modulus, and TorsionBasisFromHint bounded-search fixes, all
# 100 sign KATs pass on iter 0 in release in 1–6 s each. Debug builds
# (no inlining, large BigInt<60> stack frames) typically run 14–60 s,
# but the long-tail response-phase cross-order KATs (020, 037, 049,
# 063, 072) under `--features expose-internals` reproducibly hit
# 180–280 s on darwin debug. 360 s = ~60× the release worst-case
# gives the debug suite headroom for those tails without letting a
# genuine regression hang CI indefinitely.
#
# Filter covers: `sign_kat_derand_NNN` (deterministic), `sign_fresh`
# (OsRng-driven; bad-luck seed could occasionally hit the response-
# phase tail), and `sign_with_kat_key` (one-shot KAT-key end-to-end).
# The `kat` profile keeps the 30-min cap for explicit long-running
# KAT debugging.
[[profile.default.overrides]]
filter = 'test(/sign_kat_derand_/) | test(=sign_fresh) | test(=sign_with_kat_key)'
slow-timeout = { period = "180s", terminate-after = 2 }

# `coverage` profile: same fast suite as `default`, but with a longer
# per-test cap to absorb llvm-cov instrumentation overhead. Without
# this, CT-by-construction loops like `BigInt::trailing_zeros` push
# KAT-parsing tests past `default`'s 5-min cap under coverage.
[profile.coverage]
slow-timeout = { period = "60s", terminate-after = 30 }

# Sign-side tests under coverage instrumentation can take materially
# longer than the 180s default-profile cap allows: `sign_kat_derand_063`
# / `_072` reproducibly exceed 180s under llvm-cov's
# `-C instrument-coverage` (debug profile, single-threaded). Give
# them the `kat`-profile-style 30-minute slow-timeout so the
# coverage run completes; tests that hang for real still die at the
# 30·60 = 1800s mark.
[[profile.coverage.overrides]]
filter = 'test(/sign_kat_derand_/) | test(=sign_fresh) | test(=sign_with_kat_key)'
slow-timeout = { period = "60s", terminate-after = 30 }

# `kat` profile: long per-test budget for sign_kat_derand_NNN tests.
# Each test runs `sign_derand` + `verify` on one KAT vector. Some
# KAT seeds drop into deterministically-rejection-heavy trajectories
# in the response phase that take 5-30 min depending on how many
# Cornacchia / LLL retries the alpha sampling needs, since our
# pure-Rust Fp arithmetic is ~10-30x slower than C ref's `gf/broadwell/`
# asm. The per-test budget here (30 min) accommodates the long tail
# until the asm-Fp work closes the gap; the GitHub Actions job that
# wraps this is given the full 360 min hard cap to absorb 8-way
# parallel contention on the slowest KATs.
[profile.kat]
test-threads = "num-cpus"
slow-timeout = { period = "60s", terminate-after = 30 }
fail-fast = false

# Override the default profile's 30s cap on sign tests for the kat
# profile — kat is for explicit long-running KAT debugging, where
# we want the full 30-min budget.
[[profile.kat.overrides]]
filter = 'test(/sign_kat_derand_/)'
slow-timeout = { period = "60s", terminate-after = 30 }
