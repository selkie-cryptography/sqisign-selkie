# Default profile: fast, fail-fast.
[profile.default]
failure-output = "immediate"
slow-timeout = { period = "60s", terminate-after = 5 }

# `kat` profile: long per-test budget for sign_kat_derand_NNN tests.
# Each test runs `sign_derand` + `verify` on one KAT vector.
# Sign retry budget is 1000 iters at ~5–40 s/iter, so budget
# 6 minutes per test (plenty for the fast trajectories, kills
# the response-phase-rejection-heavy ones).
[profile.kat]
test-threads = "num-cpus"
slow-timeout = { period = "30s", terminate-after = 12 }
fail-fast = false
