# rdtsc cycle counts for keygen/sign/verify, in megacycles, to compare
# directly against the C reference's `cpucycles()` output (cref-bench).
# x86_64-only at runtime; compiles to a skip stub elsewhere.
[[bench]]
name = "cycles"
harness = false
required-features = ["expose-internals"]

# Utility example: seeds `fuzz/corpus/fuzz_verify/` from the bundled
# KAT vectors so libFuzzer can start mutating from parseable inputs
# instead of bouncing at Signature::from_bytes. Requires the
# `expose-internals` feature because it reads `keys::kat_data`.
[[example]]
name = "seed-fuzz-corpus"
required-features = ["expose-internals"]

# Regenerates `tests/vectors/bigint_fault_simulation.json` from the
# boundary-input recipes embedded in the example source. Reads
# `BigInt<4>` through `expose-internals` for the in-generator
# self-check against production arithmetic.
[[example]]
name = "bigint-fault-vectors-gen"
required-features = ["expose-internals"]

# Regenerates `tests/vectors/fp_fault_simulation.json` from the
# boundary-input recipes embedded in the example source. Reads
# `Fp` through `expose-internals` for the in-generator self-check
# against production arithmetic.
[[example]]
name = "fp-fault-vectors-gen"
required-features = ["expose-internals"]

# Regenerates `tests/vectors/fp2_fault_simulation.json` from the
# boundary-input recipes embedded in the example source. Reads
# `Fp2` through `expose-internals` for the in-generator self-check
# against production arithmetic.
[[example]]
name = "fp2-fault-vectors-gen"
required-features = ["expose-internals"]

# Build profile for CI test runs. Optimized like `release`, with
# three concessions for CI usefulness:
#
# - `debug-assertions` + `overflow-checks` stay on so invariant
#   violations in `BigInt` / curve / lattice code still trip
#   instead of silently propagating through release-mode arithmetic.
# - `debug = "line-tables-only"` keeps file:line info in panic
#   backtraces so test failures in CI logs are diagnosable without
#   re-running locally. Minimal compile / runtime cost.
# - `incremental = true` lets the user crate rebuild partially when
#   `Swatinem/rust-cache` restores dep artifacts. Modest CI win.
#
# Selected via `cargo nextest run --cargo-profile release-checked`.
# The nextest `--profile <name>` flag is separately controlled —
# typically the default nextest profile for fast PR feedback, or
# `--profile kat` for long-running KAT-debug runs.
[profile.release-checked]
inherits = "release"
debug-assertions = true
overflow-checks = true
debug = "line-tables-only"
incremental = true

# Build profile for cargo-mutants. Inherits release-checked so we
# keep debug-assertions + overflow-checks (catching invariant
# violations during mutation testing) but drops debuginfo generation
# entirely. Per https://mutants.rs/performance.html, build time
# dominates the per-mutant cost, and turning off debug symbols is
# the easiest single-knob win. Selected via
# `--cargo-profile mutants` in `.cargo/mutants.toml`.
[profile.mutants]
inherits = "release-checked"
debug = "none"

# Profile for local flamegraph / heap profiling (samply, Instruments
# via cargo-instruments / xctrace, dhat). Release codegen so the hot
# paths match production, plus full debuginfo so the profiler can
# attribute inlined frames. No debug-assertions/overflow-checks (those
# perturb the timing). Used by `scripts/profile.rs` and the
# `profile_sign` example.
[profile.profiling]
inherits = "release"
debug = true
