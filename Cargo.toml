[package]
name = "sqisign"
version = "0.1.1"
edition = "2021"
authors = ["Deirdre Connolly <durumcrustulum@gmail.com>"]
description = "Compact post-quantum signatures from quaternions and isogenies."
license = "MIT"
repository = "https://github.com/selkie-cryptography/sqisign"
keywords = ["cryptography", "sqisign", "sqisign2", "isogenies", "quaternions"]

exclude = [
    ".gitignore",
    ".github/*",
    "codecov.yml"
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
hex = "0.4.3"
lazy_static = "1.4"
rand = "0.8.2"
subtle = "2.4"
zeroize = { version = "1", default-features = false, features = ["zeroize_derive"] }

[dev-dependencies]
criterion = "0.4"
crypto-bigint = "0.5.0"
proptest = "1.0"
proptest-derive = "0.3.0"