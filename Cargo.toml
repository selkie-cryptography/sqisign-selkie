[package]
name = "sqisign-selkie"
version = "0.0.1"
edition = "2021"
rust-version = "1.91.0"
authors = ["Deirdre Connolly <durumcrustulum@gmail.com>"]
description = "Compact post-quantum signatures from quaternions and isogenies."
license = "MIT OR Apache-2.0"
repository = "https://github.com/selkie-cryptography/sqisign-selkie"
keywords = ["cryptography", "sqisign", "post-quantum", "isogenies", "quaternions"]

exclude = [
    ".gitignore",
    ".github/*",
]

[features]
default = ["zeroize"]
zeroize = ["dep:zeroize"]
expose-internals = []
# Variable-time len-tracking on BigInt arithmetic: hot ops loop to the
# operands' effective limb length instead of the full storage width N,
# skipping leading-zero padding. The loop bounds leak operand magnitude,
# so this is for the `main` track only (which matches the variable-time C
# reference); the constant-time `next` track must NOT enable it.
vartime = []
# Exposes `#[no_mangle] mca_*` shims around the inlined hot field
# kernels so `.github/scripts/mca.rs` can isolate them as standalone
# asm symbols for `llvm-mca`.  x86_64-only; cfg's out elsewhere.
mca = []
# Routes the `profile_sign` example through dhat's heap-profiling
# global allocator (writes `dhat-heap.json`). Off by default so time
# profiles keep the real allocator. `dhat` is a dev-dependency, so this
# only affects examples/tests/benches, never the shipped library.
dhat-heap = []

[dependencies]
# TODO: replace with our own SHAKE256 implementation to minimize trusted dependencies.
libcrux-sha3 = "0.0.9"
aes = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] } # { version = "0.10", features = ["os_rng"] }
subtle = "2.6"
zeroize = { version = "1", default-features = false, features = ["zeroize_derive"], optional = true }

[dev-dependencies]
divan = "0.1"
dudect-bencher = "0.7"
gungraun = "0.19"
dhat = "0.3"
tacet = "0.4"
proptest = "1"
mutants = "0.0.4"  # #[mutants::skip] attribute for cargo-mutants
serde = { version = "1", features = ["derive"] }
hex = "0.4"
serde_json = "1"
# Pure-Rust arbitrary-precision integers used as the differential
# oracle for `BigInt<N>` and field-arithmetic proptests in the
# `bigint_oracle` and `field_oracle` integration tests. A second
# independent implementation of the same math catches off-by-ones
# and sign-handling bugs that algebraic-identity proptests miss.
# Kept under `tests/` so it doesn't appear in the `src/` dep graph.
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"

# crabgrind (Valgrind client requests), reqwest (HTTP for C-ref
# cross-checks), and regex are unix-only: crabgrind needs Valgrind
# headers, reqwest's TLS deps don't compile on i686-pc-windows-msvc.
[target.'cfg(unix)'.dev-dependencies]
crabgrind = "0.2"
regex = "1"
reqwest = { version = "0.13", features = ["blocking"] }

# x86_64-only: the `cycles` bench (rdtsc megacycles, compared against the
# C reference's `cpucycles()` in cref-bench). criterion-cycles-per-byte
# builds only on x86/x86_64 -- its aarch64 path is broken upstream
# (0.8.0 emits a compile_error), and rdtsc has no unprivileged aarch64
# peer anyway -- so the deps and the bench body (benches/cycles.rs) are
# both confined to x86_64; elsewhere the bench compiles to a skip stub.
[target.'cfg(target_arch = "x86_64")'.dev-dependencies]
criterion = "0.8"
criterion-cycles-per-byte = "0.8"

