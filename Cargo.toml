[package]
name = "sqisign-selkie"
version = "0.0.1"
edition = "2021"
rust-version = "1.81.0"
authors = ["Deirdre Connolly <durumcrustulum@gmail.com>"]
description = "Compact post-quantum signatures from quaternions and isogenies."
license = "MIT OR Apache-2.0"
repository = "https://github.com/selkie-cryptography/sqisign-selkie"
keywords = ["cryptography", "sqisign", "post-quantum", "isogenies", "quaternions"]

exclude = [
    ".gitignore",
    ".github/*",
]

[features]
default = ["zeroize"]
zeroize = ["dep:zeroize"]
expose-internals = []

# Hand-written aarch64 asm for radix-2⁵¹ Fp::add and Fp::mul.
#
# DO NOT ENABLE without re-benchmarking. On aarch64-apple-darwin the
# asm is consistently slower than the Rust compiler's output for the
# same algorithm: ~10-30% slower for fp2_mul / fp2_square / curve
# doublings, ~30-46% slower for full ladder operations. The Apple
# M-series core is wide and superscalar enough that the Rust path
# already exploits the chip well, and the asm's larger live-register
# footprint forces spills around inlined call sites that the pure
# Rust path avoids. See ePrint 2026-394 ("SQIsign on ARM") for the
# upstream measurement: only 1.22× speedup on M1 vs 1.49× on
# Cortex-A76, and only via NEON 32-bit-lane vectorization with
# 29-bit limbs (a different representation entirely from ours).
#
# The asm module is kept in-tree behind this flag so the cfg
# dispatch, register-operand template, and property-test
# infrastructure remain a working starting point if we ever revisit
# asm for: (a) Cortex-A76-class targets where scalar asm may pay
# off, (b) x86_64 baseline (separate ISA, separate analysis), or
# (c) a NEON SIMD redesign with a different limb representation.
aarch64-radix-51-asm-perf-regression = []

[dependencies]
# TODO: replace with our own SHAKE256 implementation to minimize trusted dependencies.
libcrux-sha3 = "0.0.8"
aes = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] } # { version = "0.10", features = ["os_rng"] }
subtle = "2.6"
zeroize = { version = "1", default-features = false, features = ["zeroize_derive"], optional = true }

[dev-dependencies]
divan = "0.1"
dudect-bencher = "0.7"
iai-callgrind = "0.16"
dhat = "0.3"
tacet = "0.4"
proptest = "1"
mutants = "0.0.4"  # #[mutants::skip] attribute for cargo-mutants
serde = { version = "1", features = ["derive"] }
hex = "0.4"
serde_json = "1"

# crabgrind (Valgrind client requests), reqwest (HTTP for C-ref
# cross-checks), and regex are unix-only: crabgrind needs Valgrind
# headers, reqwest's TLS deps don't compile on i686-pc-windows-msvc.
[target.'cfg(unix)'.dev-dependencies]
crabgrind = "0.2"
regex = "1"
reqwest = { version = "0.13", features = ["blocking"] }

[[bench]]
name = "sqisign"
harness = false

[[bench]]
name = "field"
harness = false
required-features = ["expose-internals"]

[[bench]]
name = "bigint"
harness = false
required-features = ["expose-internals"]

[[bench]]
name = "curves"
