[package]
name = "sqisign-selkie"
version = "0.0.1"
edition = "2021"
rust-version = "1.81.0"
authors = ["Deirdre Connolly <durumcrustulum@gmail.com>"]
description = "Compact post-quantum signatures from quaternions and isogenies."
license = "MIT OR Apache-2.0"
repository = "https://github.com/selkie-cryptography/sqisign-selkie"
keywords = ["cryptography", "sqisign", "post-quantum", "isogenies", "quaternions"]

exclude = [
    ".gitignore",
    ".github/*",
]

[features]
default = ["zeroize"]
zeroize = ["dep:zeroize"]
expose-internals = []
# Test-only: link the C reference's mini-GMP + DPE primitives via FFI
# for bit-equality property tests of the pure-Rust `quaternions::lll`
# port. The `build.rs` script reads `CARGO_FEATURE_FFI_CREF_LLL` and
# only invokes `cc` when this feature is enabled, so the C deps are
# never built into production. Requires the SQIsign C reference at
# `~/src/github.com/SQISign/the-sqisign` (override with
# `SQISIGN_C_REF_PATH`).
ffi-cref-lll = []

[build-dependencies]
cc = "1"

[dependencies]
# TODO: replace with our own SHAKE256 implementation to minimize trusted dependencies.
libcrux-sha3 = "0.0.8"
aes = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] } # { version = "0.10", features = ["os_rng"] }
subtle = "2.6"
zeroize = { version = "1", default-features = false, features = ["zeroize_derive"], optional = true }

[dev-dependencies]
divan = "0.1"
dudect-bencher = "0.7"
iai-callgrind = "0.16"
dhat = "0.3"
tacet = "0.4"
proptest = "1"
mutants = "0.0.4"  # #[mutants::skip] attribute for cargo-mutants
serde = { version = "1", features = ["derive"] }
hex = "0.4"
serde_json = "1"

# crabgrind (Valgrind client requests), reqwest (HTTP for C-ref
# cross-checks), and regex are unix-only: crabgrind needs Valgrind
# headers, reqwest's TLS deps don't compile on i686-pc-windows-msvc.
[target.'cfg(unix)'.dev-dependencies]
crabgrind = "0.2"
regex = "1"
reqwest = { version = "0.13", features = ["blocking"] }

[[bench]]
name = "sqisign"
harness = false

[[bench]]
name = "field"
harness = false
required-features = ["expose-internals"]

[[bench]]
name = "bigint"
harness = false
required-features = ["expose-internals"]

[[bench]]
name = "curves"
harness = false
required-features = ["expose-internals"]

[[bench]]
name = "quaternions"
harness = false
required-features = ["expose-internals"]

[[bench]]
name = "surfaces"
harness = false
required-features = ["expose-internals"]

[[bench]]
name = "deuring"
harness = false
required-features = ["expose-internals"]

[[bench]]
name = "dudect"
harness = false
required-features = ["expose-internals"]

[[bench]]
name = "tacet"
harness = false
required-features = ["expose-internals"]

[[test]]
name = "ctgrind"
required-features = ["expose-internals"]

[[test]]
name = "alloc_budget"
required-features = ["expose-internals"]

[[test]]
name = "zeroize"
required-features = ["expose-internals"]

[[bench]]
name = "iai"
harness = false
required-features = ["expose-internals"]

[[test]]
name = "ffi_cref_lll"
required-features = ["ffi-cref-lll", "expose-internals"]
