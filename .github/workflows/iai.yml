name: Instruction count

# Runs on self-hosted Fly runners. Valgrind instruction counts are
# largely CPU-independent (they count instructions, not cycles), so
# shared-CPU noise barely matters here. Wall-clock latency may vary;
# the reported instruction counts are reliable.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'benches/**'
      - 'Cargo.toml'
      - '.github/workflows/iai.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  iai:
    name: iai-callgrind
    runs-on: [self-hosted, fly, linux, x64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          key: iai

      - uses: taiki-e/install-action@3fa6878dc4ae603f73960271565a082bf196ab96
        with:
          tool: iai-callgrind-runner

      - name: Run iai-callgrind
        run: |
          cargo bench --bench iai --features expose-internals 2>&1 | tee iai-output.txt

      - name: Generate JSON
        run: |
          rustc -O .github/scripts/iai-to-json.rs -o /tmp/iai-to-json
          /tmp/iai-to-json iai-output.txt "${{ github.sha }}" > iai.json

      - name: Verify iai payload has data
        run: jq -e '.total > 0 and (.results | length > 0)' iai.json > /dev/null || { echo "::error::iai.json has no benchmark results"; cat iai.json >&2; exit 1; }
      - name: Upload to CI site
        uses: ./.github/actions/ci-upload
        with:
          kind: iai
          payload: iai.json
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}

      # Job summary on each push run (no PR trigger on this workflow).
      - name: Report (job summary)
        uses: ./.github/actions/ci-pr-report
        with:
          kind: iai
          payload: iai.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
