name: Mutants

# Triggered after a CI run completes. PR mutation = `incremental`
# (changed code only). Push-to-main or scheduled-nightly CI completion
# = `full` (8-shard sweep). Manual `workflow_dispatch` always runs
# `full` regardless of CI state.
#
# Shard intermediates (per-shard mutants.out/outcomes.json) ride
# through the Fly volume at /data/mutants/shards/<sha>/ between the
# `full` matrix jobs and the `full-upload` merge job. This sidesteps
# the GHA artifact storage quota. Migration target: a Tigris bucket
# (Fly's S3-compatible object store) for both mutants shards and fuzz
# corpora / crash inputs; the current volume-based transport is a
# stopgap.

on:
  # Direct triggers for mutants-infra changes. CI's path filter is
  # scoped to src/ + tests/ + benches/, so changes to this workflow
  # or to `.cargo/mutants.toml` don't fire CI and would otherwise be
  # silently un-validated. Same pattern fuzz.yml uses for its own
  # infra paths.
  push:
    branches: [main]
    paths:
      - '.github/workflows/mutants.yml'
      - '.cargo/mutants.toml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mutants.yml'
      - '.cargo/mutants.toml'
  # Indirect: after a CI run on Rust source completes. Most mutant
  # runs come through this gate.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

concurrency:
  # workflow_run sets github.ref to the default branch — key by the
  # triggering run's head_branch so PRs don't share groups.
  group: mutants-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: ${{ github.event.workflow_run.event == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Detect whether the PR diff touches any Rust source files. cargo-
  # mutants has nothing to do on a no-Rust diff (docs / workflow YAML
  # / etc), and skipping the heavy `incremental` job entirely is much
  # cheaper than letting it spin up Fly, install toolchain + tools,
  # build the baseline, and then exit zero. Output is consumed by the
  # `incremental` job's `if:` below.
  incremental-detect:
    name: Detect Rust changes
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request') ||
      github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.head_repository.full_name == github.repository) ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository))
      && '["self-hosted","fly","linux","x64"]'
      || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    # On direct pull_request events dorny ignores base/ref and uses
    # the GitHub API to list changed files; that needs pull-requests:
    # read on top of the workflow-level contents:read.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      has_rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d
        id: filter
        with:
          # Explicit base + ref so paths-filter works on workflow_run
          # (where it can't infer them from the event payload). Same
          # pattern fuzz.yml's detect job uses.
          base: main
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # cargo-mutants runs the default cargo nextest target set
          # (lib unit tests + integration tests under `tests/`), so
          # changes in either directory can produce new mutants or
          # change which mutants survive. Cargo manifest/lockfile
          # changes can shift dep behavior and likewise are relevant.
          filters: |
            rust:
              - 'src/**'
              - 'tests/**'
              - 'Cargo.toml'
              - 'Cargo.lock'

  # PR mutation testing. Fires when CI's pull_request run completes
  # (success or failure — see the job's `if:` for rationale). Tests
  # mutants in changed code only.
  #
  # Routes to Fly on same-repo PRs (where the contributor has
  # write access to the repo and we trust their code). Fork PRs
  # route to GH-hosted `ubuntu-latest` since workflow_run checks
  # out the PR head_sha and that's untrusted contributor code on
  # a public repo.
  incremental:
    needs: [incremental-detect]
    name: Incremental
    # `perf-8x` gives 8 dedicated cores so cargo-mutants can fan the
    # changed-code mutants out in parallel (`-j 6` below). Dedicated
    # cores also avoid shared-CPU throttling during the baseline build.
    # Same-repo runs go to Fly; fork PRs fall back to GH-hosted. Two
    # event paths reach this job (see `if:` below), so the same-repo
    # check has to cover both: workflow_run after a CI run, and the
    # direct pull_request trigger when the PR touches mutants infra.
    runs-on: ${{ fromJSON(
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.head_repository.full_name == github.repository) ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository))
      && '["self-hosted","fly","linux","perf-8x"]'
      || '["ubuntu-latest"]') }}
    permissions:
      contents: read
      # Sticky changed-code mutation-coverage comment on same-repo PRs.
      pull-requests: write
    # Run after CI completes (success OR failure) so a transient
    # red — reviewdog 502, a platform-fly job timeout, an artifact
    # quota miss — doesn't silently kill mutation coverage on the
    # PR. cargo-mutants reports baseline test failure on its own
    # via the "Verify mutants produced real outcomes" step below.
    # Fires on:
    # - workflow_run after CI completes on a PR (the normal path)
    # - direct pull_request when the PR touches mutants infra (this
    #   workflow file or .cargo/mutants.toml), to validate the
    #   workflow itself end-to-end on PR diffs
    if: >-
      needs.incremental-detect.outputs.has_rust == 'true' &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'pull_request') ||
       github.event_name == 'pull_request')
    timeout-minutes: 120
    # sccache against the same Tigris bucket `gate` uses. cargo-mutants
    # rebuilds the crate many times (baseline + one rebuild per mutant);
    # most upstream deps are identical across mutants and across PRs, so
    # the shared rustc-invocation cache gives big hit rates on the dep
    # graph and the baseline build. The `full` matrix below also writes
    # into the same bucket — shards share each other's writes for free.
    env:
      # See gate (ci.yml) for the empty-RUSTC_WRAPPER rationale —
      # same fallback so dependabot / fork PRs that touch mutants
      # infra don't trip on missing sccache creds.
      RUSTC_WRAPPER: ${{ secrets.TIGRIS_SCCACHE_ACCESS_KEY_ID != '' && 'sccache' || '' }}
      SCCACHE_BUCKET: selkie-ci-sccache
      SCCACHE_ENDPOINT: https://fly.storage.tigris.dev
      SCCACHE_REGION: auto
      AWS_ACCESS_KEY_ID: ${{ secrets.TIGRIS_SCCACHE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_SCCACHE_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Generate diff vs main
        # `actions/checkout` ran with `persist-credentials: false`,
        # so the clone has no auth header for the subsequent `git
        # fetch`. Set one up via gh just for this step so the
        # default-low credential lifetime stays elsewhere.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh auth setup-git
          git fetch origin main
          git diff origin/main..HEAD > git.diff

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - uses: mozilla-actions/sccache-action@1583d6b38d7be47f593cb472781bbb21cab4321e  # v0.0.10
        if: env.RUSTC_WRAPPER == 'sccache'
      - uses: taiki-e/install-action@213ccc1a076163c093f914550b94feb90fab916d
        with:
          tool: cargo-mutants,cargo-nextest

      # `continue-on-error`: cargo-mutants exits non-zero when ANY
      # mutant survives — a normal data signal, not a CI failure.
      # The post-run verify step distinguishes real baseline failures
      # (zero outcomes) from "found surviving mutants" (data we want).
      # `--test-tool nextest` and the `--cargo-profile release-checked`
      # build come from `.cargo/mutants.toml`. `--in-place` is CLI-only
      # (no config key in cargo-mutants), so it stays here.
      #
      # `-j 6` runs six mutants concurrently on the 8-core perf-8x box,
      # leaving two cores for each mutant's nextest harness so the test
      # runner isn't starved. `--minimum-test-timeout 180` widens the
      # 60s floor from `.cargo/mutants.toml`: six concurrent nextest
      # suites contend for CPU, so a legitimately-passing test can run
      # several times slower than its solo baseline; the wider floor
      # prevents that contention from being misread as a timeout kill.
      - name: Run cargo-mutants on changed code
        continue-on-error: true
        # `--in-place` is incompatible with `-j > 1` in cargo-mutants
        # (parallel workers would step on the same source tree). We
        # keep `--in-place` here — the changed-code mutant set on a
        # PR is small enough that the overhead of copying the tree per
        # worker would outweigh the parallel speedup, and `--in-place`
        # lets the baseline build be shared. `full` runs `-j 6` without
        # `--in-place` because its shard already partitions the work.
        run: |
          cargo mutants --no-shuffle -vV \
            --in-place \
            --minimum-test-timeout 180 \
            --in-diff git.diff

      - name: sccache stats
        if: ${{ !cancelled() && env.RUSTC_WRAPPER == 'sccache' }}
        run: sccache --show-stats

      - name: Verify mutants produced real outcomes
        run: |
          if [ ! -f mutants.out/outcomes.json ]; then
            echo "::error::mutants.out/outcomes.json missing; cargo-mutants did not run"
            exit 1
          fi
          COUNT=$(jq '[.outcomes[].summary | select(. == "CaughtMutant" or . == "MissedMutant" or . == "Timeout" or . == "Unviable")] | length' mutants.out/outcomes.json)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::cargo-mutants produced zero per-mutant outcomes (likely baseline failure)"
            exit 1
          fi
          echo "verified: $COUNT per-mutant outcomes"

      # Shape the `--in-diff` outcomes into the dashboard payload. The
      # outcomes.json schema is identical to the full run's (cargo-
      # mutants only varies *which* mutants it generates, not the file
      # layout), so the same `mutants-to-json.rs` parser applies.
      - name: Generate changed-code mutants.json
        run: |
          # Unset RUSTC_WRAPPER: skip sccache for this tiny standalone
          # compile (the job sets a wrapper for the crate build).
          env -u RUSTC_WRAPPER rustc -O .github/scripts/mutants-to-json.rs -o /tmp/mutants-to-json
          /tmp/mutants-to-json mutants.out/outcomes.json "${{ github.event.workflow_run.head_sha || github.sha }}" > mutants.json

      # Job summary always; sticky changed-code kill-rate comment on
      # same-repo PRs. No Fly upload — uploads stay push/full-run only,
      # so the dashboard baseline reflects whole-tree runs, not diffs.
      - name: Report changed-code mutation coverage
        uses: ./.github/actions/ci-pr-report
        with:
          kind: mutants
          payload: mutants.json
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # Full sharded sweep. Fires on push-to-main or scheduled-nightly CI
  # completion (success or failure), or on manual dispatch. Each shard
  # runs on a `perf-8x` box and fans its mutant slice out across cores
  # with `-j 6` (see the run step), leaving headroom for each mutant's
  # nextest harness. The ×8 shard count is kept as-is: perf-8x makes
  # each shard faster but the slice-per-shard granularity still bounds
  # tail latency on the slow sign-KAT mutants, so collapsing shards
  # isn't a trivial win — revisit once we have steady-state per-shard
  # wall-times under the parallel runner.
  full:
    name: Full shard ${{ matrix.shard }}
    runs-on: [self-hosted, fly, linux, perf-8x]
    # Same rationale as `incremental`: trigger on CI completion, not
    # success — the merge step's outcome-count check is the real
    # baseline-failure detector. Also fires on direct push to main
    # of mutants infra (this workflow, .cargo/mutants.toml) so the
    # workflow self-validates on its own changes.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.head_branch == 'main' &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'schedule'))
    # 180 min. With sign-KAT exclusion restored, the median per-mutant
    # is ~30-60s, but a long tail of timeout-inducing mutations
    # (infinite loops introduced by mutating a divisor / shift) each
    # consume the full cargo-mutants per-test budget. 90 min wasn't
    # enough to absorb those plus 246 mutants/shard under `-j 6`
    # contention; bumped back to 180 to give the tail room. Paired
    # with the `timeout_multiplier = 3` in `.cargo/mutants.toml` which
    # caps each timeout-tail mutant at ~8 min instead of ~13 min.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    # All 8 shards share the same Tigris-backed sccache bucket;
    # cargo-mutants' identical baseline build hits cross-shard on
    # arrival, and the upstream dep graph stays warm across runs.
    # Replaces the previous shared-key Swatinem step, which had to
    # serialize a target/ tarball restore + save per shard.
    env:
      # See gate (ci.yml) for the empty-RUSTC_WRAPPER rationale.
      RUSTC_WRAPPER: ${{ secrets.TIGRIS_SCCACHE_ACCESS_KEY_ID != '' && 'sccache' || '' }}
      SCCACHE_BUCKET: selkie-ci-sccache
      SCCACHE_ENDPOINT: https://fly.storage.tigris.dev
      SCCACHE_REGION: auto
      AWS_ACCESS_KEY_ID: ${{ secrets.TIGRIS_SCCACHE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_SCCACHE_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - uses: mozilla-actions/sccache-action@1583d6b38d7be47f593cb472781bbb21cab4321e  # v0.0.10
        if: env.RUSTC_WRAPPER == 'sccache'
      - uses: taiki-e/install-action@213ccc1a076163c093f914550b94feb90fab916d
        with:
          tool: cargo-mutants,cargo-nextest
      # `--test-tool nextest` and `--cargo-profile release-checked`
      # come from `.cargo/mutants.toml`. `-j 6` fans this shard's
      # mutant slice across six of the eight cores, reserving two for
      # each mutant's nextest harness; `--minimum-test-timeout 180`
      # widens the 60s floor so contention between the six concurrent
      # suites isn't misread as a timeout kill.
      - name: Run cargo-mutants (shard ${{ matrix.shard }}/8)
        continue-on-error: true
        run: |
          cargo mutants --shard ${{ matrix.shard }}/8 -vV \
            -j 6 \
            --minimum-test-timeout 180

      - name: sccache stats
        if: ${{ !cancelled() && env.RUSTC_WRAPPER == 'sccache' }}
        run: sccache --show-stats

      # Ship the shard's outcomes.json to the Fly site rather than to
      # GHA artifact storage. GHA artifacts are quota-capped and the
      # only consumer (the `full-upload` merge job) lives in this same
      # workflow, so a side channel through the dashboard volume is
      # strictly better. The full-upload job pulls these back via
      # flyctl sftp.
      - name: Build ci-scratch
        if: ${{ !cancelled() && hashFiles('mutants.out/outcomes.json') != '' }}
        run: rustc -O .github/scripts/ci-scratch.rs -o /tmp/ci-scratch
      - name: Ship shard outcomes to Tigris scratch
        if: ${{ !cancelled() && hashFiles('mutants.out/outcomes.json') != '' }}
        env:
          TIGRIS_ACCESS_KEY_ID: ${{ secrets.TIGRIS_ACCESS_KEY_ID }}
          TIGRIS_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_SECRET_ACCESS_KEY }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          SHARD: ${{ matrix.shard }}
        run: /tmp/ci-scratch put mutants "${SHA}" "shard-${SHARD}" mutants.out/outcomes.json

  # Merge + verify + upload the full sweep. Skipped on PR.
  full-upload:
    name: Merge and upload full results
    needs: full
    if: >-
      always() && needs.full.result != 'skipped' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event_name == 'push' ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: [self-hosted, fly, linux, x64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Build ci-scratch
        run: rustc -O .github/scripts/ci-scratch.rs -o /tmp/ci-scratch
      - name: Pull shard outcomes from Tigris scratch
        env:
          TIGRIS_ACCESS_KEY_ID: ${{ secrets.TIGRIS_ACCESS_KEY_ID }}
          TIGRIS_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_SECRET_ACCESS_KEY }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          mkdir -p shards
          /tmp/ci-scratch get mutants "${SHA}" shards
          ls -la shards
          if [ -z "$(ls -A shards)" ]; then
            echo "::error::No shard outcomes found in mutants/${SHA}/"
            exit 1
          fi

      - name: Merge outcomes
        run: |
          FOUND=$(find shards -name '*.json' 2>/dev/null)
          if [ -z "$FOUND" ]; then
            echo "::error::No shard outcomes found"
            exit 1
          fi
          find shards -name '*.json' -print0 | xargs -0 jq -s '{outcomes: map(.outcomes) | add}' > merged-outcomes.json
          COUNT=$(jq '[.outcomes[].summary | select(. == "CaughtMutant" or . == "MissedMutant" or . == "Timeout" or . == "Unviable")] | length' merged-outcomes.json)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::all shards produced zero per-mutant outcomes (likely baseline failure)"
            exit 1
          fi
          echo "merged: $COUNT per-mutant outcomes"

      - name: Generate site JSON
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          rustc -O .github/scripts/mutants-to-json.rs -o /tmp/mutants-to-json
          /tmp/mutants-to-json merged-outcomes.json "$SHA" > mutants.json
          jq -e '.summary.total > 0' mutants.json > /dev/null || { echo "::error::mutants.json reports zero mutants"; head -c 2000 mutants.json >&2; exit 1; }

      - name: Upload to CI site
        uses: ./.github/actions/ci-upload
        with:
          kind: mutants
          payload: mutants.json
          sha: ${{ github.event.workflow_run.head_sha || github.sha }}
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}

      # Sweep the per-SHA scratch intermediates now that the merged
      # result is published. The bucket lifecycle rule auto-expires
      # objects after 7 days, so a failed clean is non-fatal; this
      # is hygiene, not durability. Only on success — keep the
      # intermediates around for a manual rerun if the merge or
      # upload failed.
      - name: Prune Tigris scratch
        env:
          TIGRIS_ACCESS_KEY_ID: ${{ secrets.TIGRIS_ACCESS_KEY_ID }}
          TIGRIS_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_SECRET_ACCESS_KEY }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: /tmp/ci-scratch clean mutants "${SHA}"
