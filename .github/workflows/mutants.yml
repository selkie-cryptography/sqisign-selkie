name: Mutation testing

# Gated on CI passing — mutants only runs after the corresponding CI
# run completes successfully. PR mutation = `incremental` (changed
# code only). Push-to-main or scheduled-nightly CI completion =
# `full` (8-shard sweep). Manual `workflow_dispatch` always runs
# `full` regardless of CI state.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

concurrency:
  # workflow_run sets github.ref to the default branch — key by the
  # triggering run's head_branch so PRs don't share groups.
  group: mutants-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: ${{ github.event.workflow_run.event == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # PR mutation testing. Fires only when CI's pull_request run
  # finishes green. Tests mutants in changed code only.
  #
  # Routes to Fly on same-repo PRs (where the contributor has
  # write access to the repo and we trust their code). Fork PRs
  # route to GH-hosted `ubuntu-latest` since workflow_run checks
  # out the PR head_sha and that's untrusted contributor code on
  # a public repo.
  incremental:
    name: Incremental
    runs-on: ${{ fromJSON(github.event.workflow_run.head_repository.full_name == github.repository && '["self-hosted","fly","linux","x64"]' || '["ubuntu-latest"]') }}
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Generate diff vs main
        run: |
          git fetch origin main
          git diff origin/main..HEAD > git.diff

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - uses: taiki-e/install-action@3fa6878dc4ae603f73960271565a082bf196ab96
        with:
          tool: cargo-mutants,cargo-nextest

      # `continue-on-error`: cargo-mutants exits non-zero when ANY
      # mutant survives — a normal data signal, not a CI failure.
      # The post-run verify step distinguishes real baseline failures
      # (zero outcomes) from "found surviving mutants" (data we want).
      - name: Run cargo-mutants on changed code
        continue-on-error: true
        run: |
          cargo mutants --no-shuffle -vV \
            --test-tool nextest \
            --in-place \
            --in-diff git.diff -- --lib \
            -E 'not test(/sign_kat_derand_/)'

      - name: Verify mutants produced real outcomes
        run: |
          if ! grep -qE '^(\+\+\+ b/|--- a/).*\.rs$' git.diff; then
            echo "diff touches no Rust sources; nothing to do"
            exit 0
          fi
          if [ ! -f mutants.out/outcomes.json ]; then
            echo "::error::mutants.out/outcomes.json missing; cargo-mutants did not run"
            exit 1
          fi
          COUNT=$(jq '[.outcomes[].summary | select(. == "CaughtMutant" or . == "MissedMutant" or . == "Timeout" or . == "Unviable")] | length' mutants.out/outcomes.json)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::cargo-mutants produced zero per-mutant outcomes (likely baseline failure)"
            exit 1
          fi
          echo "verified: $COUNT per-mutant outcomes"

      - name: Archive mutants.out
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutants-incremental.out
          path: mutants.out

  # Full sharded sweep. Fires on push-to-main CI success, nightly CI
  # success, or manual dispatch. perf-8x makes each shard ~4× faster
  # than the previous perf-2x default.
  full:
    name: Full shard ${{ matrix.shard }}
    runs-on: [self-hosted, fly, linux, x64, perf-8x]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'schedule'))
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          key: mutants-${{ matrix.shard }}
      - uses: taiki-e/install-action@3fa6878dc4ae603f73960271565a082bf196ab96
        with:
          tool: cargo-mutants,cargo-nextest
      - name: Run cargo-mutants (shard ${{ matrix.shard }}/8)
        continue-on-error: true
        run: |
          cargo mutants --shard ${{ matrix.shard }}/8 \
            --test-tool nextest \
            --in-place \
            -vV -- --lib \
            -E 'not test(/sign_kat_derand_/)'
      - name: Archive mutants.out
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: mutants.out

  # Merge + verify + upload the full sweep. Skipped on PR.
  full-upload:
    name: Merge and upload full results
    needs: full
    if: >-
      always() && needs.full.result != 'skipped' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: [self-hosted, fly, linux, x64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Download all shard artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: mutants-shard-*
          path: shards

      - name: Merge outcomes
        run: |
          FOUND=$(find shards -name outcomes.json 2>/dev/null)
          if [ -z "$FOUND" ]; then
            echo "::error::No shard outcomes found"
            exit 1
          fi
          find shards -name outcomes.json -print0 | xargs -0 jq -s '{outcomes: map(.outcomes) | add}' > merged-outcomes.json
          COUNT=$(jq '[.outcomes[].summary | select(. == "CaughtMutant" or . == "MissedMutant" or . == "Timeout" or . == "Unviable")] | length' merged-outcomes.json)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::all shards produced zero per-mutant outcomes (likely baseline failure)"
            exit 1
          fi
          echo "merged: $COUNT per-mutant outcomes"

      - name: Generate site JSON
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          rustc -O .github/scripts/mutants-to-json.rs -o /tmp/mutants-to-json
          /tmp/mutants-to-json merged-outcomes.json "$SHA" > mutants.json
          jq -e '.summary.total > 0' mutants.json > /dev/null || { echo "::error::mutants.json reports zero mutants"; head -c 2000 mutants.json >&2; exit 1; }

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Upload to CI site
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          rustc -O .github/scripts/ci-upload.rs -o /tmp/ci-upload
          /tmp/ci-upload mutants mutants.json "$SHA"
