name: Mutation testing (full)

# Full mutation run, sharded across 8 workers.
# Runs weekly and on-demand.  PRs get incremental coverage in ci.yml.
on:
  schedule:
    - cron: "0 6 * * 1"   # every Monday at 06:00 UTC
  workflow_dispatch:       # manual trigger

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  mutants:
    name: Shard ${{ matrix.shard }}/8
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          key: mutants-${{ matrix.shard }}
      - uses: taiki-e/install-action@fd0f63e180a477d7434580b6d80817978b9ff2b8
        with:
          tool: cargo-mutants
      - name: Run cargo-mutants (shard ${{ matrix.shard }}/8)
        run: cargo mutants --shard ${{ matrix.shard }}/8 -vV -- --lib
      - name: Archive mutants.out
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: mutants.out

  upload:
    name: Merge and upload results
    needs: mutants
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download all shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mutants-shard-*
          path: shards

      - name: Merge outcomes
        run: |
          # Merge all shard outcomes.json into one.
          jq -s '{outcomes: map(.outcomes) | add}' \
            shards/*/outcomes.json > merged-outcomes.json

      - name: Generate site JSON
        run: |
          bash .github/scripts/mutants-to-json.sh \
            merged-outcomes.json "${{ github.sha }}" \
            > mutants.json

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Upload to CI site
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: bash .github/scripts/ci-upload.sh mutants mutants.json "${{ github.sha }}"
