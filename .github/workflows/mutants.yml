name: Mutation testing

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # --- Incremental: runs on every push/PR, tests only changed code ---
  incremental:
    name: Incremental
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        if: github.ref == 'refs/heads/main'
      - name: Signal running
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: rustc -O .github/scripts/ci-signal.rs -o /tmp/ci-signal && /tmp/ci-signal mutants running "${{ github.sha }}"

      - name: Generate diff
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff "origin/${BASE_REF}".. > git.diff
          elif [ -n "${BEFORE_SHA}" ] \
               && [ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            git diff "${BEFORE_SHA}..HEAD" > git.diff
          else
            # Force-push or new branch: BEFORE_SHA is absent from history.
            # Diff the pushed tip against its first parent instead.
            git diff "HEAD~1..HEAD" > git.diff
          fi

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - uses: taiki-e/install-action@51cd0b8c0499559d9a4d75c0f5c67bec3a894ec8
        with:
          tool: cargo-mutants,cargo-nextest

      - name: Run cargo-mutants on changed code
        continue-on-error: true
        run: |
          cargo mutants --no-shuffle -vV \
            --test-tool nextest \
            --in-place \
            --in-diff git.diff -- --lib \
            -E 'not test(/sign_kat_derand_/)'

      - name: Archive mutants.out
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutants-incremental.out
          path: mutants.out

      # Fail loudly if cargo-mutants didn't actually test any mutants
      # (e.g. the unmutated baseline failed). Without this, an empty
      # outcomes.json silently uploads {caught:0, missed:0, timeout:0}
      # and the dashboard shows a clean tick for a broken run.
      - name: Verify mutants produced real outcomes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if ! grep -qE '^(\+\+\+ b/|--- a/).*\.rs$' git.diff; then
            echo "diff touches no Rust sources; nothing for cargo-mutants to do"
            exit 0
          fi
          if [ ! -f mutants.out/outcomes.json ]; then
            echo "::error::mutants.out/outcomes.json missing; cargo-mutants did not run"
            exit 1
          fi
          COUNT=$(jq '[.outcomes[].summary | select(. == "CaughtMutant" or . == "MissedMutant" or . == "Timeout" or . == "Unviable")] | length' mutants.out/outcomes.json)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::cargo-mutants produced zero per-mutant outcomes (likely baseline failure); refusing to upload zero-record"
            exit 1
          fi
          echo "verified: $COUNT per-mutant outcomes"

      - name: Generate and merge mutants JSON for CI site
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          rustc -O .github/scripts/mutants-to-json.rs -o /tmp/mutants-to-json
          /tmp/mutants-to-json \
            mutants.out/outcomes.json "${{ github.sha }}" \
            > mutants-incremental.json
          rustc -O .github/scripts/merge-mutants.rs -o /tmp/merge-mutants
          /tmp/merge-mutants \
            mutants-incremental.json "${{ github.sha }}" \
            > mutants.json

      - name: Upload mutants to CI site
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: rustc -O .github/scripts/ci-upload.rs -o /tmp/ci-upload && /tmp/ci-upload mutants mutants.json "${{ github.sha }}"

  # --- Full: sharded across 8 workers, every push + manual ---
  full:
    name: Full shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          key: mutants-${{ matrix.shard }}
      - uses: taiki-e/install-action@51cd0b8c0499559d9a4d75c0f5c67bec3a894ec8
        with:
          tool: cargo-mutants,cargo-nextest
      - name: Run cargo-mutants (shard ${{ matrix.shard }}/16)
        continue-on-error: true
        run: |
          cargo mutants --shard ${{ matrix.shard }}/8 \
            --test-tool nextest \
            --in-place \
            -vV -- --lib \
            -E 'not test(/sign_kat_derand_/)'
      - name: Archive mutants.out
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: mutants.out

  full-upload:
    name: Merge and upload full results
    needs: full
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download all shard artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: mutants-shard-*
          path: shards

      - name: Merge outcomes
        run: |
          FOUND=$(find shards -name outcomes.json 2>/dev/null)
          if [ -z "$FOUND" ]; then
            echo "::error::No shard outcomes found"
            exit 1
          fi
          find shards -name outcomes.json -print0 | xargs -0 jq -s '{outcomes: map(.outcomes) | add}' > merged-outcomes.json
          # Fail loudly if every shard's baseline broke. Otherwise we
          # would happily upload {caught:0, missed:0, timeout:0} and
          # the dashboard would show a clean tick for an empty run.
          COUNT=$(jq '[.outcomes[].summary | select(. == "CaughtMutant" or . == "MissedMutant" or . == "Timeout" or . == "Unviable")] | length' merged-outcomes.json)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::all shards produced zero per-mutant outcomes (likely baseline failure); refusing to upload zero-record"
            exit 1
          fi
          echo "merged: $COUNT per-mutant outcomes"

      - name: Generate site JSON
        run: |
          rustc -O .github/scripts/mutants-to-json.rs -o /tmp/mutants-to-json
          /tmp/mutants-to-json \
            merged-outcomes.json "${{ github.sha }}" \
            > mutants.json

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Upload to CI site
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: rustc -O .github/scripts/ci-upload.rs -o /tmp/ci-upload && /tmp/ci-upload mutants mutants.json "${{ github.sha }}"
