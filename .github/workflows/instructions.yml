name: Instruction count

# Runs on self-hosted Fly runners. Valgrind instruction counts are
# largely CPU-independent (they count instructions, not cycles), so
# shared-CPU noise barely matters here. Wall-clock latency may vary;
# the reported instruction counts are reliable. The bench is configured
# (in benches/instructions.rs) with cache + branch simulation and emits
# a per-benchmark Ir flamegraph.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'benches/**'
      - 'tests/**'
      - 'Cargo.toml'
      - '.github/workflows/instructions.yml'
      - '.github/scripts/instructions-report.rs'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'benches/**'
      - 'tests/**'
      - 'Cargo.toml'
      - '.github/workflows/instructions.yml'
      - '.github/scripts/instructions-report.rs'
  workflow_dispatch:
    inputs:
      deep_profile:
        description: "Cache + branch simulation (full L1/LL/branch + EstimatedCycles; ~2x slower)"
        type: boolean
        default: false

# Supersede in-flight PR runs; never cancel a main run mid-upload.
concurrency:
  group: instructions-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write  # sticky comment on PRs

env:
  CARGO_TERM_COLOR: always

jobs:
  instructions:
    name: gungraun
    runs-on: [self-hosted, fly, linux, x64]
    # Generous: keygen + sign run under Valgrind with cache simulation.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          key: instructions

      # gungraun-runner must match the `gungraun` lib version the bench
      # actually resolves to (gungraun-runner refuses on version skew, so an
      # exact pin breaks the moment upstream ships a patch). Read the resolved
      # version from `cargo metadata` and install that. Not in taiki-e/install-
      # action's manifest, so build from crates.io; cached by rust-cache.
      - name: Install gungraun-runner
        run: |
          set -euo pipefail
          ver=$(cargo metadata --format-version 1 \
            | jq -r '.packages[] | select(.name=="gungraun") | .version' \
            | head -1)
          if [ -z "$ver" ]; then
            echo "::error::could not resolve gungraun version from cargo metadata"; exit 1
          fi
          echo "Installing gungraun-runner $ver to match resolved gungraun"
          cargo install gungraun-runner --version "$ver" --locked

      # --save-summary=json writes the per-bench summary.json we parse. Cache
      # and branch simulation are off by default (fast); the deep_profile
      # dispatch input appends them globally for a full L1/LL/branch +
      # EstimatedCycles profile (~2x slower — sign/keygen roughly double).
      - name: Run gungraun
        run: |
          set -euo pipefail  # so a bench failure isn't masked by `tee` exit 0
          args=(--save-summary=json)
          if [ "${{ inputs.deep_profile }}" = "true" ]; then
            args+=(--callgrind-args="--cache-sim=yes --branch-sim=yes")
          fi
          cargo bench --bench instructions --features expose-internals -- \
            "${args[@]}" 2>&1 | tee instructions-output.txt

      - name: Generate JSON
        run: |
          rustc -O .github/scripts/instructions-report.rs -o /tmp/instructions-report
          /tmp/instructions-report target/gungraun "${{ github.sha }}" > instructions.json

      - name: Verify instructions payload has data
        run: jq -e '.total > 0 and (.results | length > 0)' instructions.json > /dev/null || { echo "::error::instructions.json has no benchmark results"; cat instructions.json >&2; exit 1; }

      # Host the per-benchmark flamegraph SVGs so the report can embed them.
      # Ungated (PR runs need their graphs live to render in the comment) but
      # skipped on fork PRs, which can't see the Fly token.
      # Best-effort: a flaky flyctl download or sftp hiccup must not fail the
      # run or skip the Report below — the flamegraph URLs just 404 until the
      # next successful run.
      - name: Host flamegraphs
        continue-on-error: true
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: ./.github/actions/ci-upload
        with:
          assets: target/gungraun
          remote-subdir: instructions/flamegraphs/${{ github.sha }}
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}

      # Upload the data payload only from main: a PR or branch dispatch must
      # not clobber main's stored baseline.
      - name: Upload to CI site
        if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/ci-upload
        with:
          kind: instructions
          payload: instructions.json
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}

      # Job summary always; sticky comment on same-repo PRs.
      - name: Report
        uses: ./.github/actions/ci-pr-report
        with:
          kind: instructions
          payload: instructions.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
