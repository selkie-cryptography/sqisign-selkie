name: Coverage

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'benches/**'
      - 'Cargo.toml'
      - '.config/nextest.toml'
      - '.github/workflows/coverage.yml'
  schedule:
    # Nightly fallback so coverage still runs when a day's pushes all
    # miss the path filter above (e.g., workflow-only changes).
    - cron: "0 7 * * *"
  workflow_dispatch:

# Coverage runs on main pushes (and the nightly fallback) and we
# only care about the latest snapshot — cancel a superseded run if
# a newer commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: Code coverage
    runs-on: [self-hosted, fly, linux, x64]
    # Two un-`#[ignore]`d sign() KATs (`sign_kat_derand_001/009`) added
    # to cover `keys/signing.rs`; each is several minutes under llvm-cov
    # instrumentation. Bumped from 30 to 60 to absorb without flake.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - name: Signal running
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: rustc -O .github/scripts/ci-signal.rs -o /tmp/ci-signal && /tmp/ci-signal coverage running "${{ github.sha }}"

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - uses: taiki-e/install-action@3fa6878dc4ae603f73960271565a082bf196ab96
        with:
          tool: cargo-llvm-cov,cargo-nextest

      - name: Collect coverage (nextest + doctests)
        run: |
          cargo +nightly llvm-cov --no-report nextest --profile coverage
          cargo +nightly llvm-cov --no-report --doc

      - name: Generate coverage report
        run: |
          set -o pipefail
          echo '## Code Coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cargo +nightly llvm-cov report --doctests --fail-under-lines 50 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Generate coverage JSON for CI site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p coverage-out
          cargo +nightly llvm-cov report --doctests --lcov --output-path coverage-out/coverage.lcov
          rustc -O .github/scripts/lcov-to-json.rs -o /tmp/lcov-to-json
          /tmp/lcov-to-json coverage-out/coverage.lcov "${{ github.sha }}" \
            > coverage-out/coverage.json

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - name: Verify coverage payload has data
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: jq -e '(.total.total // 0) > 0 and (.modules | length > 0)' coverage-out/coverage.json > /dev/null || { echo "::error::coverage.json has no module data"; head -c 2000 coverage-out/coverage.json >&2; exit 1; }
      - name: Upload coverage to CI site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: rustc -O .github/scripts/ci-upload.rs -o /tmp/ci-upload && /tmp/ci-upload coverage coverage-out/coverage.json "${{ github.sha }}"
