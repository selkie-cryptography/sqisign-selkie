name: Coverage

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'benches/**'
      - 'Cargo.toml'
      - '.config/nextest.toml'
      - '.github/workflows/coverage.yml'
      - '.github/actions/ci-pr-report/action.yml'
      - '.github/scripts/ci-report.rs'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'benches/**'
      - 'Cargo.toml'
      - '.config/nextest.toml'
      - '.github/workflows/coverage.yml'
      - '.github/actions/ci-pr-report/action.yml'
      - '.github/scripts/ci-report.rs'
  schedule:
    # Nightly fallback so coverage still runs when a day's pushes all
    # miss the path filter above (e.g., workflow-only changes).
    - cron: "0 7 * * *"
  workflow_dispatch:

# Coverage runs on main pushes (and the nightly fallback) and we
# only care about the latest snapshot — cancel a superseded run if
# a newer commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Cron fallback: skip a scheduled firing if any non-cron run on
  # main has already fired in the last 24h (= the cron interval).
  # The cron is the fallback for genuinely-quiet days; if a push
  # triggered coverage yesterday afternoon, there's no value in
  # re-running today's nightly.
  cron-gate:
    name: Cron gate (skip if recent run on main)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # `actions: read` is needed to list workflow runs (the
    # github-script step calls actions API); contents:read alone
    # returns 403 on that endpoint.
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Look for non-cron runs on main in last 24h
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const cutoff = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'coverage.yml',
              per_page: 50,
            });
            const recent = data.workflow_runs.filter(r =>
              r.id !== context.runId &&
              r.event !== 'schedule' &&
              r.head_branch === 'main' &&
              r.created_at >= cutoff
            ).length;
            core.setOutput('skip', recent > 0 ? 'true' : 'false');
            core.info(recent > 0
              ? `Found ${recent} non-cron coverage run(s) on main since ${cutoff}; skipping this cron firing.`
              : `No non-cron coverage runs on main since ${cutoff}; proceeding with cron firing.`);

  coverage:
    name: Code coverage
    needs: [cron-gate]
    # On non-schedule triggers cron-gate is skipped → `!cancelled()`
    # lets this job's `if:` still evaluate. On schedule, gate on the
    # cron-gate output.
    if: |
      !cancelled() &&
      (github.event_name != 'schedule' ||
       needs.cron-gate.outputs.skip == 'false')
    # The long tail under llvm-cov is the 100 `sign_kat_derand_NNN`
    # tests (40-220s each instrumented); nextest runs `num-cpus` of
    # them at a time. The 120 min budget covers that plus the
    # instrumented build.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      # Sticky coverage comment on pull requests.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # valgrind: the ctgrind suite (expose-internals) links crabgrind,
      # whose build script needs <valgrind/valgrind.h>.
      - uses: ./.github/actions/setup-linux-deps
        with:
          packages: mold valgrind

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - name: Signal running
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: rustc -O .github/scripts/ci-signal.rs -o /tmp/ci-signal && /tmp/ci-signal coverage running "${{ github.sha }}"

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # nightly
        with:
          toolchain: nightly
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - uses: taiki-e/install-action@5bf6ce016fd2e72eefc647cbca1e4213f65955b8
        with:
          tool: cargo-llvm-cov,cargo-nextest

      - name: Collect coverage (nextest + doctests)
        run: |
          cargo +nightly llvm-cov --features expose-internals --no-report nextest --profile coverage
          cargo +nightly llvm-cov --features expose-internals --no-report --doc

      - name: Generate coverage report
        run: |
          set -o pipefail
          echo '## Code Coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cargo +nightly llvm-cov report --doctests --fail-under-lines 50 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # Built on every run (push + PR) so the PR report has data; only
      # the upload below is push-to-main.
      - name: Generate coverage JSON
        run: |
          mkdir -p coverage-out
          cargo +nightly llvm-cov report --doctests --lcov --output-path coverage-out/coverage.lcov
          rustc -O .github/scripts/lcov-to-json.rs -o /tmp/lcov-to-json
          /tmp/lcov-to-json coverage-out/coverage.lcov "${{ github.sha }}" \
            > coverage-out/coverage.json

      - name: Verify coverage payload has data
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: jq -e '(.total.total // 0) > 0 and (.modules | length > 0)' coverage-out/coverage.json > /dev/null || { echo "::error::coverage.json has no module data"; head -c 2000 coverage-out/coverage.json >&2; exit 1; }
      - name: Upload coverage to CI site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/ci-upload
        with:
          kind: coverage
          payload: coverage-out/coverage.json
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}

      # Job summary always; sticky coverage comment on same-repo PRs.
      - name: Report coverage
        uses: ./.github/actions/ci-pr-report
        with:
          kind: coverage
          payload: coverage-out/coverage.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
