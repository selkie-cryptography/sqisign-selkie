name: Coverage

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'benches/**'
      - 'Cargo.toml'
      - '.config/nextest.toml'
      - '.github/scripts/**'
      - '.github/workflows/coverage.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: Code coverage
    runs-on: ubuntu-24.04
    # Two un-`#[ignore]`d sign() KATs (`sign_kat_derand_001/009`) added
    # to cover `keys/signing.rs`; each is several minutes under llvm-cov
    # instrumentation. Bumped from 30 to 60 to absorb without flake.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - name: Signal running
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: rustc -O .github/scripts/ci-signal.rs -o /tmp/ci-signal && /tmp/ci-signal coverage running "${{ github.sha }}"

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - uses: taiki-e/install-action@51cd0b8c0499559d9a4d75c0f5c67bec3a894ec8
        with:
          tool: cargo-llvm-cov,cargo-nextest

      - name: Collect coverage (nextest + doctests)
        run: |
          cargo +nightly llvm-cov --no-report nextest --profile coverage
          cargo +nightly llvm-cov --no-report --doc

      - name: Generate coverage report
        run: |
          set -o pipefail
          echo '## Code Coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cargo +nightly llvm-cov report --doctests --fail-under-lines 50 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Generate coverage JSON for CI site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p coverage-out
          cargo +nightly llvm-cov report --doctests --lcov --output-path coverage-out/coverage.lcov
          rustc -O .github/scripts/lcov-to-json.rs -o /tmp/lcov-to-json
          /tmp/lcov-to-json coverage-out/coverage.lcov "${{ github.sha }}" \
            > coverage-out/coverage.json

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - name: Upload coverage to CI site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: rustc -O .github/scripts/ci-upload.rs -o /tmp/ci-upload && /tmp/ci-upload coverage coverage-out/coverage.json "${{ github.sha }}"
