name: C ref baseline (mini-gmp + ref GF)

# Apples-to-apples comparison: build the SQIsign C reference with the
# bundled mini-gmp (no asm) and the portable ref GF backend (no asm
# Fp), then run keypair/sign/verify against our Rust crate's
# benches/sqisign.rs on the same runner.
#
# Runs on self-hosted Fly (shared-cpu-2x). The comparison is on the
# same runner so relative C-vs-Rust signal is preserved even with
# neighbor-job noise. Absolute numbers shift across runs.
#
# Manual-dispatch only. Interop with the C ref is covered by the
# KAT tests in `gate`; this workflow is just for ad-hoc relative
# perf snapshots, not a continuous signal.

on:
  workflow_dispatch:
    inputs:
      cref_ref:
        description: 'C ref commit to benchmark (overrides default pin)'
        required: false
        default: ''
      verify_reps:
        description: 'Verify iterations (default 100)'
        required: false
        default: ''

permissions:
  contents: read

env:
  # Pin upstream so timing comparisons are reproducible. Default pin
  # can be overridden per-run via the workflow_dispatch input.
  CREF_REPO: SQIsign/the-sqisign
  CREF_REF: ${{ inputs.cref_ref || 'dd133d7aca576c361a270c8e6434832535b42ecc' }}
  # Iteration counts. Sign + keygen are slow and rejection-sampled, so
  # we run a handful of repetitions; verify is ~ms-scale, run more.
  KEYGEN_REPS: "5"
  SIGN_REPS: "5"
  VERIFY_REPS: ${{ inputs.verify_reps || '100' }}
  CARGO_TERM_COLOR: always

# The C side is pinned by CREF_REF, so its build artifacts are
# reproducible across runs. Cache the build tree to skip clone +
# patch + configure + compile on every push.
#
# Cache miss happens when CREF_REF changes (manual dispatch with a
# new pin, or future bump of the default), or when the cache key's
# version salt is bumped after a configure-flag change.
jobs:
  baseline:
    name: C ref vs Rust (NIST-I)
    runs-on: [self-hosted, fly, linux, x64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      # ---------------- C reference ----------------
      - name: Restore C ref build cache
        id: cref-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: cref/build
          key: cref-build-${{ runner.os }}-${{ env.CREF_REF }}-mini-gmp-ref-v1

      - name: Clone C reference at pinned commit
        if: steps.cref-cache.outputs.cache-hit != 'true'
        run: |
          git clone --no-checkout "https://github.com/${CREF_REPO}.git" cref
          git -C cref checkout "${CREF_REF}"

      - name: Patch stray unconditional gmp.h include
        # ibz_division.c includes <gmp.h> unconditionally, bypassing
        # the MINI_GMP toggle that intbig.h uses. Mirror the toggle so
        # the build can find the right type definitions when system
        # libgmp is absent.
        if: steps.cref-cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          file=cref/src/quaternion/ref/generic/hnf/ibz_division.c
          test -f "$file"
          # Replace the line with the conditional block.
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("cref/src/quaternion/ref/generic/hnf/ibz_division.c")
          src = p.read_text()
          old = "#include <gmp.h>\n"
          new = (
              "#if defined(MINI_GMP)\n"
              "#include <mini-gmp.h>\n"
              "#include <mini-gmp-extra.h>\n"
              "#else\n"
              "#include <gmp.h>\n"
              "#endif\n"
          )
          assert src.count(old) == 1, "expected exactly one unconditional include"
          p.write_text(src.replace(old, new, 1))
          PY
          grep -A4 'MINI_GMP' "$file" | head -8

      - name: Configure C ref (mini-gmp + ref GF, NIST-I, Release)
        if: steps.cref-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S cref -B cref/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DGMP_LIBRARY=MINI \
            -DSQISIGN_BUILD_TYPE=ref \
            -DENABLE_TESTS=OFF \
            -DENABLE_STRICT=OFF

      - name: Build C ref benchmark
        if: steps.cref-cache.outputs.cache-hit != 'true'
        run: cmake --build cref/build -j --target benchmark_lvl1

      - name: Run C ref benchmark
        run: |
          set -o pipefail
          {
            echo "## C reference (mini-gmp + ref GF, NIST-I)"
            echo
            echo '```'
            ./cref/build/apps/benchmark_lvl1 -i "${VERIFY_REPS}" 2>&1 | tee cref-bench.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------------- Rust ----------------
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          key: cref-bench-baseline

      - name: Run Rust benchmark
        run: |
          set -o pipefail
          {
            echo "## Rust crate (sqisign-selkie, NIST-I)"
            echo
            echo '```'
            cargo bench --bench sqisign --features expose-internals 2>&1 | tee rust-bench.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
