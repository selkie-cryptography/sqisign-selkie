name: Infra CI

# CI for the self-hosted runner stack: the orchestrator Rust
# service and the runner Docker image. The runner image is split —
# `Dockerfile.base` → `:base` (heavy, rare) and `Dockerfile.runtime`
# → `:latest` (thin, FROM :base).
#
# Deploy chain: `:base` → `:latest` → orchestrator. The orchestrator
# spawns Machines from `:latest`, so a coordinated change lands the
# runner image first; new orchestrator code goes live against the
# image it expects. Each downstream job uses `!failure() &&
# !cancelled()` so skipped upstreams don't block it.
#
# These jobs run on the very `:latest` they rebuild. If a `:base`
# change ships broken, recover via the laptop `ops` CLI:
# `deploy-runner-base` then `deploy-runners`.
#
# Repo secrets required for deploys:
#   - FLY_API_TOKEN_ORCHESTRATOR  scoped to `sqisign-infra-orchestrator`
#   - FLY_API_TOKEN_RUNNERS       scoped to `sqisign-infra-runners`
# Mint via: `fly tokens create deploy --app <name> --expiry 8760h`

on:
  # The paths list is duplicated under push and pull_request because
  # actionlint rejects YAML aliases in `paths:` — keep the two copies
  # in sync when editing.
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/**'
      - '.github/actionlint.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/**'
      - '.github/actionlint.yaml'
  schedule:
    # Weekly rebuild of the runner image so OS patches + rustup +
    # cargo subcommand updates flow through without a code change.
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # `dorny/paths-filter` calls listFiles(pull_number) on the PR.
  pull-requests: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Lint every workflow file. Fast (~5s) and catches the typo-class
  # bugs that otherwise only surface at workflow-run time: malformed
  # `runs-on:` expressions, undeclared self-hosted labels, shellcheck
  # issues in `run:` blocks, unused YAML anchors, etc.
  actionlint:
    name: actionlint
    runs-on: [self-hosted, fly, linux, x64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      # Bare-binary install. `reviewdog/action-actionlint` is a
      # Docker container action and the Fly self-hosted image
      # doesn't run a dockerd; `taiki-e/install-action` doesn't
      # ship actionlint (Go binary, not a Rust crate, so its
      # cargo-binstall fallback 404s). So we pin VER and verify
      # the tarball SHA-256 against the upstream checksums file.
      # Bump VER and SHA256 in lockstep; SHA is from
      # `actionlint_${VER}_checksums.txt` on the release page.
      - name: Install + run actionlint
        run: |
          VER=1.7.7
          SHA256=023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${VER}/actionlint_${VER}_linux_amd64.tar.gz" -o actionlint.tar.gz
          echo "${SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          rm actionlint.tar.gz
          ./actionlint -color

  # Detect which subtree changed so we only redeploy what's affected.
  # `runners_base` is a sub-filter of `runners` — a `Dockerfile.base`
  # edit sets both, so `:latest` always rebuilds on top of a fresh
  # `:base`.
  changes:
    name: Detect changed paths
    runs-on: [self-hosted, fly, linux, x64]
    timeout-minutes: 2
    outputs:
      orchestrator: ${{ steps.filter.outputs.orchestrator }}
      runners: ${{ steps.filter.outputs.runners }}
      runners_base: ${{ steps.filter.outputs.runners_base }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
          # 0 (full history) so dorny/paths-filter can resolve
          # `github.event.before` after a multi-commit rebase-and-
          # merge to main. Depth 2 only grabs HEAD+parent, which
          # isn't enough to reach `before` when N > 1 commits land.
          fetch-depth: 0
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d
        id: filter
        with:
          filters: |
            orchestrator:
              - 'infra/orchestrator/**'
              - 'infra/Cargo.toml'
              - 'infra/Cargo.lock'
            runners:
              - 'infra/runners/**'
            runners_base:
              - 'infra/runners/Dockerfile.base'

  # Build + lint the orchestrator crate. Release build is delegated
  # to the Dockerfile so this job stays fast (~2-3 min warm cache).
  build:
    name: Check + lint orchestrator
    runs-on: [self-hosted, fly, linux, x64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # nightly
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          workspaces: infra
          shared-key: infra-stable
      - run: cargo check --manifest-path infra/Cargo.toml --all-targets --locked
      - run: cargo +nightly clippy --manifest-path infra/Cargo.toml --all-targets -- -D warnings
      - run: cargo +nightly fmt --manifest-path infra/Cargo.toml --all -- --check
      - run: cargo test --manifest-path infra/Cargo.toml --all-targets --locked

      # `.github/actionlint.yaml`'s self-hosted-runner label list is
      # rendered from `infra/orchestrator/runners.toml`. Fail the job
      # on drift; the error message tells the contributor how to
      # regenerate locally.
      - name: Verify .github/actionlint.yaml matches runners.toml
        run: |
          cargo run --manifest-path infra/Cargo.toml \
            -p ops --bin render-actionlint -- \
            --check .github/actionlint.yaml

  # Build + push the heavy `:base` runner image. Slow (~10–15 min
  # cold) — fires only on Dockerfile.base edits, weekly schedule
  # (OS patches), or manual dispatch.
  deploy-runners-base:
    name: Build + push runner :base image
    needs: [build, changes]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.runners_base == 'true') ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, fly, linux, x64]
    timeout-minutes: 60
    outputs:
      # `sha256:...` digest of the manifest the build pushed, so
      # the runtime job below can `FROM` that exact image instead
      # of re-resolving the `:base` tag (which can race or hit a
      # stale BuildKit cache).
      base_digest: ${{ steps.digest.outputs.value }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Build + push :base image
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_RUNNERS }}
        working-directory: infra/runners
        # flyctl knobs we learned the hard way:
        #   - `[build].dockerfile` in fly.toml is honored;
        #     `--dockerfile` CLI is ignored. -> use `--config`.
        #   - `--image-label` CLI is honored; `[build].image_label`
        #     in fly.toml is ignored under `--build-only` (image
        #     ships under `:deployment-<id>` instead). -> name the
        #     tag on the CLI.
        #   - `--push` is required for `--build-only` to actually
        #     update the named tag in the destination registry.
        #     Without it, Depot stages the image under a
        #     deployment-scoped tag and the named tag never moves,
        #     even though flyctl logs an optimistic
        #     `image: ...:base` line. -> always pass `--push`.
        #
        # NOT passing `--buildkit` here even though the `ops` CLI
        # does. `--buildkit` switches off Depot in favor of Fly's
        # own remote builder, which provisions a `fly-builder-*`
        # app on the user's account. CI's `FLY_API_TOKEN_RUNNERS`
        # is app-scoped to `sqisign-infra-runners` only, so the
        # builder-app provisioning fails `unauthorized`. The
        # laptop `ops` path works because a personal Fly token has
        # broader scope; CI sticks with Depot.
        run: |
          flyctl deploy --build-only --app sqisign-infra-runners \
            --config fly.base.toml \
            --image-label base \
            --push
      - name: Resolve pushed :base digest
        id: digest
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_RUNNERS }}
        # `docker manifest inspect -v` returns the registry's
        # current manifest for the named tag and emits the
        # content-addressable digest under `.Descriptor.digest`.
        # `flyctl auth docker` writes the same FLY_API_TOKEN into
        # docker's credential store so the registry call is
        # authenticated. Querying the registry directly (not log-
        # parsing) means the digest we hand the runtime job is the
        # one the registry will actually serve to its FROM.
        run: |
          flyctl auth docker
          digest=$(docker manifest inspect -v \
                     registry.fly.io/sqisign-infra-runners:base \
                   | jq -r '.Descriptor.digest')
          if [ -z "$digest" ] || [ "$digest" = "null" ]; then
            echo "::error::could not resolve :base manifest digest"
            exit 1
          fi
          echo "value=$digest" >> "$GITHUB_OUTPUT"
          echo ":base digest: $digest"

      # Fly's Machine runtime fails to unpack an image past ~7 GiB
      # uncompressed (documented as 8 GiB, empirically less — we had
      # a 6.77 GiB image fail). Catch it at deploy time, not later
      # when Machines silently fail to start and runs hang in
      # "queued" forever. The Rust script in .github/scripts/ does
      # the layer-by-layer zstd decompress + size sum.
      - name: Verify :base unpacked size
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_RUNNERS }}
        run: |
          rustc -O .github/scripts/check-image-size.rs -o /tmp/check-image-size
          /tmp/check-image-size \
            "registry.fly.io/sqisign-infra-runners@${{ steps.digest.outputs.value }}" 7

  # Build + push the thin `:latest` runtime runner image, FROM the
  # `:base` that `deploy-runners-base` (skipped or just-pushed) left
  # in the registry. `!failure()` lets us run when base was skipped
  # but blocks on base failure — never push `:latest` over a
  # known-bad `:base`.
  deploy-runners-image:
    name: Build + push runner :latest image
    needs: [build, changes, deploy-runners-base]
    if: |
      !failure() && !cancelled() && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.runners == 'true') ||
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: [self-hosted, fly, linux, x64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Build + push :latest image
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_RUNNERS }}
          BASE_DIGEST: ${{ needs.deploy-runners-base.outputs.base_digest }}
        working-directory: infra/runners
        # `--config fly.toml` selects Dockerfile.runtime; CLI
        # `--image-label latest` is what actually tags the registry
        # image (`[build].image_label` in fly.toml is ignored under
        # `--build-only`). See the comment on `deploy-runners-base`.
        #
        # `--build-arg BASE_IMAGE=...@<digest>` pins the runtime
        # build to the exact `:base` manifest the base job just
        # pushed, bypassing Depot's BuildKit cache of the `:base`
        # tag resolution. When the base job is skipped (no
        # Dockerfile.base change), `BASE_DIGEST` is empty and we
        # fall back to the `:base` tag.
        run: |
          base_image="registry.fly.io/sqisign-infra-runners:base"
          if [ -n "$BASE_DIGEST" ]; then
            base_image="registry.fly.io/sqisign-infra-runners@${BASE_DIGEST}"
            echo "FROM pinned by digest: $base_image"
          else
            echo "deploy-runners-base skipped; FROM via :base tag"
          fi
          flyctl deploy --build-only --app sqisign-infra-runners \
            --config fly.toml \
            --image-label latest \
            --build-arg "BASE_IMAGE=${base_image}" \
            --push

      # Same unpacked-size guard as deploy-runners-base, but on
      # `:latest` (the tag Machines actually unpack at spawn). If
      # `:base` slipped under the limit but the runtime layer
      # pushed `:latest` over, catch it here before the orchestrator
      # starts spawning broken Machines. The script resolves the tag
      # to its current digest itself.
      - name: Verify :latest unpacked size
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_RUNNERS }}
        run: |
          rustc -O .github/scripts/check-image-size.rs -o /tmp/check-image-size
          /tmp/check-image-size registry.fly.io/sqisign-infra-runners:latest 7

  # Deploy the orchestrator last, after any freshly-pushed
  # `:latest` it'll spawn Machines from.
  deploy-orchestrator:
    name: Deploy orchestrator
    needs: [build, changes, deploy-runners-image]
    if: |
      !failure() && !cancelled() && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.orchestrator == 'true') ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: [self-hosted, fly, linux, x64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_ORCHESTRATOR }}
        working-directory: infra
        run: |
          flyctl deploy --app sqisign-infra-orchestrator \
            --config orchestrator/fly.toml \
            --dockerfile orchestrator/Dockerfile
