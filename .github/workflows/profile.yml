name: Profile

# Runs on self-hosted Fly runners.  Valgrind/callgrind under
# `--cache-sim=yes --branch-sim=yes` collects instruction counts,
# estimated cycles, L1/LL cache misses, and branch mispredicts ---
# all deterministic (no shared-CPU noise affects the numbers).
#
# Sharded across six matrix jobs --- one per bench group (field,
# curves, parsing) and one per slow `sqisign::kat_*` bench --- so
# wall-clock is bounded by the longest single bench (kat_sign)
# instead of the sum of all benches.  Each shard ships its
# `target/gungraun/` to Tigris scratch via `ci-scratch put`; an
# aggregation job pulls every shard, merges them, runs the report
# generator, and posts the sticky comment.
#
# A parallel `flamegraphs` job records sampled call-stack flamegraphs
# for keygen/sign/verify at native speed (perf + cargo-flamegraph over
# `examples/profile_sign.rs`) and hosts the SVGs the report embeds.
# callgrind output has no stack traces, so gungraun's own "flamegraphs"
# ranked functions by inclusive Ir with bogus ancestry; the sampled
# graphs have real attribution and add no critical-path wall-clock.
#
# The data kind on the CI dashboard is still `instructions` for
# continuity --- the JSON payload carries all metrics (instructions,
# estimated_cycles, l1_misses, l2_misses, branch_misses) regardless
# of the surface label.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'benches/**'
      - 'tests/**'
      - 'examples/profile_sign.rs'
      - 'Cargo.toml'
      - '.github/workflows/profile.yml'
      - '.github/scripts/instructions-report.rs'
      - '.github/scripts/ci-scratch.rs'
      - '.github/scripts/mca.rs'
  pull_request:
    branches: [main, next]
    paths:
      - 'src/**'
      - 'benches/**'
      - 'tests/**'
      - 'examples/profile_sign.rs'
      - 'Cargo.toml'
      - '.github/workflows/profile.yml'
      - '.github/scripts/instructions-report.rs'
      - '.github/scripts/ci-scratch.rs'
      - '.github/scripts/mca.rs'
  workflow_dispatch:

# Supersede in-flight PR runs; never cancel a main run mid-upload.
concurrency:
  group: profile-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write  # sticky comment on PRs

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    name: gungraun (${{ matrix.shard }})
    runs-on: [self-hosted, fly, linux, x64]
    # Per-shard, not per-workflow: even the slow sqisign::kat_sign
    # shard comfortably fits in 60 min under cache + branch simulation.
    timeout-minutes: 90
    env:
      # See gate (ci.yml) for the empty-RUSTC_WRAPPER rationale —
      # dependabot / fork PRs don't receive repo secrets, so without
      # this guard the sccache-action would skip installing the binary
      # and `cargo metadata` (used by Install gungraun-runner below)
      # would then exit 101 with `sccache: command not found`.
      RUSTC_WRAPPER: ${{ secrets.TIGRIS_SCCACHE_ACCESS_KEY_ID != '' && 'sccache' || '' }}
      SCCACHE_BUCKET: selkie-ci-sccache
      SCCACHE_ENDPOINT: https://fly.storage.tigris.dev
      SCCACHE_REGION: auto
      AWS_ACCESS_KEY_ID: ${{ secrets.TIGRIS_SCCACHE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_SCCACHE_SECRET_ACCESS_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Glob patterns over the gungraun bench module path
          # (`FILENAME::GROUP::FUNCTION::ID`).  Wildcards are required;
          # plain substrings don't match.
          - shard: field
            filter: '*::field::*'
          - shard: curves
            filter: '*::curves::*'
          - shard: parsing
            filter: '*::parsing::*'
          - shard: keygen
            filter: '*::kat_keygen*'
          - shard: sign
            filter: '*::kat_sign*'
          - shard: verify
            filter: '*::kat_verify*'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - uses: mozilla-actions/sccache-action@1583d6b38d7be47f593cb472781bbb21cab4321e  # v0.0.10
        if: env.RUSTC_WRAPPER == 'sccache'

      # gungraun-runner refuses on lib/runner version skew; install the
      # version cargo actually resolved.
      - name: Install gungraun-runner
        run: |
          set -euo pipefail
          ver=$(cargo metadata --format-version 1 \
            | jq -r '.packages[] | select(.name=="gungraun") | .version' \
            | head -1)
          if [ -z "$ver" ]; then
            echo "::error::could not resolve gungraun version from cargo metadata"; exit 1
          fi
          cargo install gungraun-runner --version "$ver" --locked

      # Cache + branch simulation is on by default in benches/instructions.rs
      # (no `--cache-sim=no` override), so every run produces estimated_cycles,
      # L1/LL cache misses, and branch mispredicts alongside the headline Ir.
      # The positional filter restricts this shard to its slice of benches.
      - name: Run gungraun (${{ matrix.shard }})
        run: |
          set -euo pipefail  # so a bench failure isn't masked by `tee` exit 0
          cargo bench --bench instructions --features expose-internals -- \
            '${{ matrix.filter }}' --save-summary=json 2>&1 \
            | tee profile-output-${{ matrix.shard }}.txt
          # Guard: gungraun-runner reports "0 benchmarks finished" when the
          # filter matched nothing instead of failing.  Catch that here so
          # we don't tar an empty directory and silently swallow a regression
          # in the filter syntax (FILENAME::GROUP::FUNCTION::ID globs).
          if [ ! -d target/gungraun ] || [ -z "$(ls -A target/gungraun 2>/dev/null)" ]; then
            echo "::error::no gungraun output for shard '${{ matrix.shard }}' (filter '${{ matrix.filter }}' matched nothing?)" >&2
            exit 1
          fi

      - name: Build ci-scratch
        run: env -u RUSTC_WRAPPER rustc -O .github/scripts/ci-scratch.rs -o /tmp/ci-scratch

      # Tarball the shard's gungraun output and ship to Tigris scratch.
      # ci-scratch appends `.json` to the bucket key; the aggregator
      # untars the file regardless of suffix.
      - name: Ship gungraun output to Tigris scratch
        env:
          TIGRIS_ACCESS_KEY_ID: ${{ secrets.TIGRIS_ACCESS_KEY_ID }}
          TIGRIS_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          tar -czf gungraun-shard.tar.gz -C target gungraun
          /tmp/ci-scratch put gungraun-shards "${{ github.sha }}" \
            "${{ matrix.shard }}" gungraun-shard.tar.gz

      - name: sccache stats
        if: ${{ !cancelled() && env.RUSTC_WRAPPER == 'sccache' }}
        run: sccache --show-stats

  # Sampled call-stack flamegraphs for the three top-level benches.
  # Runs the deterministic `profile_sign` workload natively under perf
  # (seconds, vs minutes under callgrind) and renders one SVG per mode
  # at the `instructions/flamegraphs/<sha>/sqisign__kat_<mode>.svg`
  # path the report links. Keep the mode loop in sync with
  # FLAMEGRAPH_BENCHES in instructions-report.rs.
  #
  # Fly Machines (Firecracker) expose no PMU, so sampling uses the
  # software clock (`-e cpu-clock`) instead of perf's default cycles
  # event, with DWARF unwinding from the profiling profile's debuginfo.
  flamegraphs:
    name: flamegraphs
    runs-on: [self-hosted, fly, linux, x64]
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: ${{ secrets.TIGRIS_SCCACHE_ACCESS_KEY_ID != '' && 'sccache' || '' }}
      SCCACHE_BUCKET: selkie-ci-sccache
      SCCACHE_ENDPOINT: https://fly.storage.tigris.dev
      SCCACHE_REGION: auto
      AWS_ACCESS_KEY_ID: ${{ secrets.TIGRIS_SCCACHE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_SCCACHE_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - uses: mozilla-actions/sccache-action@1583d6b38d7be47f593cb472781bbb21cab4321e  # v0.0.10
        if: env.RUSTC_WRAPPER == 'sccache'

      - name: Install perf and cargo-flamegraph
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends linux-tools-generic
          cargo install flamegraph --locked

      - name: Record flamegraphs
        run: |
          set -euo pipefail
          sudo sysctl -w kernel.perf_event_paranoid=1
          # Ubuntu's /usr/bin/perf shim dispatches on `uname -r`, which
          # never matches a linux-tools package on Fly's kernel; point
          # cargo-flamegraph at the versioned binary directly.
          PERF=$(echo /usr/lib/linux-tools/*/perf)
          export PERF
          mkdir -p flamegraphs
          for mode in keygen sign verify; do
            cargo flamegraph --profile profiling --example profile_sign \
              --deterministic \
              -c "record -F 997 -e cpu-clock --call-graph dwarf,16384 -g" \
              -o "flamegraphs/sqisign__kat_${mode}.svg" -- "$mode"
          done

      # Best-effort like the rest of the flamegraph plumbing: a failed
      # upload must not fail the run --- the URLs just 404 until the
      # next successful one. Skipped on fork PRs (no Fly token).
      - name: Host flamegraphs
        continue-on-error: true
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: ./.github/actions/ci-upload
        with:
          assets: flamegraphs
          remote-subdir: instructions/flamegraphs/${{ github.sha }}
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}

  # Merges every shard's output into one combined report and posts
  # the sticky comment.  Job name `gungraun` matches the prior
  # single-job name so the required-status-check on the PR keeps
  # working.
  aggregate:
    name: gungraun
    needs: bench
    runs-on: [self-hosted, fly, linux, x64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - name: Build ci-scratch
        run: rustc -O .github/scripts/ci-scratch.rs -o /tmp/ci-scratch

      - name: Pull all shards from Tigris scratch
        env:
          TIGRIS_ACCESS_KEY_ID: ${{ secrets.TIGRIS_ACCESS_KEY_ID }}
          TIGRIS_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p /tmp/gungraun-shards
          /tmp/ci-scratch get gungraun-shards "${{ github.sha }}" /tmp/gungraun-shards/

      # Each shard's tarball has `gungraun/` as the top-level entry
      # (it was created from `target/`), so untarring into `target/`
      # reconstructs the original combined layout.  Per-bench
      # subdirectories are disjoint across shards, so no collisions.
      - name: Merge shards into target/gungraun/
        run: |
          set -euo pipefail
          mkdir -p target
          for f in /tmp/gungraun-shards/*.json; do
            tar -xzf "$f" -C target
          done
          echo "Merged layout:"
          find target/gungraun -maxdepth 4 -type d | sort

      - name: Generate JSON
        run: |
          # Skip sccache for this standalone compile.
          env -u RUSTC_WRAPPER rustc -O .github/scripts/instructions-report.rs -o /tmp/instructions-report
          /tmp/instructions-report target/gungraun "${{ github.sha }}" > instructions.json

      - name: Verify profile payload has data
        run: jq -e '.total > 0 and (.results | length > 0)' instructions.json > /dev/null || { echo "::error::instructions.json has no benchmark results"; cat instructions.json >&2; exit 1; }

      # Upload the data payload only from main: a PR or branch dispatch
      # must not clobber main's stored baseline.
      - name: Upload to CI site
        if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/ci-upload
        with:
          kind: instructions
          payload: instructions.json
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}

      # Job summary always; sticky comment on same-repo PRs.
      - name: Report
        uses: ./.github/actions/ci-pr-report
        with:
          kind: instructions
          payload: instructions.json
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Hygiene: drop the per-shard scratch entries now that we've
      # consumed them.  Bucket lifecycle auto-expires at 7 days as a
      # backstop; this is just being polite.
      - name: Clean Tigris scratch
        if: ${{ !cancelled() }}
        env:
          TIGRIS_ACCESS_KEY_ID: ${{ secrets.TIGRIS_ACCESS_KEY_ID }}
          TIGRIS_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_SECRET_ACCESS_KEY }}
        run: /tmp/ci-scratch clean gungraun-shards "${{ github.sha }}"

  # Static pipeline estimate (llvm-mca) for the hot x86_64 field asm.
  # No execution -- llvm-mca models port pressure and throughput from
  # the emitted instruction stream alone.  Independent of the gungraun
  # shards above and informational only (never a merge gate); the
  # "fewer mulx but more instructions" non-win signal that runtime
  # benches alone can miss.
  mca:
    name: llvm-mca
    runs-on: [self-hosted, fly, linux, x64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          targets: x86_64-unknown-linux-gnu

      # `llvm-mca` ships in the `llvm` apt package.  Skip the install
      # if a runner image already bakes it in.
      - name: Ensure llvm-mca
        run: |
          set -euo pipefail
          if ! command -v llvm-mca >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y llvm
          fi
          llvm-mca --version | head -2

      # `-mcpu=native` models this runner's actual CPU; the runner is
      # x86_64, so the script's fixed `-mtriple=x86_64-...` matches.
      # `MCA_CARGO=cargo` uses the stable toolchain (`--emit asm` is
      # stable; no nightly needed).
      - name: Run llvm-mca on hot kernels
        env:
          MCA_CPU: native
          MCA_CARGO: cargo
        run: |
          set -euo pipefail
          rustc -O .github/scripts/mca.rs -o /tmp/mca
          {
            echo "## llvm-mca static estimate (\`-mcpu=native\`)"
            echo
            /tmp/mca
          } | tee -a "$GITHUB_STEP_SUMMARY"
