name: Auto-rebase branch stack

# Keeps the linear branch stack current: `next` rebased onto `main`, then
# `scaoilte` rebased onto `next`. Rebase (not merge) preserves the linear,
# merge-commit-free history both branches use; force-with-lease updates the
# standing PRs (next -> main, scaoilte -> main) in place.
#
# On a rebase conflict the step fails before pushing, so the branch on the
# remote is left untouched and the run goes red. Resolve it manually and
# push the fixed branch: a push to any stack branch re-triggers this job,
# which then succeeds and clears the red.
#
# Caveat: pushes made with the default GITHUB_TOKEN do not start new
# workflow runs, so an auto-rebased `next`/`scaoilte` does NOT re-run CI on
# its PR until the next human push or a manual CI dispatch. To re-run CI on
# every auto-rebase, push with a PAT secret instead of GITHUB_TOKEN.

on:
  push:
    branches: [main, next, scaoilte]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: auto-rebase-stack
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rebase-stack:
    name: Rebase next onto main, scaoilte onto next
    runs-on: [self-hosted, fly, linux, x64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          fetch-depth: 0
          # Keep the token so the rebase can push the rewritten branches.
          persist-credentials: true

      - name: Configure committer identity
        run: |
          git config user.name "Deirdre Connolly"
          git config user.email "durumcrustulum@gmail.com"

      - name: Rebase the stack
        run: |
          git fetch --quiet origin main next scaoilte

          # A conflicting rebase exits non-zero, which (bash -e) fails the
          # step before the push, so the remote branch is untouched.
          git checkout -B next origin/next
          git rebase origin/main
          git push --force-with-lease origin next

          git checkout -B scaoilte origin/scaoilte
          git rebase origin/next
          git push --force-with-lease origin scaoilte
