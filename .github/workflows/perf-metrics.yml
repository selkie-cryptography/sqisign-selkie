name: Perf metrics

# Binary size, allocation budget, and stack depth — resource-cost
# measurements that move only when source moves. On PRs we upload
# per-sha (via ci-upload's --pr-only) so the instructions PR comment
# can show real PR-vs-main deltas without clobbering main's baseline.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'benches/**'
      - 'Cargo.toml'
      - '.github/workflows/perf-metrics.yml'
      - '.github/scripts/size-report.rs'
      - '.github/scripts/alloc-report.rs'
      - '.github/scripts/stack-depth.rs'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'benches/**'
      - 'Cargo.toml'
      - '.github/workflows/perf-metrics.yml'
      - '.github/scripts/size-report.rs'
      - '.github/scripts/alloc-report.rs'
      - '.github/scripts/stack-depth.rs'
  workflow_dispatch:

concurrency:
  group: perf-metrics-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  binary-size:
    name: Binary size
    runs-on: [self-hosted, fly, linux, x64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - uses: taiki-e/install-action@213ccc1a076163c093f914550b94feb90fab916d
        with:
          tool: cargo-bloat

      - name: Build release and collect sizes
        run: |
          cargo build --release
          rustc -O .github/scripts/size-report.rs -o /tmp/size-report
          /tmp/size-report "${{ github.sha }}" > size.json

      - name: Verify size payload has data
        run: jq -e '.binary.total_bytes > 0' size.json > /dev/null || { echo "::error::size.json missing binary.total_bytes"; cat size.json >&2; exit 1; }
      - name: Upload
        uses: ./.github/actions/ci-upload
        with:
          kind: size
          payload: size.json
          pr-only: ${{ github.event_name == 'pull_request' }}
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}

  alloc-budget:
    name: Allocation budget
    runs-on: [self-hosted, fly, linux, x64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae

      - name: Run allocation tests
        run: |
          if cargo test --profile release-checked --test alloc_budget --features expose-internals 2>&1; then
            STATUS=pass
          else
            STATUS=fail
          fi
          rustc -O .github/scripts/alloc-report.rs -o /tmp/alloc-report
          /tmp/alloc-report "${{ github.sha }}" "$STATUS" alloc-report.json > alloc.json

      - name: Verify alloc payload has data
        run: jq -e '.status != null and .status != ""' alloc.json > /dev/null || { echo "::error::alloc.json missing status field"; cat alloc.json >&2; exit 1; }
      - name: Upload
        uses: ./.github/actions/ci-upload
        with:
          kind: alloc
          payload: alloc.json
          pr-only: ${{ github.event_name == 'pull_request' }}
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}

  stack-depth:
    name: Stack depth
    runs-on: [self-hosted, fly, linux, x64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae

      - name: Measure stack depth
        run: |
          rustc -O .github/scripts/stack-depth.rs -o /tmp/stack-depth
          /tmp/stack-depth "${{ github.sha }}" > stack.json

      - name: Verify stack payload has data
        run: jq -e '.peak_stack_bytes > 0' stack.json > /dev/null || { echo "::error::stack.json has zero peak_stack_bytes"; cat stack.json >&2; exit 1; }
      - name: Upload
        uses: ./.github/actions/ci-upload
        with:
          kind: stack
          payload: stack.json
          pr-only: ${{ github.event_name == 'pull_request' }}
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}
