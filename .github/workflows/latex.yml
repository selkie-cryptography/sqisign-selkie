name: LaTeX

on:
  push:
    branches: [main]
    paths:
      - 'latex/**'
      - '.github/workflows/latex.yml'
  pull_request:
    branches: [main]
    paths:
      - 'latex/**'
      - '.github/workflows/latex.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper:
    name: Build LaTeX documents
    # Runs on Fly self-hosted using the `texlive-latex-extra`
    # family pre-installed in the runner image (see
    # `infra/runners/Dockerfile.base`). Direct `latexmk` invocations
    # replace the prior `xu-cheng/latex-action` (Docker action
    # path, requires a Docker daemon we don't run on Fly).
    #
    # Same-repo-PR routing: fork PRs route to `ubuntu-latest`
    # (free Linux minutes on public repos). The ubuntu-latest
    # path won't have texlive pre-installed — once that path
    # becomes live (post-public-flip, fork PR opened), latexmk
    # below will fail-fast. TODO at that point: either conditionally
    # route the fork-PR path back to `xu-cheng/latex-action`, or
    # install texlive job-time on ubuntu-latest.
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","fly","linux","x64"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
          submodules: true

      - name: Build paper
        working-directory: latex
        run: latexmk -pdf -file-line-error -halt-on-error -interaction=nonstopmode sqisign-selkie.tex

      - name: Build spec review
        working-directory: latex
        run: latexmk -pdf -file-line-error -halt-on-error -interaction=nonstopmode sqisign-v2-spec-review.tex

      # TEMP: artifact upload disabled — org GH Actions artifact-storage
      # quota is full. Job still builds the PDFs above to catch latex
      # regressions; re-enable once quota frees up or retention is cut.
