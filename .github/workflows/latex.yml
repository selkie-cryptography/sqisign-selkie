name: LaTeX

on:
  push:
    branches: [main, v3]
    paths:
      - 'latex/**'
      - '.github/workflows/latex.yml'
  pull_request:
    branches: [main, next, v3]
    paths:
      - 'latex/**'
      - '.github/workflows/latex.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper:
    name: Build LaTeX documents
    # Same-repo PRs and pushes run on the Fly fleet, whose image has
    # the `texlive-latex-extra` family baked in
    # (`infra/runners/Dockerfile.base`). Fork PRs route to
    # `ubuntu-latest`, where `setup-linux-deps` installs the same
    # packages first. Direct `latexmk` invocations, no Docker action.
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","fly","linux","x64"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
          submodules: true
      - uses: ./.github/actions/setup-linux-deps
        with:
          packages: biber latexmk lmodern texlive-bibtex-extra texlive-fonts-extra texlive-fonts-recommended texlive-latex-extra texlive-plain-generic texlive-science

      - name: Build paper
        working-directory: latex
        run: latexmk -pdf -file-line-error -halt-on-error -interaction=nonstopmode sqisign-selkie.tex

      - name: Build v2 spec review
        working-directory: latex
        run: latexmk -pdf -file-line-error -halt-on-error -interaction=nonstopmode sqisign-v2-spec-review.tex

      - name: Build v3 spec review
        working-directory: latex
        run: latexmk -pdf -file-line-error -halt-on-error -interaction=nonstopmode sqisign-v3-spec-review.tex

      - name: Build v3 security review
        working-directory: latex
        run: latexmk -pdf -file-line-error -halt-on-error -interaction=nonstopmode sqisign-v3-security-review.tex

      # TEMP: artifact upload disabled — org GH Actions artifact-storage
