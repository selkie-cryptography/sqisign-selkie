name: Mutation testing (one-off)

# Ad-hoc, scoped mutation runs on a single Fly Machine. Distinct from
# `mutants.yml` (structured incremental/full sweeps tied to CI status):
# this workflow exists for narrow bug-hunting — "give me mutation
# signal on just this one file, including integration tests".
#
# Key differences from `mutants.yml`:
#   * scoped to one `--file` glob via the `path` input
#   * drops `-- --lib`, so integration tests in `tests/` run too
#     (necessary for verify-side coverage — `sig_binds_to_key` etc.
#     live there, not in `src/`)
#   * `workflow_dispatch` only — never fires on push/PR/schedule
#
# Trigger:
#   gh workflow run mutants-oneoff.yml --ref <branch> \
#     -f path=src/keys/verifying.rs \
#     -f filter='not test(/sign_kat_derand_/)'
#
# The script `scripts/run-mutants-on-fly.sh` does the same job from
# a laptop without GH Actions; this workflow is the cloud-side path.

on:
  workflow_dispatch:
    inputs:
      path:
        description: 'File or glob to mutate (passed to cargo mutants --file)'
        type: string
        required: true
        default: 'src/keys/verifying.rs'
      filter:
        description: 'nextest filter expression (excludes slow KATs by default)'
        type: string
        required: true
        default: 'not test(/sign_kat_derand_/)'

concurrency:
  group: mutants-oneoff-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  oneoff:
    name: Mutate ${{ inputs.path }}
    runs-on: [self-hosted, fly, linux, x64, perf-8x]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          # Distinct key — the in-place mutation pattern is hostile to
          # caches shared with the regular CI gate.
          key: mutants-oneoff
      - uses: taiki-e/install-action@3fa6878dc4ae603f73960271565a082bf196ab96
        with:
          tool: cargo-mutants,cargo-nextest

      # No `-- --lib`: cargo-mutants runs `cargo test` for each mutant,
      # which (via nextest) executes lib + integration + doc tests.
      # The nextest `-E` filter excludes the slow KAT loop by default;
      # widen the `filter` input on dispatch when other slow tests
      # bloat the run beyond patience.
      #
      # `continue-on-error`: cargo-mutants exits non-zero when any
      # mutant survives. That's the signal we want, not a failure.
      - name: Run cargo-mutants on ${{ inputs.path }}
        continue-on-error: true
        run: |
          cargo mutants \
            --file '${{ inputs.path }}' \
            --test-tool nextest \
            --in-place \
            --no-shuffle \
            -vV \
            -- -E '${{ inputs.filter }}'

      - name: Verify mutants produced real outcomes
        run: |
          if [ ! -f mutants.out/outcomes.json ]; then
            echo "::error::mutants.out/outcomes.json missing; cargo-mutants did not run"
            exit 1
          fi
          COUNT=$(jq '[.outcomes[].summary | select(. == "CaughtMutant" or . == "MissedMutant" or . == "Timeout" or . == "Unviable")] | length' mutants.out/outcomes.json)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::cargo-mutants produced zero per-mutant outcomes (likely baseline failure)"
            exit 1
          fi
          echo "verified: $COUNT per-mutant outcomes"
          echo
          echo "summary:"
          jq -r '.outcomes | group_by(.summary) | map({summary: .[0].summary, count: length}) | .[] | "  \(.summary): \(.count)"' mutants.out/outcomes.json

      - name: Archive mutants.out
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutants-oneoff-${{ github.run_id }}
          path: mutants.out
