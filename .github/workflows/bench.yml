name: Benchmarks

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'benches/**'
      - 'Cargo.toml'
      - '.github/scripts/**'
      - '.github/workflows/bench.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    name: Performance benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      # PR comments with benchmark comparison
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - name: Signal running
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: rustc -O .github/scripts/ci-signal.rs -o /tmp/ci-signal && /tmp/ci-signal bench running "${{ github.sha }}"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          key: bench

      - name: Run benchmarks
        run: |
          rustc -O .github/scripts/divan-to-json.rs -o /tmp/divan-to-json
          # Run each bench binary with a timeout so slow ones don't
          # block fast ones. Collect all output then parse.
          cargo build --release --benches --features expose-internals
          : > bench-raw.txt
          for bin in ./target/release/deps/*-????????????????; do
            [ -x "$bin" ] || continue
            # Skip non-bench binaries (test harnesses, build scripts).
            case "$(basename "$bin")" in
              dudect-*|tacet-*|iai-*|iai_slow-*) continue ;; # CT/iai benches run separately
            esac
            echo "=== Running $(basename "$bin") ===" >&2
            # `--bench` is the flag cargo passes when running via `cargo bench`;
            # without it, divan prints only the benchmark tree and exits without
            # running anything (silent exit 0), producing an empty results file.
            timeout 300 "$bin" --bench --color never >> bench-raw.txt 2>&1 || true
          done
          /tmp/divan-to-json < bench-raw.txt > bench-output.json

      # On push to main: upload results to Fly CI site.
      - name: Generate site JSON
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p bench-out
          jq -n --argjson benches "$(cat bench-output.json)" '{
            sha: "${{ github.sha }}",
            updated_at: (now | todate),
            groups: [
              $benches
              | group_by(.name | split("::")[0])
              | .[]
              | {
                  name: .[0].name | split("::")[0],
                  benchmarks: [
                    .[] | {
                      name: (.name | split("::")[1:] | join("::")),
                      time_ns: .value
                    }
                  ]
                }
            ]
          }' > bench-out/bench.json

      - name: Verify upload payload is non-empty
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          groups=$(jq '.groups | length' bench-out/bench.json)
          benches=$(jq '[.groups[].benchmarks[]] | length' bench-out/bench.json)
          echo "bench-out/bench.json: $groups groups, $benches benchmarks."
          if [ "$groups" -eq 0 ] || [ "$benches" -eq 0 ]; then
            echo "::error::bench-out/bench.json has no benchmark data — refusing to upload."
            echo "--- bench-out/bench.json ---" >&2
            cat bench-out/bench.json >&2 || true
            echo "--- first 200 lines of bench-raw.txt ---" >&2
            head -200 bench-raw.txt >&2 || true
            exit 1
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

      - name: Upload benchmarks to CI site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: rustc -O .github/scripts/ci-upload.rs -o /tmp/ci-upload && /tmp/ci-upload bench bench-out/bench.json "${{ github.sha }}"

      # PR: compare against stored baseline and comment.
      - name: Download baseline
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # Try to fetch the baseline from the CI site.
          curl -sf https://sqisign-selkie-ci.fly.dev/bench/bench.json \
            | jq '[.groups[].benchmarks[] as $b | .groups[] |
                {name: (.name + "::" + $b.name), unit: "ns/iter", value: $b.time_ns}
              ]' > baseline.json 2>/dev/null || echo "[]" > baseline.json

      - name: Compare benchmarks (pull request)
        if: github.event_name == 'pull_request'
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba
        with:
          name: sqisign-selkie benchmarks
          tool: customSmallerIsBetter
          output-file-path: bench-output.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: false
          comment-on-alert: true
          alert-threshold: "115%"
          fail-on-alert: false
