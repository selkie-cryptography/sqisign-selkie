name: Benchmarks

# Runs on self-hosted Fly runners. Bench numbers reflect Fly's
# shared-cpu hardware and have non-trivial variance from neighbor
# jobs. Useful for catching gross regressions and trending on the
# dashboard; don't quote absolute numbers without controlling the
# environment. On pull requests we post an informational comparison
# comment against main's stored baseline (not a merge gate).

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'benches/**'
      - 'Cargo.toml'
      - '.github/workflows/bench.yml'
      - '.github/scripts/divan-to-json.rs'
      - '.github/scripts/bench-compare.rs'
  pull_request:
    paths:
      - 'src/**'
      - 'benches/**'
      - 'Cargo.toml'
      - '.github/workflows/bench.yml'
      - '.github/scripts/divan-to-json.rs'
      - '.github/scripts/bench-compare.rs'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    name: Performance benchmarks
    runs-on: [self-hosted, fly, linux, perf-2x]
    timeout-minutes: 90
    permissions:
      contents: read
      # PR comments with the benchmark comparison.
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - name: Signal running
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: rustc -O .github/scripts/ci-signal.rs -o /tmp/ci-signal && /tmp/ci-signal bench running "${{ github.sha }}"

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          key: bench

      - name: Run benchmarks
        run: |
          rustc -O .github/scripts/divan-to-json.rs -o /tmp/divan-to-json
          # Run each bench binary with a timeout so slow ones don't
          # block fast ones. Collect all output then parse.
          cargo build --release --benches --features expose-internals
          : > bench-raw.txt
          for bin in ./target/release/deps/*-????????????????; do
            [ -x "$bin" ] || continue
            # Skip non-bench binaries (test harnesses, build scripts).
            case "$(basename "$bin")" in
              dudect-*|tacet-*|iai-*|iai_slow-*) continue ;; # CT/iai benches run separately
            esac
            echo "=== Running $(basename "$bin") ===" >&2
            # `--bench` is the flag cargo passes when running via `cargo bench`;
            # without it, divan prints only the benchmark tree and exits without
            # running anything (silent exit 0), producing an empty results file.
            timeout 300 "$bin" --bench --color never >> bench-raw.txt 2>&1 || true
          done
          /tmp/divan-to-json < bench-raw.txt > bench-output.json

      # Group the flat records into the per-commit payload the dashboard
      # consumes. `time_ns` stays the headline (now the median) for
      # backward compatibility with historical data; the spread, mean,
      # and sample columns are new.
      - name: Build grouped payload
        run: |
          mkdir -p bench-out
          jq -n --arg sha "${{ github.sha }}" --argjson benches "$(cat bench-output.json)" '{
            sha: $sha,
            updated_at: (now | todate),
            groups: (
              $benches
              | group_by(.name | split("::")[0])
              | map({
                  name: (.[0].name | split("::")[0]),
                  benchmarks: map({
                    name: (.name | split("::")[1:] | join("::")),
                    time_ns: .median_ns,
                    median_ns, fastest_ns, slowest_ns, mean_ns, samples, iters
                  })
                })
            )
          }' > bench-out/bench.json

      - name: Verify payload is non-empty
        run: |
          groups=$(jq '.groups | length' bench-out/bench.json)
          benches=$(jq '[.groups[].benchmarks[]] | length' bench-out/bench.json)
          echo "bench-out/bench.json: $groups groups, $benches benchmarks."
          if [ "$groups" -eq 0 ] || [ "$benches" -eq 0 ]; then
            echo "::error::bench-out/bench.json has no benchmark data."
            echo "--- bench-out/bench.json ---" >&2
            cat bench-out/bench.json >&2 || true
            echo "--- first 200 lines of bench-raw.txt ---" >&2
            head -200 bench-raw.txt >&2 || true
            exit 1
          fi

      # On push to main: upload results to the Fly CI site.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

      - name: Upload benchmarks to CI site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: rustc -O .github/scripts/ci-upload.rs -o /tmp/ci-upload && /tmp/ci-upload bench bench-out/bench.json "${{ github.sha }}"

      # On same-repo pull requests: compare against main's stored
      # baseline and post an informational comment.
      - name: Download main baseline
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        run: |
          curl -sf https://sqisign-selkie-ci.fly.dev/bench/latest.json -o baseline.json \
            || echo '{}' > baseline.json

      - name: Render comparison
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          rustc -O .github/scripts/bench-compare.rs -o /tmp/bench-compare
          /tmp/bench-compare baseline.json bench-out/bench.json > bench-comment.md
          cat bench-comment.md

      - name: Post comparison comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('bench-comment.md', 'utf8');
            const marker = '<!-- sqisign-bench-report -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            // Update our previous comment in place if one exists, so the
            // PR carries a single rolling benchmark report.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            });
            const prev = comments.find(c => c.body && c.body.includes(marker));

            if (prev) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: prev.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
