name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    name: Performance benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      # PR comments with benchmark comparison
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          key: bench

      - name: Run benchmarks
        run: |
          cargo bench --features bench-internals -- --color never 2>&1 | \
            .github/scripts/divan-to-json.sh > bench-output.json

      # On push to main: upload results to Fly CI site.
      - name: Generate site JSON
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p bench-out
          jq -n --argjson benches "$(cat bench-output.json)" '{
            sha: "${{ github.sha }}",
            updated_at: (now | todate),
            groups: [
              $benches
              | group_by(.name | split("::")[0])
              | .[]
              | {
                  name: .[0].name | split("::")[0],
                  benchmarks: [
                    .[] | {
                      name: (.name | split("::")[1:] | join("::")),
                      time_ns: .value
                    }
                  ]
                }
            ]
          }' > bench-out/bench.json

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

      - name: Upload benchmarks to CI site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl ssh sftp shell -a sqisign-selkie-ci <<'SFTP'
          put bench-out/bench.json /data/bench/bench.json
          SFTP

      # PR: compare against stored baseline and comment.
      - name: Download baseline
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # Try to fetch the baseline from the CI site.
          curl -sf https://sqisign-selkie-ci.fly.dev/bench/bench.json \
            | jq '[.groups[].benchmarks[] as $b | .groups[] |
                {name: (.name + "::" + $b.name), unit: "ns/iter", value: $b.time_ns}
              ]' > baseline.json 2>/dev/null || echo "[]" > baseline.json

      - name: Compare benchmarks (pull request)
        if: github.event_name == 'pull_request'
        uses: benchmark-action/github-action-benchmark@d48d326b4ca9ba73ca0cd0d59f108f9e02a381c7
        with:
          name: sqisign-selkie benchmarks
          tool: customSmallerIsBetter
          output-file-path: bench-output.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: false
          comment-on-alert: true
          alert-threshold: "115%"
          fail-on-alert: false
