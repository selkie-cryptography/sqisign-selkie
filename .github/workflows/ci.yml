name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Restrict default permissions to read-only. Jobs that need more
# must declare their own permissions block.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.target }}, ${{ matrix.bits }}-bit)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Rust Tier 1 targets. 64-bit targets run on native runners;
          # 32-bit targets cross-compile on 64-bit runners (the test
          # binaries run natively since x86_64 CPUs support i686).
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bits: 64
          - os: ubuntu-24.04
            target: i686-unknown-linux-gnu
            bits: 32
            multilib: true
          - os: macos-latest
            target: aarch64-apple-darwin
            bits: 64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bits: 64
          - os: windows-latest
            target: i686-pc-windows-msvc
            bits: 32
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bits: 64
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install 32-bit multilib (Linux i686)
        if: matrix.multilib
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      # dtolnay/rust-toolchain uses branch refs (stable/nightly) by
      # design so the Rust version tracks upstream releases.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          key: ${{ matrix.target }}
      - run: cargo test --target ${{ matrix.target }}

  msrv:
    name: MSRV (1.81.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.81.0
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - run: cargo check

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - uses: reviewdog/action-setup@38a8d76742a75eeb6c6ffc616bde64179fd09ebf
      - name: Run clippy with reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo +nightly clippy --all-targets --all-features --message-format=short -- -D warnings 2>&1 |
            reviewdog -f=clippy -reporter=github-check -fail-level=any

  fmt:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: reviewdog/action-setup@38a8d76742a75eeb6c6ffc616bde64179fd09ebf
      - name: Run rustfmt with reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo +nightly fmt --all -- --check 2>&1 |
            reviewdog -f=rustfmt -reporter=github-check -fail-level=any

  doc:
    name: Documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - run: cargo doc --no-deps

  coverage:
    name: Code coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # TODO: When the repo goes public, set up Codecov or Coveralls for
    # PR-level coverage reporting and upload lcov.info there.
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - uses: taiki-e/install-action@fd0f63e180a477d7434580b6d80817978b9ff2b8
        with:
          tool: cargo-llvm-cov
      - name: Generate coverage report
        run: |
          echo '## Code Coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov --fail-under-lines 50 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  audit:
    name: Security audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # cargo-deny only reads Cargo.toml/lock, no compilation needed.
      - uses: taiki-e/install-action@fd0f63e180a477d7434580b6d80817978b9ff2b8
        with:
          tool: cargo-deny
      - run: cargo deny check advisories bans

  # Incremental mutation testing: only mutate code changed in the PR.
  # Full mutation testing runs on a weekly schedule (see mutants.yml).
  mutants:
    name: Mutation testing (incremental)
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Generate diff against base branch
        run: git diff origin/${{ github.base_ref }}.. > git.diff
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - uses: taiki-e/install-action@fd0f63e180a477d7434580b6d80817978b9ff2b8
        with:
          tool: cargo-mutants
      - name: Run cargo-mutants on changed code
        run: cargo mutants --no-shuffle -vV --in-diff git.diff -- --lib
      - name: Archive mutants.out
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-incremental.out
          path: mutants.out

  sage-precompute-check:
    name: Sage precompute cross-check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae

      - name: Cache Conda environment
        uses: actions/cache@v5
        with:
          path: ~/sage-env
          key: sage-conda-${{ runner.os }}-10.6

      - name: Install SageMath via conda-forge
        run: |
          if [ ! -d ~/sage-env ]; then
            wget -q https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh -O miniforge.sh
            bash miniforge.sh -b -p ~/miniforge
            ~/miniforge/bin/conda create -y -p ~/sage-env sage=10.6 -c conda-forge
          fi
          echo "$HOME/sage-env/bin" >> "$GITHUB_PATH"

      - name: Verify Sage >= 10.5
        run: |
          sage --version

      - name: Run Sage cross-check test
        run: cargo test sage_cross_check -- --ignored

  c-ref-cross-check:
    name: C reference cross-check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae

      - name: Run C ref basis cross-check
        run: cargo test c_ref_basis_cross_check -- --ignored

      - name: Run C ref KAT verification cross-check
        run: cargo test c_ref_kat_cross_check -- --ignored

  paper:
    name: Build LaTeX documents
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container: ghcr.io/xu-cheng/texlive-full:latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: true

      - name: Build PDFs
        working-directory: latex
        run: make all

      - name: Check PDFs are up to date
        working-directory: latex
        run: |
          git diff --exit-code sqisign-selkie.pdf sqisign-v2-spec-review.pdf || {
            echo "::error::LaTeX PDFs are out of date. Rebuild with 'cd latex && make' and commit."
            exit 1
          }
