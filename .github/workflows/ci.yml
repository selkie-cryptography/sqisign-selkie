name: CI

on:
  push:
    branches: [main]
    paths: &rust-paths
      - 'src/**'
      - 'tests/**'
      - 'benches/**'
      - 'Cargo.toml'
      - 'rustfmt.toml'
      - '.config/nextest.toml'
      - '.github/scripts/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths: *rust-paths
  schedule:
    # Nightly run that exercises the full platform + KAT matrix
    # regardless of whether anything was pushed that day.
    - cron: "0 6 * * *"
  workflow_dispatch:

# Cancel superseded runs on both PR and main while we're still
# stabilizing — a fresh push always kills any in-flight CI for the
# previous commit. Once main settles, switch to PR-only cancellation
# (`cancel-in-progress: ${{ github.event_name == 'pull_request' }}`)
# to preserve a per-commit CI history on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Restrict default permissions to read-only. Jobs that need more
# must declare their own permissions block.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Tier 1 — Gate
#
# Fast checks that catch the most common problems. Required for merge.
# All run in parallel, no dependencies. Target: <5 min wall time.

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: reviewdog/action-setup@38a8d76742a75eeb6c6ffc616bde64179fd09ebf
      - name: Run rustfmt with reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo +nightly fmt --all -- --check 2>&1 |
            reviewdog -f=diff -reporter=github-check -fail-level=any

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: Run clippy
        run: |
          set -o pipefail
          echo '## Clippy' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cargo +nightly clippy --all-targets --all-features --message-format=short -- -D warnings 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  gate:
    name: lib + doc tests (x86_64-linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      # Shared cache key across the stable-toolchain x86_64-linux
      # default-features jobs (gate, proptest, doc). Without it, each
      # job uses ${{ github.job }} as the implicit key and pays the
      # dep-build cost independently. With it, all three read/write
      # the same cache and the dep build amortizes across jobs.
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          shared-key: linux-x64-default-stable
      - uses: taiki-e/install-action@3fa6878dc4ae603f73960271565a082bf196ab96
        with:
          tool: cargo-nextest
      # Run lib + integration tests (no --run-ignored, so KAT
      # sign/keygen tests are skipped). Fast gate: ~2 min.
      - run: cargo nextest run
      - run: cargo test --doc

  proptest:
    name: Property tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          shared-key: linux-x64-default-stable
      - name: Run property tests
        run: cargo test --lib -- proptest

  doc:
    name: Documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          shared-key: linux-x64-default-stable

      - name: Build docs
        run: cargo doc --no-deps --document-private-items

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - name: Upload rustdoc to CI site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo '<meta http-equiv="refresh" content="0;url=sqisign_selkie/">' \
            > target/doc/index.html
          tar -czf /tmp/rustdoc.tar.gz -C target/doc .
          rustc -O .github/scripts/ci-signal.rs -o /tmp/ci-signal
          /tmp/ci-signal docs running "${{ github.sha }}"
          echo "put /tmp/rustdoc.tar.gz /data/rustdoc.tar.gz" | flyctl ssh sftp shell -a sqisign-selkie-ci
          flyctl ssh console -a sqisign-selkie-ci -C "sh -c 'set -e; rm -rf /data/rustdoc && mkdir -p /data/rustdoc && tar -xzf /data/rustdoc.tar.gz -C /data/rustdoc && rm /data/rustdoc.tar.gz'"

  # Tier 2 — Platform matrix (lib + doc only)
  #
  # Cross-platform sanity check: lib + doc compile and pass on every
  # Rust Tier 1 target plus the no-default-features variant. KATs
  # live in the dedicated `kat` job below.
  #
  # Skipped on PR — `gate` already covers x86_64-linux default
  # features there, and exercising the full matrix per PR push is
  # expensive (Windows bills 2×, macOS 10×). Runs on push to main,
  # the nightly schedule, and manual dispatch.

  platform:
    name: "lib + doc tests (${{ matrix.target }}, ${{ matrix.bits }}-bit${{ matrix.variant && format(', {0}', matrix.variant) || '' }})"
    needs: [gate]
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64-linux default features is covered by `gate`; not
          # repeated here.
          - os: ubuntu-24.04
            target: i686-unknown-linux-gnu
            bits: 32
            multilib: true
          - os: macos-latest
            target: aarch64-apple-darwin
            bits: 64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bits: 64
          - os: windows-latest
            target: i686-pc-windows-msvc
            bits: 32
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bits: 64
          # Minimum config: no default features (zeroize off).
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bits: 64
            variant: no-default-features
            flags: --no-default-features
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install 32-bit multilib (Linux i686)
        if: matrix.multilib
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          key: ${{ matrix.target }}-${{ matrix.variant || 'default' }}
      - uses: taiki-e/install-action@3fa6878dc4ae603f73960271565a082bf196ab96
        with:
          tool: cargo-nextest
      - run: cargo nextest run --target ${{ matrix.target }} ${{ matrix.flags || '' }}
      - run: cargo test --doc --target ${{ matrix.target }} ${{ matrix.flags || '' }}

  # KAT matrix selector. Tiny job that runs in parallel with `gate`
  # and emits the matrix consumed by the `kat` job below:
  #   - PR: x86_64-linux only (single representative platform).
  #   - push to main / nightly schedule / manual dispatch: full
  #     Tier 1 matrix + no-default-features variant.
  #
  # Each platform row is exploded into SHARDS partitions; nextest's
  # `--partition hash:N/M` deals out tests to shard N of M by
  # binary+test-name hash, balancing load across shards regardless
  # of per-test runtime variance. Set SHARDS=1 to disable sharding.
  # Trade-off: each shard pays the cargo-build cost (rust-cache
  # hits keep this cheap on warm cache; cold cache duplicates work).
  kat-matrix:
    name: Compute KAT matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      matrix: ${{ steps.compute.outputs.matrix }}
    steps:
      - id: compute
        env:
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json, os
          SHARDS = 4
          full = [
              {"os": "ubuntu-24.04", "target": "x86_64-unknown-linux-gnu", "bits": 64},
              {"os": "ubuntu-24.04", "target": "i686-unknown-linux-gnu", "bits": 32, "multilib": True},
              {"os": "macos-latest", "target": "aarch64-apple-darwin", "bits": 64},
              {"os": "windows-latest", "target": "x86_64-pc-windows-msvc", "bits": 64},
              {"os": "windows-latest", "target": "i686-pc-windows-msvc", "bits": 32},
              {"os": "ubuntu-24.04-arm", "target": "aarch64-unknown-linux-gnu", "bits": 64},
              {"os": "ubuntu-24.04", "target": "x86_64-unknown-linux-gnu", "bits": 64,
               "variant": "no-default-features", "flags": "--no-default-features"},
          ]
          slim = [
              {"os": "ubuntu-24.04", "target": "x86_64-unknown-linux-gnu", "bits": 64},
          ]
          base = slim if os.environ["EVENT"] == "pull_request" else full
          rows = []
          for r in base:
              for s in range(1, SHARDS + 1):
                  rows.append({**r, "shard": s, "shards": SHARDS})
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={json.dumps({'include': rows})}\n")
          PY

  # KAT (per-vector keygen + sign + verify). On PR runs only on
  # x86_64-linux; on push to main / nightly / manual dispatch runs
  # the full Tier 1 matrix.
  #
  # Per-KAT sign tests take 30 s – 30 min each depending on the
  # seed's rejection rate. With nextest parallelism + per-test
  # timeouts via the `kat` profile, 6 h covers the long tail.
  kat:
    name: "KAT tests (${{ matrix.target }}, ${{ matrix.bits }}-bit${{ matrix.variant && format(', {0}', matrix.variant) || '' }}, shard ${{ matrix.shard }}/${{ matrix.shards }})"
    needs: [gate, kat-matrix]
    runs-on: ${{ matrix.os }}
    # Per-shard timeout. With SHARDS=4 this is enough headroom for
    # the slowest single-shard tail under release-mode build.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.kat-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install 32-bit multilib (Linux i686)
        if: matrix.multilib
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Cache key is shared across shards on the same target+variant
      # so shard 1 populates the cache and shards 2..N read it. Build
      # artifacts are identical across shards (same toolchain, same
      # cargo profile, same target).
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          key: kat-${{ matrix.target }}-${{ matrix.variant || 'default' }}
      - uses: taiki-e/install-action@3fa6878dc4ae603f73960271565a082bf196ab96
        with:
          tool: cargo-nextest
      # --run-ignored=all picks up the per-KAT keygen + sign tests.
      # --cargo-profile kat: optimized build (like release) but keeps
      # debug_assertions + overflow checks live, so invariants still
      # trip during long-running KAT trajectories. Defined in
      # Cargo.toml's [profile.kat]. Debug-mode `BigInt`/`Fp` is
      # 10-100× slower than release, which dilates the rejection-
      # sampling tail to hours; the 30-min `slow-timeout` in
      # `.config/nextest.toml` `[profile.kat]` was sized assuming
      # release-grade runtime.
      # --partition hash:N/M splits tests across shards by hash of
      # binary+test-name, balancing load regardless of per-test
      # runtime variance. Each shard runs a disjoint subset.
      - run: cargo nextest run --profile kat --run-ignored=all --cargo-profile kat --partition hash:${{ matrix.shard }}/${{ matrix.shards }} --target ${{ matrix.target }} ${{ matrix.flags || '' }}

  # Tier 3 — Informational
  #
  # Deeper analysis that provides useful signal but does not block merge.
  # Only starts after the gate passes. Failures show on the PR but are
  # not required status checks.

  sage-precompute-check:
    name: Sage precompute cross-check
    needs: [gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae

      - name: Cache Conda environment
        uses: actions/cache@v5
        with:
          path: ~/sage-env
          key: sage-conda-${{ runner.os }}-10.6

      - name: Install SageMath via conda-forge
        run: |
          if [ ! -d ~/sage-env ]; then
            wget -q https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh -O miniforge.sh
            bash miniforge.sh -b -p ~/miniforge
            ~/miniforge/bin/conda create -y -p ~/sage-env sage=10.6 -c conda-forge
          fi
          echo "$HOME/sage-env/bin" >> "$GITHUB_PATH"

      - name: Verify Sage >= 10.5
        run: |
          sage --version

      - name: Run Sage cross-check test
        run: cargo test sage_cross_check -- --ignored

  c-ref-cross-check:
    name: C reference cross-check
    needs: [gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae

      - name: Run C ref basis cross-check
        run: cargo test c_ref_basis_cross_check -- --ignored

      - name: Run C ref all-bases cross-check
        run: cargo test c_ref_all_bases_cross_check -- --ignored

      - name: Run C ref KAT verification cross-check
        run: cargo test c_ref_kat_cross_check -- --ignored

  kat-report:
    name: KAT report
    needs: [kat]
    # Always run on push to main even if `kat` failed — the report
    # script reads results from the GitHub API and surfaces the
    # failure on the dashboard.
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae

      - name: Generate KAT report
        run: |
          rustc -O .github/scripts/kat-report.rs -o /tmp/kat-report
          /tmp/kat-report "${{ github.sha }}" > kat.json
        continue-on-error: true

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        if: hashFiles('kat.json') != ''
      - name: Verify kat payload has data
        if: hashFiles('kat.json') != ''
        run: jq -e '(.suites | length > 0) and ([.suites[].total] | add > 0)' kat.json > /dev/null || { echo "::error::kat.json has no test suites or zero tests across all suites"; cat kat.json >&2; exit 1; }
      - name: Upload to CI site
        if: hashFiles('kat.json') != ''
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: rustc -O .github/scripts/ci-upload.rs -o /tmp/ci-upload && /tmp/ci-upload kat kat.json "${{ github.sha }}"

  platform-report:
    name: Platform coverage
    needs: [platform, kat]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Generate platform report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rustc -O .github/scripts/platform-report.rs -o /tmp/platform-report
          /tmp/platform-report "${{ github.run_id }}" "${{ github.sha }}" > platform.json
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Verify platform payload has data
        run: jq -e '.platforms | length > 0' platform.json > /dev/null || { echo "::error::platform.json has no platforms"; cat platform.json >&2; exit 1; }
      - name: Upload
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: rustc -O .github/scripts/ci-upload.rs -o /tmp/ci-upload && /tmp/ci-upload platform platform.json "${{ github.sha }}"
