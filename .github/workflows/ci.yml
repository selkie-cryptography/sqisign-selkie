name: CI

on:
  # The paths list is duplicated under push and pull_request because
  # actionlint rejects YAML aliases in `paths:` — keep the two copies
  # in sync when editing.
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'benches/**'
      - 'Cargo.toml'
      - 'rustfmt.toml'
      - '.config/nextest.toml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'benches/**'
      - 'Cargo.toml'
      - 'rustfmt.toml'
      - '.config/nextest.toml'
      - '.github/workflows/ci.yml'
  schedule:
    # Nightly run that exercises the full platform + KAT matrix
    # regardless of whether anything was pushed that day.
    - cron: "0 6 * * *"
  workflow_dispatch:

# Cancel superseded runs on both PR and main while we're still
# stabilizing — a fresh push always kills any in-flight CI for the
# previous commit. Once main settles, switch to PR-only cancellation
# (`cancel-in-progress: ${{ github.event_name == 'pull_request' }}`)
# to preserve a per-commit CI history on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Restrict default permissions to read-only. Jobs that need more
# must declare their own permissions block.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Runner routing
#
# Every Linux job's `runs-on` is gated on the trigger context:
#   - push to main, schedule, workflow_dispatch, same-repo PR
#       -> Fly self-hosted (`[self-hosted, fly, linux, x64]`)
#   - fork PR
#       -> GH-hosted (`ubuntu-latest`)
#
# Fork PRs run arbitrary contributor code and must NOT execute on
# our self-hosted Machines. The same-repo distinction is
# `head.repo.full_name == github.repository` — anyone with write
# access to the repo can push branches, so write-access is the
# trust line.
#
# The expression repeats inline on every `runs-on` since GitHub
# Actions does not support YAML anchors for `runs-on` values.

# Tier 1 — Gate
#
# Fast checks that catch the most common problems. Required for merge.
# All run in parallel, no dependencies. Target: <5 min wall time.

jobs:
  fmt:
    name: Format
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","fly","linux","x64"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    permissions:
      checks: write
      contents: read
      # reviewdog needs to read the PR's diff to know which lines to
      # annotate. Without this, reviewdog gets a 403 on
      # GET /repos/{owner}/{repo}/pulls/{num} and the step fails
      # even when rustfmt itself passes.
      pull-requests: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          # Narrow exception (other jobs use false): reviewdog's PR-
          # diff lookup falls back from the API to `git fetch` when
          # it can't get the diff via the API. The fetch fails with
          # "could not read Username" if credentials aren't loaded.
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2  # nightly
        with:
          components: rustfmt

      # rustfmt is the source of truth for whether Format passes or
      # fails. Run it standalone first so a reviewdog outage (e.g. a
      # 502 from GitHub's API during reviewdog's "checking GitHub for
      # latest tag" probe) can never turn a green fmt into a red job.
      - name: Run rustfmt
        run: cargo +nightly fmt --all -- --check

      # On PRs (where the inline annotations actually help reviewers),
      # also pipe the fmt output through reviewdog for line-level
      # comments. Marked `continue-on-error: true` so a reviewdog/API
      # hiccup can't gate the PR — the standalone rustfmt above is
      # what the required check should care about.
      - uses: reviewdog/action-setup@38a8d76742a75eeb6c6ffc616bde64179fd09ebf
        if: github.event_name == 'pull_request'
      - name: Annotate fmt diffs (PR only)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo +nightly fmt --all -- --check 2>&1 |
            reviewdog -f=diff -reporter=github-check -fail-level=any

  clippy:
    name: Clippy
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","fly","linux","x64"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2  # nightly
        with:
          components: clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: Run clippy
        run: |
          set -o pipefail
          echo '## Clippy' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cargo +nightly clippy --all-targets --all-features --message-format=short -- -D warnings 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  gate:
    name: lib + doc tests (x86_64-linux)
    # Run the full test suite under the `release-checked` cargo
    # profile — release-mode optimization (so the 100 sign KATs run
    # in 1–6s each instead of 14–60s in debug) but with
    # `debug-assertions` and `overflow-checks` kept on (so invariant
    # `debug_assert!`s and unintended integer overflow still surface).
    # Cargo.toml defines the profile.
    #
    # Fork PRs still route to GH-hosted. `perf-4x` is required: the
    # release-checked build + 100 sign KATs is CPU-bound and Fly's
    # shared CPUs throttle after the burst window, ~3× wall-clock vs
    # dedicated cores. Empirically: ~10 min on perf-4x, >30 min on
    # shared-cpu-4x.
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","fly","linux","perf-4x"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    # sccache against a Tigris S3 bucket replaces `Swatinem/rust-cache`
    # for this job. The previous pre/post rust-cache steps spent ~5 min
    # restoring + ~2.5 min saving GHA-artifact-stored target/ tarballs
    # (~7.5 min of overhead on a ~5 min test phase). sccache caches at
    # the rustc-invocation level into S3, with parallel reads at low
    # latency — no monolithic restore/save phases, only cache writes
    # for the .rmeta / .rlib files that actually changed.
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_BUCKET: selkie-ci-sccache
      SCCACHE_ENDPOINT: https://fly.storage.tigris.dev
      SCCACHE_REGION: auto
      # Bucket-scoped Tigris creds. Separate from the
      # `TIGRIS_*` pair used by the `selkie-ci-scratch` bucket
      # (mutants intermediates, fuzz seed corpora) so a leak of
      # either doesn't compromise both.
      AWS_ACCESS_KEY_ID: ${{ secrets.TIGRIS_SCCACHE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_SCCACHE_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - uses: mozilla-actions/sccache-action@1583d6b38d7be47f593cb472781bbb21cab4321e  # v0.0.10
      - uses: taiki-e/install-action@3fa6878dc4ae603f73960271565a082bf196ab96
        with:
          # Pinned so kat-report.rs's JUnit parser doesn't break on
          # a future nextest format change. Bump in lockstep with
          # the parser's self-test fixture (see kat-report.rs's
          # `#[cfg(test)] mod tests`).
          tool: cargo-nextest@0.9.133
      - run: cargo nextest run --cargo-profile release-checked
      # Tests in `tests/` that consume `keys::kat_data::KAT_VECTORS`
      # (api_properties, bit_flip_sweep, malleability,
      # semantic_boundaries) are gated on `expose-internals` and
      # silently skipped above. Re-run scoped to just those four so we
      # don't pay the full lib-test suite again on a different feature
      # flag. `alloc_budget`, `zeroize`, and `ctgrind` are also gated
      # but have dedicated jobs in `audit.yml`.
      - run: cargo nextest run --features expose-internals --cargo-profile release-checked --test api_properties --test bit_flip_sweep --test cross_kat_verify --test malleability --test semantic_boundaries
      - run: cargo test --doc

      # Print the cache hit rate. First run on a fresh bucket: all
      # misses, expected. Subsequent runs: most-to-all hits if the
      # source didn't change. Useful for diagnosing whether sccache
      # is doing what we think it's doing.
      - name: sccache stats
        if: always()
        run: sccache --show-stats

      # Compile-check the `--no-default-features` variant on the same
      # platform. Catches code paths gated on optional features (e.g.
      # `expose-internals`) that the default-features build wouldn't
      # see. Cheap (~couple minutes warm cache) and runs on every
      # PR + push, unlike the previous `platform-fly` job which only
      # fired on push — a no-default-features compile break used to
      # land in main and surface a day later.
      - run: cargo check --no-default-features --all-targets

      # Build the dashboard's kat.json directly from the gate's
      # JUnit output (enabled in `.config/nextest.toml`'s default
      # profile) instead of re-running the same tests in a separate
      # job. Only fires on push-to-main, like the upload itself.
      - name: Generate KAT report from JUnit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          rustc -O .github/scripts/kat-report.rs -o /tmp/kat-report
          /tmp/kat-report "${{ github.sha }}" target/nextest/default/junit.xml > kat.json
      - name: Verify kat payload has data
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: jq -e '(.suites | length > 0) and ([.suites[].total] | add > 0)' kat.json > /dev/null || { echo "::error::kat.json has no test suites or zero tests across all suites"; cat kat.json >&2; exit 1; }
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - name: Upload KAT to CI site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: rustc -O .github/scripts/ci-upload.rs -o /tmp/ci-upload && /tmp/ci-upload kat kat.json "${{ github.sha }}"

  # Property tests are covered by `gate`'s unfiltered
  # `cargo nextest run` — every `proptest! { #[test] fn foo(...) }`
  # block produces a regular test function that nextest picks up.
  # A standalone `proptest` job filtered with `-- proptest` was
  # previously here but matched zero of ~720 lib tests (the macro
  # doesn't put "proptest" in test names), so it was deleted.

  doc:
    name: Documentation
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","fly","linux","x64"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          shared-key: linux-x64-default-stable

      - name: Build docs
        run: cargo doc --no-deps --document-private-items

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - name: Upload rustdoc to CI site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo '<meta http-equiv="refresh" content="0;url=sqisign_selkie/">' \
            > target/doc/index.html
          tar -czf /tmp/rustdoc.tar.gz -C target/doc .
          rustc -O .github/scripts/ci-signal.rs -o /tmp/ci-signal
          /tmp/ci-signal docs running "${{ github.sha }}"
          echo "put /tmp/rustdoc.tar.gz /data/rustdoc.tar.gz" | flyctl ssh sftp shell -a sqisign-selkie-ci
          flyctl ssh console -a sqisign-selkie-ci -C "sh -c 'set -e; rm -rf /data/rustdoc && mkdir -p /data/rustdoc && tar -xzf /data/rustdoc.tar.gz -C /data/rustdoc && rm /data/rustdoc.tar.gz'"

  # Tier 2 — Cross-platform sanity (lib + doc only)
  #
  # Cross-platform check that lib + doc compile and pass on macOS
  # and Windows (Fly is x86_64-linux only, so non-Linux targets
  # have to run GH-hosted). Skipped on PR and on private repos —
  # the matrix per PR push is expensive (Windows bills 2×, macOS
  # 10×). Runs on push to main + nightly cron + manual dispatch
  # once the repo flips public.
  #
  # The x86_64-linux row is intentionally absent: the `gate` job
  # already covers it (default features) and includes a
  # `cargo check --no-default-features --all-targets` step that
  # exercises the no-default-features compile path on every PR.

  # macOS + Windows targets run on GH-hosted (Fly is x86_64-linux
  # only). Gated on `repository.visibility == 'public'` so the
  # workflow no-ops while the repo is private — those minutes are
  # billed at 10× / 2× respectively.
  #
  # i686 and aarch64 Linux rows stay commented out for now:
  #   - i686-unknown-linux-gnu would need `gcc-multilib` + the i686
  #     rustup target back on the runner image. Both were dropped to
  #     slim the image since Fly is x86_64-only.
  #   - aarch64-unknown-linux-gnu would land on the `ubuntu-24.04-arm`
  #     GH-hosted runner which bills regular minutes.
  platform-billed:
    name: "lib + doc tests (${{ matrix.target }}, ${{ matrix.bits }}-bit)"
    needs: [gate]
    if: |
      github.event_name != 'pull_request' &&
      github.event.repository.visibility == 'public'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bits: 64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bits: 64
          - os: windows-latest
            target: i686-pc-windows-msvc
            bits: 32
          # - os: ubuntu-24.04
          #   target: i686-unknown-linux-gnu
          #   bits: 32
          #   multilib: true
          # - os: ubuntu-24.04-arm
          #   target: aarch64-unknown-linux-gnu
          #   bits: 64
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      # When restoring the commented-out i686-linux matrix row, also
      # add back this step:
      #   - name: Install 32-bit multilib (Linux i686)
      #     if: matrix.multilib
      #     run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          key: ${{ matrix.target }}
      - uses: taiki-e/install-action@3fa6878dc4ae603f73960271565a082bf196ab96
        with:
          # Pinned in lockstep with `gate`'s nextest version so a
          # future format change can't desync the two jobs (and so
          # the JUnit output, if we ever consume it here, matches
          # what `kat-report.rs` parses).
          tool: cargo-nextest@0.9.133
      - run: cargo nextest run --target ${{ matrix.target }}
      - run: cargo test --doc --target ${{ matrix.target }}

  # Tier 3 — Informational
  #
  # Deeper analysis that provides useful signal but does not block merge.
  # Only starts after the gate passes. Failures show on the PR but are
  # not required status checks.

  sage-precompute-check:
    name: Sage precompute cross-check
    needs: [gate]
    # Runs on Fly self-hosted with Sage installed at job time. Sage
    # is NOT pre-baked into the runner image because the conda env
    # would push the image over Fly's 8 GB unpack ceiling. The job
    # installs into `~/sage-env` on the runtime overlayfs (sized via
    # `rootfs.size_gb` in the orchestrator's Machine config), and
    # `actions/cache` brings warm runs down to ~1–2 min.
    #
    # Skipped on fork PR (untrusted code on self-hosted Machines).
    # `perf-4x`: the cross-check is mostly Sage subprocess work, which
    # is single-threaded but CPU-bound for ~30 min on perf-4x. On
    # shared-cpu-4x the throttling extends that well past the timeout.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, fly, linux, perf-4x]
    # 60 min: cold runs do a one-time Sage conda install (~several
    # minutes) plus the cross-check itself. Warm runs hit
    # `actions/cache` and finish quickly. 30 min was cancelling
    # cold-cache runs and the whole parent CI run with them.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae

      - name: Cache Conda environment
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: ~/sage-env
          key: sage-conda-${{ runner.os }}-10.6

      - name: Install SageMath via conda-forge
        run: |
          if [ ! -d ~/sage-env ]; then
            curl -sSL -o miniforge.sh https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh
            bash miniforge.sh -b -p ~/miniforge
            ~/miniforge/bin/conda create -y -p ~/sage-env sage=10.6 -c conda-forge
          fi
          echo "$HOME/sage-env/bin" >> "$GITHUB_PATH"

      - name: Verify Sage >= 10.5
        run: sage --version

      - name: Run Sage cross-check test
        run: cargo test sage_cross_check -- --ignored

  c-ref-cross-check:
    name: C reference cross-check
    needs: [gate]
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","fly","linux","x64"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae

      - name: Run C ref basis cross-check
        run: cargo test c_ref_basis_cross_check -- --ignored

      - name: Run C ref all-bases cross-check
        run: cargo test c_ref_all_bases_cross_check -- --ignored

      - name: Run C ref KAT verification cross-check
        run: cargo test c_ref_kat_cross_check -- --ignored

  platform-report:
    name: Platform coverage
    needs: [gate, platform-billed]
    # Only fires on main (never PR), so safe on self-hosted Fly.
    # `!cancelled()` (not `always()`) so a user-cancelled run skips
    # the upload; coverage still reports on gate/platform-billed
    # failures since the dashboard wants to show which platforms
    # ran regardless of overall pass/fail.
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, fly, linux, x64]
    timeout-minutes: 5
    permissions:
      contents: read
      # `platform-report.rs` calls `/repos/{owner}/{repo}/actions/runs/
      # {id}/jobs` to discover the matrix's per-target job results.
      # Inheriting the workflow-level `contents: read` returns 403 on
      # that endpoint; `actions: read` is the GH-documented scope.
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      - name: Generate platform report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rustc -O .github/scripts/platform-report.rs -o /tmp/platform-report
          /tmp/platform-report "${{ github.run_id }}" "${{ github.sha }}" > platform.json
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Verify platform payload has data
        run: jq -e '.platforms | length > 0' platform.json > /dev/null || { echo "::error::platform.json has no platforms"; cat platform.json >&2; exit 1; }
      - name: Upload
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: rustc -O .github/scripts/ci-upload.rs -o /tmp/ci-upload && /tmp/ci-upload platform platform.json "${{ github.sha }}"
