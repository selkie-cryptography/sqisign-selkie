name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Restrict default permissions to read-only. Jobs that need more
# must declare their own permissions block.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.target }}, ${{ matrix.bits }}-bit)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Rust Tier 1 targets. 64-bit targets run on native runners;
          # 32-bit targets cross-compile on 64-bit runners (the test
          # binaries run natively since x86_64 CPUs support i686).
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bits: 64
          - os: ubuntu-24.04
            target: i686-unknown-linux-gnu
            bits: 32
            multilib: true
          - os: macos-latest
            target: aarch64-apple-darwin
            bits: 64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bits: 64
          - os: windows-latest
            target: i686-pc-windows-msvc
            bits: 32
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bits: 64
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install 32-bit multilib (Linux i686)
        if: matrix.multilib
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      # dtolnay/rust-toolchain uses branch refs (stable/nightly) by
      # design so the Rust version tracks upstream releases.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          key: ${{ matrix.target }}
      - uses: taiki-e/install-action@055f5df8c3f65ea01cd41e9dc855becd88953486
        with:
          tool: cargo-nextest
      - run: cargo nextest run --target ${{ matrix.target }}
      - run: cargo test --doc --target ${{ matrix.target }}

  msrv:
    name: MSRV (1.81.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.81.0
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - run: cargo check

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - uses: reviewdog/action-setup@38a8d76742a75eeb6c6ffc616bde64179fd09ebf
      - name: Run clippy with reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo +nightly clippy --all-targets --all-features --message-format=short -- -W warnings 2>&1 |
            reviewdog -f=clippy -reporter=github-check -fail-level=none

  fmt:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: reviewdog/action-setup@38a8d76742a75eeb6c6ffc616bde64179fd09ebf
      - name: Run rustfmt with reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo +nightly fmt --all -- --check 2>&1 |
            reviewdog -f=diff -reporter=github-check -fail-level=any

  doc:
    name: Documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - run: cargo doc --no-deps

  coverage:
    name: Code coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Gates PRs on minimum line coverage.
    # On push to main, generates JSON report and uploads to CI site.
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - uses: taiki-e/install-action@055f5df8c3f65ea01cd41e9dc855becd88953486
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - name: Collect coverage (nextest + doctests)
        run: |
          cargo +nightly llvm-cov --no-report nextest
          cargo +nightly llvm-cov --no-report --doc
      - name: Generate coverage report
        run: |
          echo '## Code Coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cargo +nightly llvm-cov report --doctests --fail-under-lines 50 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Generate coverage JSON for CI site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p coverage-out
          cargo +nightly llvm-cov report --doctests --lcov --output-path coverage-out/coverage.lcov
          rustc -O .github/scripts/lcov-to-json.rs -o /tmp/lcov-to-json
          /tmp/lcov-to-json coverage-out/coverage.lcov "${{ github.sha }}" \
            > coverage-out/coverage.json

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - name: Upload coverage to CI site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: bash .github/scripts/ci-upload.sh coverage coverage-out/coverage.json "${{ github.sha }}"

  audit:
    name: cargo deny
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # cargo-deny only reads Cargo.toml/lock, no compilation needed.
      - uses: taiki-e/install-action@055f5df8c3f65ea01cd41e9dc855becd88953486
        with:
          tool: cargo-deny
      - run: cargo deny check advisories bans

  # Incremental mutation testing: only mutate code changed in the
  # push or PR.  Full run is weekly (see mutants.yml).
  mutants:
    name: Mutation testing (incremental)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Generate diff
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff "origin/${BASE_REF}".. > git.diff
          else
            # Push to main: diff against previous commit.
            git diff "${BEFORE_SHA}..HEAD" > git.diff
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - uses: taiki-e/install-action@055f5df8c3f65ea01cd41e9dc855becd88953486
        with:
          tool: cargo-mutants,cargo-nextest
      - name: Run cargo-mutants on changed code
        run: |
          cargo mutants --no-shuffle -vV \
            --test-tool nextest \
            --timeout 180 \
            --in-place \
            --in-diff git.diff -- --lib
      - name: Archive mutants.out
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutants-incremental.out
          path: mutants.out

  sage-precompute-check:
    name: Sage precompute cross-check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae

      - name: Cache Conda environment
        uses: actions/cache@v5
        with:
          path: ~/sage-env
          key: sage-conda-${{ runner.os }}-10.6

      - name: Install SageMath via conda-forge
        run: |
          if [ ! -d ~/sage-env ]; then
            wget -q https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh -O miniforge.sh
            bash miniforge.sh -b -p ~/miniforge
            ~/miniforge/bin/conda create -y -p ~/sage-env sage=10.6 -c conda-forge
          fi
          echo "$HOME/sage-env/bin" >> "$GITHUB_PATH"

      - name: Verify Sage >= 10.5
        run: |
          sage --version

      - name: Run Sage cross-check test
        run: cargo test sage_cross_check -- --ignored

  c-ref-cross-check:
    name: C reference cross-check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae

      - name: Run C ref basis cross-check
        run: cargo test c_ref_basis_cross_check -- --ignored

      - name: Run C ref KAT verification cross-check
        run: cargo test c_ref_kat_cross_check -- --ignored

  paper:
    name: Build LaTeX documents
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: true

      - name: Build paper
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: latex
          root_file: sqisign-selkie.tex

      - name: Build spec review
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: latex
          root_file: sqisign-v2-spec-review.tex

      - name: Upload PDFs
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: latex-pdfs
          path: |
            latex/sqisign-selkie.pdf
            latex/sqisign-v2-spec-review.pdf

      - name: Annotate commit with artifact link
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARTIFACT_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${{ steps.upload.outputs.artifact-id }}"
          gh api repos/${{ github.repository }}/statuses/${{ github.sha }} \
            -f state=success \
            -f target_url="$ARTIFACT_URL" \
            -f description="Download built PDFs" \
            -f context="latex-pdfs"

  site:
    name: Deploy CI site
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Deploy to Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        working-directory: .github/site
        run: flyctl deploy
