name: Constant-time testing

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1"   # weekly, Monday 07:00 UTC (after mutants)
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  dudect:
    name: DudeCT
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          key: dudect

      - name: Run DudeCT tests (60s per function)
        run: |
          # dudect runs continuously; timeout caps each invocation.
          # Run the bench binary directly (not via cargo bench) so we
          # can capture stdout.
          cargo build --release --bench dudect --features expose-internals
          timeout 120 ./target/release/deps/dudect-* 2>&1 | tee dudect-output.txt || true

      - name: Generate JSON
        run: |
          rustc -O .github/scripts/dudect-to-json.rs -o /tmp/dudect-to-json
          /tmp/dudect-to-json dudect-output.txt "${{ github.sha }}" \
            > dudect.json

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      - name: Upload to CI site
        if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: rustc -O .github/scripts/ci-upload.rs -o /tmp/ci-upload && /tmp/ci-upload dudect dudect.json "${{ github.sha }}"
