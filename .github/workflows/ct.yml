name: Constant-Time

# Runs on self-hosted Fly runners (shared-cpu-4x). CT measurements
# are timing-sensitive; shared CPU adds noise vs dedicated hardware.
# Acceptable for CI regression detection (DudeCT statistical + Tacet
# taint-tracking both tolerate noise). For publication-grade
# measurements, run on dedicated hardware off-CI.

on:
  # DudeCT + Tacet run on pushes, pull requests, workflow_dispatch, and a
  # weekly cron fallback (the `cron-gate` job skips a scheduled firing if
  # any non-cron run fired in the last 7 days). The expensive ctgrind job
  # (up to 2h) is guarded to skip pull requests — see its `if:`.
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/ctgrind.rs'
      - 'benches/dudect.rs'
      - 'benches/tacet.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ct.yml'
      - '.github/actions/ci-pr-report/action.yml'
      - '.github/scripts/ci-report.rs'
  pull_request:
    paths:
      - 'src/**'
      - 'benches/dudect.rs'
      - 'benches/tacet.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ct.yml'
      - '.github/actions/ci-pr-report/action.yml'
      - '.github/scripts/ci-report.rs'
  schedule:
    - cron: "0 7 * * *"   # daily 07:00 UTC; conditionally skipped — see `cron-gate`.
  workflow_dispatch:

# Cancel a superseded run if a newer commit lands before the prior
# CT run finishes — the latest signal is the only one that matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Skip the weekly cron firing if anything else (push, dispatch, or
  # a prior cron) has already run CT in the last 7 days. The cron is
  # a fallback that only matters when main has been quiet on CT-
  # sensitive paths; if a push triggered CT three days ago, there's
  # no value in re-running today.
  cron-gate:
    name: Cron gate (skip if recent run)
    if: github.event_name == 'schedule'
    runs-on: [self-hosted, fly, linux, x64]
    timeout-minutes: 2
    # `actions: read` is needed to list workflow runs (the
    # github-script step calls actions API); contents:read alone
    # returns 403 on that endpoint.
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Look for non-cron runs on main in last 24h
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          # Filter: non-schedule runs (prior cron firings shouldn't
          # satisfy "we ran"; the cron is the fallback) on main, in
          # the last cron interval, excluding self.
          script: |
            const cutoff = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ct.yml',
              per_page: 50,
            });
            const recent = data.workflow_runs.filter(r =>
              r.id !== context.runId &&
              r.event !== 'schedule' &&
              r.head_branch === 'main' &&
              r.created_at >= cutoff
            ).length;
            core.setOutput('skip', recent > 0 ? 'true' : 'false');
            core.info(recent > 0
              ? `Found ${recent} non-cron CT run(s) on main since ${cutoff}; skipping this cron firing.`
              : `No non-cron CT runs on main since ${cutoff}; proceeding with cron firing.`);


  ct:
    name: DudeCT + Tacet
    needs: [cron-gate]
    # On non-schedule triggers cron-gate is skipped → `!cancelled()`
    # lets this job's `if:` still evaluate (whereas the default
    # behavior would propagate the skip). On schedule, gate on the
    # cron-gate output.
    if: |
      !cancelled() &&
      (github.event_name != 'schedule' ||
       needs.cron-gate.outputs.skip == 'false')
    runs-on: [self-hosted, fly, linux, perf-2x]
    timeout-minutes: 30
    permissions:
      contents: read
      # Sticky CT comments on pull requests.
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - name: Signal running
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          rustc -O .github/scripts/ci-signal.rs -o /tmp/ci-signal
          /tmp/ci-signal dudect running "${{ github.sha }}"
          /tmp/ci-signal tacet running "${{ github.sha }}"

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          key: ct

      # Build both benches.
      - name: Build CT benches
        run: |
          cargo build --release --bench dudect --bench tacet --features expose-internals

      # DudeCT: runs continuously, timeout caps it.
      # The glob must skip the .d dep-info file that cargo leaves next
      # to the binary — find the sole executable instead.
      - name: Run DudeCT
        run: |
          bin=$(find ./target/release/deps -maxdepth 1 -name 'dudect-*' -executable -type f | head -1)
          timeout 120 "$bin" 2>&1 | tee dudect-output.txt || true

      # Tacet: runs to completion per function per model.
      - name: Run Tacet
        run: |
          bin=$(find ./target/release/deps -maxdepth 1 -name 'tacet-*' -executable -type f | head -1)
          timeout 300 "$bin" 2>&1 | tee tacet-output.txt || true

      # Convert both to JSON.
      - name: Generate JSON
        run: |
          rustc -O .github/scripts/dudect-to-json.rs -o /tmp/dudect-to-json
          rustc -O .github/scripts/tacet-to-json.rs -o /tmp/tacet-to-json
          /tmp/dudect-to-json dudect-output.txt "${{ github.sha }}" > dudect.json
          /tmp/tacet-to-json tacet-output.txt "${{ github.sha }}" > tacet.json

      # Upload both to the CI site under separate paths (push to main only).
      - name: Verify dudect/tacet payloads have data
        run: |
          jq -e '.total > 0' dudect.json > /dev/null || { echo "::error::dudect.json has no test results"; cat dudect.json >&2; exit 1; }
          jq -e '.total > 0' tacet.json > /dev/null || { echo "::error::tacet.json has no test results"; cat tacet.json >&2; exit 1; }
      - name: Upload DudeCT to CI site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/ci-upload
        with:
          kind: dudect
          payload: dudect.json
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}
      - name: Upload Tacet to CI site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/ci-upload
        with:
          kind: tacet
          payload: tacet.json
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}

      # Job summary always; sticky PR comments on same-repo PRs.
      - name: Report DudeCT
        uses: ./.github/actions/ci-pr-report
        with:
          kind: dudect
          payload: dudect.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Report Tacet
        uses: ./.github/actions/ci-pr-report
        with:
          kind: tacet
          payload: tacet.json
          github-token: ${{ secrets.GITHUB_TOKEN }}

  ctgrind:
    name: ctgrind (Valgrind taint tracking)
    needs: [cron-gate]
    # Skips pull requests — the slow (up to 2h) Valgrind run gates
    # post-merge on main, not per-PR.
    if: |
      !cancelled() &&
      github.event_name != 'pull_request' &&
      (github.event_name != 'schedule' ||
       needs.cron-gate.outputs.skip == 'false')
    runs-on: [self-hosted, fly, linux, perf-2x]
    timeout-minutes: 120
    env:
      # Enables the slow keygen/sign/verify CT tests in
      # `tests/ctgrind.rs` (see `skip_unless_slow`). They each add a
      # multi-minute Valgrind run; the weekly cadence + 120 min
      # ceiling absorbs the cost. Unset → only the fast Fp / Fp2
      # tests run, same as a local `cargo test --test ctgrind`.
      CTGRIND_SLOW: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: Run ctgrind tests under Valgrind
        run: |
          rustc -O .github/scripts/ctgrind-report.rs -o /tmp/ctgrind-report
          /tmp/ctgrind-report "${{ github.sha }}" > ctgrind.json
      - name: Verify ctgrind payload has data
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: jq -e '.tests > 0 and (.results | length > 0)' ctgrind.json > /dev/null || { echo "::error::ctgrind.json has no test results"; cat ctgrind.json >&2; exit 1; }
      - name: Upload
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/ci-upload
        with:
          kind: ctgrind
          payload: ctgrind.json
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}
