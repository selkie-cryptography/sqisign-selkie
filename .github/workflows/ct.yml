name: Constant-Time

# Runs on self-hosted Fly runners (shared-cpu-2x). CT measurements
# are timing-sensitive; shared CPU adds noise vs dedicated hardware.
# Acceptable for CI regression detection (DudeCT statistical + Tacet
# taint-tracking both tolerate noise). For publication-grade
# measurements, run on dedicated hardware off-CI.

on:
  # CT runs on a weekly schedule and on demand only — DudeCT/Tacet
  # are slow and not needed on every push. Push trigger removed in
  # favor of the weekly cron + manual dispatch.
  schedule:
    - cron: "0 7 * * 1"   # weekly, Monday 07:00 UTC (after mutants)
  workflow_dispatch:

# Cancel a superseded run if a newer commit lands before the prior
# CT run finishes — the latest signal is the only one that matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ct:
    name: DudeCT + Tacet
    runs-on: [self-hosted, fly, linux, x64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Signal running
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          rustc -O .github/scripts/ci-signal.rs -o /tmp/ci-signal
          /tmp/ci-signal dudect running "${{ github.sha }}"
          /tmp/ci-signal tacet running "${{ github.sha }}"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          key: ct

      # Build both benches.
      - name: Build CT benches
        run: |
          cargo build --release --bench dudect --bench tacet --features expose-internals

      # DudeCT: runs continuously, timeout caps it.
      # The glob must skip the .d dep-info file that cargo leaves next
      # to the binary — find the sole executable instead.
      - name: Run DudeCT
        run: |
          bin=$(find ./target/release/deps -maxdepth 1 -name 'dudect-*' -executable -type f | head -1)
          timeout 120 "$bin" 2>&1 | tee dudect-output.txt || true

      # Tacet: runs to completion per function per model.
      - name: Run Tacet
        run: |
          bin=$(find ./target/release/deps -maxdepth 1 -name 'tacet-*' -executable -type f | head -1)
          timeout 300 "$bin" 2>&1 | tee tacet-output.txt || true

      # Convert both to JSON.
      - name: Generate JSON
        run: |
          rustc -O .github/scripts/dudect-to-json.rs -o /tmp/dudect-to-json
          rustc -O .github/scripts/tacet-to-json.rs -o /tmp/tacet-to-json
          /tmp/dudect-to-json dudect-output.txt "${{ github.sha }}" > dudect.json
          /tmp/tacet-to-json tacet-output.txt "${{ github.sha }}" > tacet.json

      # Upload both to the CI site under separate paths.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Verify dudect/tacet payloads have data
        run: |
          jq -e '.total > 0' dudect.json > /dev/null || { echo "::error::dudect.json has no test results"; cat dudect.json >&2; exit 1; }
          jq -e '.total > 0' tacet.json > /dev/null || { echo "::error::tacet.json has no test results"; cat tacet.json >&2; exit 1; }
      - name: Upload to CI site
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          rustc -O .github/scripts/ci-upload.rs -o /tmp/ci-upload
          /tmp/ci-upload dudect dudect.json "${{ github.sha }}"
          /tmp/ci-upload tacet tacet.json "${{ github.sha }}"

  ctgrind:
    name: ctgrind (Valgrind taint tracking)
    runs-on: [self-hosted, fly, linux, x64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Run ctgrind tests under Valgrind
        run: |
          rustc -O .github/scripts/ctgrind-report.rs -o /tmp/ctgrind-report
          /tmp/ctgrind-report "${{ github.sha }}" > ctgrind.json
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - name: Verify ctgrind payload has data
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: jq -e '.tests > 0 and (.results | length > 0)' ctgrind.json > /dev/null || { echo "::error::ctgrind.json has no test results"; cat ctgrind.json >&2; exit 1; }
      - name: Upload
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: rustc -O .github/scripts/ci-upload.rs -o /tmp/ci-upload && /tmp/ci-upload ctgrind ctgrind.json "${{ github.sha }}"
