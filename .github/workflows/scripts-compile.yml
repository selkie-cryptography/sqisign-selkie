name: Compile scripts

# Compile each .rs file in .github/scripts/ to catch syntax / type
# errors before the workflow that uses it actually fires. Each
# script is built into a throwaway file under /tmp — the scripts
# are stdlib-only single-file programs (same pattern as ci-upload,
# ci-scratch, fuzz-report, etc.) so this is fast and dep-free.
# (`-o /dev/null` doesn't work: rustc places per-output temp files
# in the *parent dir* of the output path, and /dev isn't writable.)
#
# Replaces the incidental coverage that the previous
# `.github/scripts/**` entry in ci.yml / audit.yml / bench.yml /
# coverage.yml / iai.yml provided by re-running their full pipelines
# on script-only changes.

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/**'
      - '.github/workflows/scripts-compile.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/scripts/**'
      - '.github/workflows/scripts-compile.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  compile:
    name: rustc -O .github/scripts/*.rs
    runs-on: [self-hosted, fly, linux, x64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Compile each script
        run: |
          outdir=$(mktemp -d)
          fail=0
          for f in .github/scripts/*.rs; do
            echo "[compile] $f"
            rustc -O "$f" -o "$outdir/$(basename "${f%.rs}")" || {
              echo "::error file=$f::failed to compile"
              fail=1
            }
          done
          exit $fail
