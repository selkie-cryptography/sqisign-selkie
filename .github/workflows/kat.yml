name: KAT (manual)

# Manually-triggerable run of the full KAT test suite.
#
# CI's `platform` job (in ci.yml) already runs the same tests on
# every push/PR via the cross-platform matrix, but those runs are
# tied to commits landing on the branch. This workflow lets us
# kick off a KAT pass on demand against any branch — useful when
# iterating on byte-interop work without churning the PR.
#
# Covers (the per-KAT tests, one nextest process per vector):
#   - `verify_kat_NNN`        (KAT signature verification, fast)
#   - `keygen_kat_NNN`        (deterministic keygen vs KAT vector)
#   - `sign_kat_derand_NNN`   (deterministic sign + verify roundtrip)
#   - `c_ref_kat_cross_check` (verify our sigs against the C ref)
#
# The aggregate `kat_verify_all` / `keygen_kat_all` / `sign_kat_all`
# tests loop over the same 100 vectors in a single process; the
# default filter excludes them so each KAT runs exactly once.
#
# Per-test budget comes from the `kat` nextest profile (30 min);
# the job cap is 6 h to absorb 8-way parallel contention on the
# slowest sign KATs (matching the platform job in ci.yml).

on:
  # Triggered on the same push/PR paths as ci.yml. Yes, this duplicates
  # ci.yml's `platform` job, which already runs the same KAT tests across
  # the cross-platform matrix. The duplication is intentional for now:
  # we're iterating heavily on KAT byte-equality and want a faster
  # single-platform signal in addition to the matrix. Once KAT progress
  # stabilizes, fold this back into ci.yml and drop the workflow.
  push:
    branches: [main]
    paths: &rust-paths
      - 'src/**'
      - 'tests/**'
      - 'benches/**'
      - 'Cargo.toml'
      - 'rustfmt.toml'
      - '.config/nextest.toml'
      - '.github/scripts/**'
      - '.github/workflows/kat.yml'
  pull_request:
    branches: [main]
    paths: *rust-paths
  workflow_dispatch:
    inputs:
      filter:
        description: 'nextest filter expression. Empty = all KAT tests. Examples: test(/sign_kat_derand_/) or test(=keygen_kat_005)'
        required: false
        default: ''
      release:
        description: 'Build in release mode (much faster sign KATs, slower compile)'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  kat:
    name: KAT tests (x86_64-linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - uses: taiki-e/install-action@3fa6878dc4ae603f73960271565a082bf196ab96
        with:
          tool: cargo-nextest

      - name: Run KAT tests
        run: |
          set -o pipefail
          FILTER='${{ inputs.filter }}'
          if [ -z "$FILTER" ]; then
            # Per-KAT tests + cheap aggregates, minus the redundant
            # whole-suite loops that re-run every vector in one process.
            FILTER='test(/kat/) - test(=kat_verify_all) - test(=keygen_kat_all) - test(=sign_kat_all)'
          fi
          ARGS=(nextest run --profile kat --run-ignored=all --status-level=fail --hide-progress-bar -E "$FILTER")
          if [ "${{ inputs.release }}" = "true" ]; then
            ARGS+=(--release)
          fi
          {
            echo "## KAT run"
            echo "Filter: \`$FILTER\`"
            echo "Release: \`${{ inputs.release }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          cargo "${ARGS[@]}"
