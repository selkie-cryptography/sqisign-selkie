name: KAT (manual)

# Manually-triggerable run of the full KAT test suite against any
# branch with a custom filter. Useful for iterating on KAT
# byte-equality work without churning the PR queue.
#
# Routine push/PR coverage of these tests lives in ci.yml's `kat`
# job: that one runs on every push to main + nightly schedule
# across the full Tier 1 matrix, plus a slim linux-x64 row on PR.
# This workflow is the on-demand escape hatch for ad-hoc filters /
# branches not yet covered by the standard CI signal.
#
# Covers the per-vector KAT tests (one nextest process per KAT):
#   - `verify_kat_NNN`        (KAT signature verification, fast)
#   - `keygen_kat_NNN`        (deterministic keygen vs KAT vector)
#   - `sign_kat_derand_NNN`   (deterministic sign + verify roundtrip)
#
# The whole-suite `kat_verify_all` / `keygen_kat_all` / `sign_kat_all`
# aggregates loop over the same 100 vectors in one process — redundant
# under the per-vector partitioning and they defeat per-test timeouts
# (one slow KAT stalls the aggregate), so they're not included here.
#
# Other tests whose name happens to contain "kat" (e.g.
# `from_hnf_columns_mod_cref_kat1_o_alpha`, `kat_cref_cross_check_*`,
# `signature_to_bytes_matches_kat_input`, `kat_sk_pk_match_all`,
# `keygen_kat_NNN_rng_trace`, …) are plumbing / regression / fixture
# tests, not KAT-vector coverage, and are also excluded.
#
# Per-test budget comes from the `kat` nextest profile (30 min);
# the job cap is 6 h to absorb 8-way parallel contention on the
# slowest sign KATs.

on:
  workflow_dispatch:
    inputs:
      filter:
        description: 'nextest filter expression. Empty = all KAT tests. Examples: test(/sign_kat_derand_/) or test(=keygen_kat_005)'
        required: false
        default: ''
      release:
        description: 'Build in release mode (much faster sign KATs, slower compile)'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  kat:
    name: KAT tests (x86_64-linux)
    runs-on: [self-hosted, fly, linux, x64]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - uses: taiki-e/install-action@3fa6878dc4ae603f73960271565a082bf196ab96
        with:
          tool: cargo-nextest

      - name: Run KAT tests
        run: |
          set -o pipefail
          FILTER='${{ inputs.filter }}'
          if [ -z "$FILTER" ]; then
            # Per-vector KAT tests only (`{verify,keygen,sign_kat_derand}_NNN`).
            # The `$`-anchored `\d{3}` patterns reject look-alikes like
            # `keygen_kat_NNN_rng_trace` or `kat_cref_cross_check_vector_0`.
            FILTER='test(/sign_kat_derand_\d{3}$/) + test(/keygen_kat_\d{3}$/) + test(/verify_kat_\d{3}$/)'
          fi
          ARGS=(nextest run --profile kat --run-ignored=all --status-level=fail --hide-progress-bar -E "$FILTER")
          if [ "${{ inputs.release }}" = "true" ]; then
            ARGS+=(--release)
          fi
          {
            echo "## KAT run"
            echo "Filter: \`$FILTER\`"
            echo "Release: \`${{ inputs.release }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          cargo "${ARGS[@]}"
