name: Sage cross-check

# Runs `sage verify_precomputed.py` against EXTREMAL_ORDERS in
# `src/quaternions/precomputed.rs`. Split out of ci.yml so the heavy
# Sage install + ~30-40 min subprocess work only fires when its inputs
# actually change, without needing a paths-filter job in ci.yml to
# gate it.

on:
  push:
    branches: [main]
    paths:
      - 'scripts/precomp/verify_precomputed.py'
      - 'scripts/precomp/parameters.py'
      - 'src/quaternions/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/sage-cross-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/precomp/verify_precomputed.py'
      - 'scripts/precomp/parameters.py'
      - 'src/quaternions/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/sage-cross-check.yml'
  schedule:
    # Weekly drift check — conda / Sage upgrades can break the
    # cross-check even when no Rust code changed. Conditionally
    # skipped if a non-cron run already fired on main in the past
    # 7d (see `cron-gate` below).
    - cron: "0 6 * * 0"   # weekly Sunday 06:00 UTC.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Cron fallback: skip the scheduled firing if any non-cron run on
  # main has fired in the last 7d. With sage's narrow path filter,
  # PR-triggered runs are rare; the weekly cron is the main drift-
  # detection mechanism. When it has fired (PR-triggered) within the
  # week, today's cron is redundant.
  cron-gate:
    name: Cron gate (skip if recent run on main)
    if: github.event_name == 'schedule'
    runs-on: [self-hosted, fly, linux, x64]
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Look for non-cron runs on main in last 7d
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const cutoff = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString();
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'sage-cross-check.yml',
              per_page: 50,
            });
            const recent = data.workflow_runs.filter(r =>
              r.id !== context.runId &&
              r.event !== 'schedule' &&
              r.head_branch === 'main' &&
              r.created_at >= cutoff
            ).length;
            core.setOutput('skip', recent > 0 ? 'true' : 'false');
            core.info(recent > 0
              ? `Found ${recent} non-cron sage-cross-check run(s) on main since ${cutoff}; skipping this cron firing.`
              : `No non-cron sage-cross-check runs on main since ${cutoff}; proceeding with cron firing.`);

  sage-precompute-check:
    name: Sage precompute cross-check
    needs: [cron-gate]
    # Runs on Fly self-hosted with Sage installed at job time. Sage
    # is NOT pre-baked into the runner image because the conda env
    # would push the image over Fly's 8 GB unpack ceiling. The job
    # installs into `~/sage-env` on the runtime overlayfs (sized via
    # `rootfs.size_gb` in the orchestrator's Machine config), and
    # `actions/cache` brings warm runs down to ~1–2 min.
    #
    # Skipped on fork PR (untrusted code on self-hosted Machines).
    # On schedule, gated by cron-gate (skip if recent run on main).
    # `perf-4x`: the cross-check is mostly Sage subprocess work, which
    # is single-threaded but CPU-bound for ~30 min on perf-4x. On
    # shared-cpu-4x the throttling extends that well past the timeout.
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'schedule' ||
       needs.cron-gate.outputs.skip == 'false')
    runs-on: [self-hosted, fly, linux, perf-4x]
    # 60 min: cold runs do a one-time Sage conda install (~several
    # minutes) plus the cross-check itself. Warm runs hit
    # `actions/cache` and finish quickly. 30 min was cancelling
    # cold-cache runs and the whole parent CI run with them.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae

      - name: Cache Conda environment
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: ~/sage-env
          key: sage-conda-${{ runner.os }}-10.6

      - name: Install SageMath via conda-forge
        run: |
          if [ ! -d ~/sage-env ]; then
            curl -sSL -o miniforge.sh https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh
            bash miniforge.sh -b -p ~/miniforge
            ~/miniforge/bin/conda create -y -p ~/sage-env sage=10.6 -c conda-forge
          fi
          echo "$HOME/sage-env/bin" >> "$GITHUB_PATH"

      - name: Verify Sage >= 10.5
        run: sage --version

      - name: Run Sage cross-check test
        run: cargo test sage_cross_check -- --ignored
