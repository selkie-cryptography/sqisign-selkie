name: Fuzzing

on:
  schedule:
    - cron: "0 8 * * 1"   # weekly, Monday 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_signature_parse
          - fuzz_verifying_key_parse
          - fuzz_signing_key_parse
          - fuzz_verify
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          key: fuzz-${{ matrix.target }}
          workspaces: fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Run fuzzer (5 min)
        run: |
          cd fuzz
          timeout 300 cargo +nightly fuzz run ${{ matrix.target }} -- \
            -max_total_time=300 2>&1 | tee fuzz-output.txt || true

      - name: Collect results
        run: |
          rustc -O .github/scripts/fuzz-report.rs -o /tmp/fuzz-report
          /tmp/fuzz-report target "${{ matrix.target }}" "${{ github.sha }}" fuzz/fuzz-output.txt > fuzz-result.json

      - name: Upload crash artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-${{ matrix.target }}
          path: |
            fuzz/artifacts/
            fuzz-result.json

  report:
    name: Upload fuzz report
    needs: fuzz
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download results
        uses: actions/download-artifact@v4
        with:
          pattern: fuzz-*
          path: results

      - name: Merge results
        run: |
          rustc -O .github/scripts/fuzz-report.rs -o /tmp/fuzz-report
          /tmp/fuzz-report merge "${{ github.sha }}" results > fuzz.json

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Upload to CI site
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: rustc -O .github/scripts/ci-upload.rs -o /tmp/ci-upload && /tmp/ci-upload fuzz fuzz.json "${{ github.sha }}"
