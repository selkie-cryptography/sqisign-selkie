name: Fuzzing

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'fuzz/**'
      - 'Cargo.toml'
      - '.github/scripts/fuzz-report.rs'
      - '.github/workflows/fuzz.yml'
  schedule:
    # Nightly fallback so fuzzers still run when a day's pushes all
    # miss the path filter above (e.g., workflow-only changes).
    - cron: "30 7 * * *"
  workflow_dispatch:

# Fuzz runs on main pushes (and the nightly fallback); cancel any
# superseded run when a newer commit lands so the 4-target matrix
# doesn't pile up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: [self-hosted, fly, linux, x64]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_signature_parse
          - fuzz_verifying_key_parse
          - fuzz_signing_key_parse
          - fuzz_verify
          # Structure-aware companion to fuzz_verify. Anchors pk +
          # sig.curve_aux to KAT 0 so every iteration reaches the
          # (2,2)-chain.
          - fuzz_verify_typed
          # keygen + sign targets are slow (seconds-to-minutes per
          # iter), so each 10-min slot yields tens of execs rather
          # than thousands. Kept anyway — they target the panic-on-
          # input bug class that exec/s doesn't reflect.
          - fuzz_keygen_panic
          - fuzz_sign_panic
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2  # nightly
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          key: fuzz-${{ matrix.target }}
          workspaces: fuzz
      - uses: taiki-e/install-action@3fa6878dc4ae603f73960271565a082bf196ab96
        with:
          tool: cargo-fuzz

      # Persist the fuzz corpus across runs. libFuzzer's coverage-
      # guided exploration is most effective when seeded with inputs
      # that hit new edges in prior runs; without a cache, every
      # 10-min run restarts from a near-empty corpus and re-discovers
      # the same surface paths. The unique-per-run key with a
      # restore-keys fallback means each run saves its own snapshot
      # and inherits the most-recent prior snapshot for the same
      # target. Crash inputs are still PR'd separately by the "Open
      # PR on crash" step below — that's the durable record; this
      # cache is the working corpus.
      - name: Restore fuzz corpus
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      # Seed the verify corpus with parseable KAT-derived inputs
      # before each run. The cache restore (above) brings forward the
      # most recent fuzz-grown corpus; the seeder then ensures the
      # 100 KAT-derived `pk||sig||msg` triples are present even on
      # cold caches. libFuzzer deduplicates on content hash, so this
      # is idempotent.
      # Seed every target's corpus from the KAT vectors. The seeder
      # writes into all `fuzz/corpus/<target>/` directories; libFuzzer
      # only reads its own target's dir, so no per-target gating is
      # needed.
      - name: Seed corpus from KAT vectors
        run: cargo run --release --features expose-internals --example seed-fuzz-corpus

      # cargo-fuzz on x86_64 Linux defaults to `--target
      # x86_64-unknown-linux-musl` (static-link convenience), but the
      # ubuntu-24.04 runner ships no musl C++ toolchain
      # (`x86_64-linux-musl-g++`), which `libfuzzer-sys`'s build script
      # needs to compile libFuzzer's C++ sources via cc-rs. ASan also
      # refuses static libc. The host gnu target has g++ and dynamic
      # libc out of the box — pin all `cargo fuzz` invocations to it.
      - name: Build fuzzer
        run: |
          cd fuzz
          cargo +nightly fuzz build --target x86_64-unknown-linux-gnu ${{ matrix.target }}

      - name: Run fuzzer (10 min)
        run: |
          cd fuzz
          set -o pipefail
          timeout 600 cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} --no-build -- \
            -max_total_time=600 2>&1 | tee fuzz-output.txt || true

      - name: Collect results
        run: |
          rustc -O .github/scripts/fuzz-report.rs -o /tmp/fuzz-report
          /tmp/fuzz-report target "${{ matrix.target }}" "${{ github.sha }}" fuzz/fuzz-output.txt > fuzz-result.json

      # Ship per-target results to the Tigris scratch bucket for the
      # `report` consolidator job to collect. Tigris (Fly's S3-compatible
      # object store) replaces GHA artifact storage as the cross-job
      # transport — see .github/scripts/ci-scratch.rs. Same shape as
      # the mutants shard transport below.
      #
      # Only on main pushes — the report job itself is push-on-main only,
      # so there's nothing to consume the shard JSON otherwise.
      - name: Build ci-scratch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: rustc -O .github/scripts/ci-scratch.rs -o /tmp/ci-scratch
      - name: Ship fuzz result to Tigris scratch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TIGRIS_ACCESS_KEY_ID: ${{ secrets.TIGRIS_ACCESS_KEY_ID }}
          TIGRIS_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_SECRET_ACCESS_KEY }}
          SHA: ${{ github.sha }}
          TARGET: ${{ matrix.target }}
        run: /tmp/ci-scratch put fuzz "${SHA}" "${TARGET}" fuzz-result.json

      # Crash inputs flow directly into a fuzz-crash/ branch + PR via
      # the next step. Corpora are kept locally in fuzz/artifacts/ and
      # never leave the runner.

      - name: Open PR on crash
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CRASHES=$(find fuzz/artifacts -type f 2>/dev/null | head -5)
          if [ -z "$CRASHES" ]; then
            echo "No crashes found."
            exit 0
          fi
          TARGET="${{ matrix.target }}"
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:7}"
          BRANCH="fuzz-crash/${TARGET}-${SHORT_SHA}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

          mkdir -p "fuzz/corpus/${TARGET}"
          for f in $CRASHES; do
            cp "$f" "fuzz/corpus/${TARGET}/"
          done
          git add -f "fuzz/corpus/${TARGET}/"
          git commit -m "fuzz: add crash inputs for ${TARGET} (${SHORT_SHA})"
          git push origin "$BRANCH"

          # Build crash list for the PR body.
          CRASH_LIST=""
          for f in $CRASHES; do
            FNAME=$(basename "$f")
            HEX=$(xxd -p "$f" | tr -d '\n')
            CRASH_LIST+='```'$'\n'"${FNAME}: ${HEX}"$'\n''```'$'\n\n'
          done

          # Fill in the PR template.
          BODY=$(sed \
            -e "s|__TARGET__|${TARGET}|g" \
            -e "s|__SHA__|${SHA}|g" \
            -e "s|__RUN_URL__|${RUN_URL}|g" \
            .github/fuzz-crash-pr.md)
          BODY="${BODY/__CRASH_LIST__/$CRASH_LIST}"

          gh pr create \
            --title "fuzz: crash in ${TARGET} (${SHORT_SHA})" \
            --body "$BODY" \
            --base main \
            --head "$BRANCH"

  report:
    name: Upload fuzz report
    needs: fuzz
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, fly, linux, x64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      - name: Build ci-scratch
        run: rustc -O .github/scripts/ci-scratch.rs -o /tmp/ci-scratch
      - name: Pull per-target results from Tigris scratch
        env:
          TIGRIS_ACCESS_KEY_ID: ${{ secrets.TIGRIS_ACCESS_KEY_ID }}
          TIGRIS_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_SECRET_ACCESS_KEY }}
          SHA: ${{ github.sha }}
        run: |
          mkdir -p results
          /tmp/ci-scratch get fuzz "${SHA}" results
          ls -la results
          if [ -z "$(ls -A results)" ]; then
            echo "::error::No fuzz shard results found in fuzz/${SHA}/"
            exit 1
          fi

      - name: Merge results
        run: |
          rustc -O .github/scripts/fuzz-report.rs -o /tmp/fuzz-report
          /tmp/fuzz-report merge "${{ github.sha }}" results > fuzz.json

      - name: Verify fuzz payload has data
        run: jq -e '.targets | length > 0' fuzz.json > /dev/null || { echo "::error::fuzz.json has no targets"; cat fuzz.json >&2; exit 1; }
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Upload to CI site
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: rustc -O .github/scripts/ci-upload.rs -o /tmp/ci-upload && /tmp/ci-upload fuzz fuzz.json "${{ github.sha }}"

      # Sweep the per-SHA scratch intermediates now that the merged
      # fuzz.json is published. The bucket lifecycle rule auto-
      # expires objects after 7 days, so a failed clean is non-fatal;
      # this is hygiene, not durability.
      - name: Prune Tigris scratch
        env:
          TIGRIS_ACCESS_KEY_ID: ${{ secrets.TIGRIS_ACCESS_KEY_ID }}
          TIGRIS_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_SECRET_ACCESS_KEY }}
          SHA: ${{ github.sha }}
        run: /tmp/ci-scratch clean fuzz "${SHA}"
