name: Fuzzing

on:
  # The paths list is duplicated under push and pull_request because
  # actionlint rejects YAML aliases in `paths:` — keep the two copies
  # in sync when editing.
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'fuzz/**'
      - 'Cargo.toml'
      - '.github/scripts/fuzz-report.rs'
      - '.github/workflows/fuzz.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'fuzz/**'
      - 'Cargo.toml'
      - '.github/scripts/fuzz-report.rs'
      - '.github/workflows/fuzz.yml'
  schedule:
    # Nightly fallback so fuzzers still run when a day's pushes all
    # miss the path filter above (e.g., workflow-only changes).
    - cron: "30 7 * * *"
  workflow_dispatch:

# Cancel a superseded run when a newer commit (or dispatch) lands
# on the same ref so the 7-target matrix doesn't pile up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # Crash candidates are surfaced inline (Step Summary + workflow log)
  # rather than via uploaded artifacts or auto-opened PRs. The
  # workflow never pushes branches and never creates PRs, so the
  # default minimum contents-read permission is sufficient.
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Surface Rust-side panic backtraces in fuzz crash output. Without
  # this, panics in fuzz targets print only the panic message + a
  # "set RUST_BACKTRACE=1" hint; the triager would have to reproduce
  # locally to see where in our code the panic originated.
  RUST_BACKTRACE: "1"

jobs:
  # Build + run the KAT-corpus seeder once and ship the result to
  # Tigris scratch. The matrix shards below pull this in instead of
  # rebuilding the lib + example 7 times. The seeder writes into all
  # `fuzz/corpus/<target>/` directories from a single invocation, so
  # this is pure duplication elimination — same bytes per shard, just
  # built once. Bucket lifecycle expires the upload after 7 days; the
  # `report` job runs `ci-scratch clean fuzz-seed` for hygiene.
  seed:
    name: Seed corpus from KAT vectors
    runs-on: [self-hosted, fly, linux, x64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          key: fuzz-seed
      - name: Build and run seeder
        run: cargo run --release --features expose-internals --example seed-fuzz-corpus
      - name: Tar seed corpora
        run: tar -czf seed-corpus.tar.gz -C fuzz corpus
      - name: Build ci-scratch
        run: rustc -O .github/scripts/ci-scratch.rs -o /tmp/ci-scratch
      - name: Ship seed corpus to Tigris scratch
        env:
          TIGRIS_ACCESS_KEY_ID: ${{ secrets.TIGRIS_ACCESS_KEY_ID }}
          TIGRIS_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_SECRET_ACCESS_KEY }}
          SHA: ${{ github.sha }}
        # `ci-scratch put` appends `.json` to the bucket key. That's a
        # misnomer for a tarball but functionally fine — Tigris is
        # blob storage and the consumer reads bytes back verbatim.
        run: /tmp/ci-scratch put fuzz-seed "${SHA}" all seed-corpus.tar.gz

  fuzz:
    name: ${{ matrix.target }}
    needs: seed
    # `perf-2x` gives 2 dedicated cores for the 10-min libFuzzer
    # budget. libFuzzer is single-threaded; shared-CPU throttling
    # after the burst-credit window costs measurable execs/sec.
    # 2 cores (one for the fuzz worker, one for OS / supervisor)
    # is the right floor here — perf-4x doesn't speed a single-
    # threaded fuzzer.
    runs-on: [self-hosted, fly, linux, x64, perf-2x]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_signature_parse
          - fuzz_verifying_key_parse
          - fuzz_signing_key_parse
          - fuzz_verify
          # Structure-aware companion to fuzz_verify. Anchors pk +
          # sig.curve_aux to KAT 0 so every iteration reaches the
          # (2,2)-chain.
          - fuzz_verify_typed
          # keygen + sign targets are slow (seconds-to-minutes per
          # iter), so each 10-min slot yields tens of execs rather
          # than thousands. Kept anyway — they target the panic-on-
          # input bug class that exec/s doesn't reflect.
          - fuzz_keygen_panic
          - fuzz_sign_panic
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2  # nightly
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          key: fuzz-${{ matrix.target }}
          workspaces: fuzz
      - uses: taiki-e/install-action@3fa6878dc4ae603f73960271565a082bf196ab96
        with:
          tool: cargo-fuzz

      # Persist the fuzz corpus across runs. libFuzzer's coverage-
      # guided exploration is most effective when seeded with inputs
      # that hit new edges in prior runs; without a cache, every
      # 10-min run restarts from a near-empty corpus and re-discovers
      # the same surface paths. The unique-per-run key with a
      # restore-keys fallback means each run saves its own snapshot
      # and inherits the most-recent prior snapshot for the same
      # target. Crash inputs are still PR'd separately by the "Open
      # PR on crash" step below — that's the durable record; this
      # cache is the working corpus.
      - name: Restore fuzz corpus
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      # Overlay the KAT-derived seed corpus produced once by the
      # `seed` job. libFuzzer dedupes on content hash, so merging
      # this on top of the restored cache is idempotent. Pulling the
      # full tarball is small (kilobytes) and simpler than per-target
      # filtering; libFuzzer reads only this target's directory.
      - name: Build ci-scratch
        run: rustc -O .github/scripts/ci-scratch.rs -o /tmp/ci-scratch
      - name: Pull seed corpus from Tigris scratch
        env:
          TIGRIS_ACCESS_KEY_ID: ${{ secrets.TIGRIS_ACCESS_KEY_ID }}
          TIGRIS_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_SECRET_ACCESS_KEY }}
          SHA: ${{ github.sha }}
        run: |
          mkdir -p /tmp/fuzz-seed
          /tmp/ci-scratch get fuzz-seed "${SHA}" /tmp/fuzz-seed
          tar -xzf /tmp/fuzz-seed/all.json -C fuzz

      # `cargo fuzz run` builds + runs in one step. `--target
      # x86_64-unknown-linux-gnu` overrides the cargo-fuzz default
      # of `-musl`, which would need a musl C++ toolchain the
      # ubuntu-24.04 base lacks for `libfuzzer-sys`'s cc-rs build.
      #
      # Two failure modes to distinguish from a healthy run:
      #   - exit 77: libFuzzer found a crash. Normal — the next step
      #     files a PR with the crash inputs. Treat as success.
      #   - exit 124: outer `timeout` SIGTERM at budget end. Normal.
      # Any other non-zero exit is a real failure (arg-parse, build,
      # missing binary) and must surface — a bare `|| true` here
      # masked exactly that and let zero-execs garbage flow downstream.
      #
      # Independently, sanity-check that libFuzzer actually iterated
      # by looking for at least one `#NNN ... cov: M` progress line.
      # A clean exit with no progress lines = the binary loaded but
      # never ran iterations (a regression hidden by `tee`).
      - name: Run fuzzer (10 min)
        run: |
          cd fuzz
          set -o pipefail
          rc=0
          timeout 600 cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} -- \
            -max_total_time=600 2>&1 | tee fuzz-output.txt || rc=$?
          case "$rc" in
            0|77|124) ;;
            *)
              echo "::error::cargo fuzz exited $rc (unexpected); tail of fuzz-output.txt below"
              tail -80 fuzz-output.txt >&2
              exit "$rc"
              ;;
          esac
          if ! grep -qE '^#[0-9]+.* cov: ' fuzz-output.txt; then
            echo "::error::no libFuzzer progress lines in fuzz-output.txt — fuzzer didn't actually run"
            head -80 fuzz-output.txt >&2
            exit 1
          fi

      - name: Collect results
        run: |
          rustc -O .github/scripts/fuzz-report.rs -o /tmp/fuzz-report
          /tmp/fuzz-report target "${{ matrix.target }}" "${{ github.sha }}" fuzz/fuzz-output.txt > fuzz-result.json

      # Compact per-target verdict in the run's Summary panel. Runs
      # on every event so PR / branch-dispatch / schedule see results
      # at a glance; the full libFuzzer log stays in `Run fuzzer`.
      - name: Render per-target summary
        if: ${{ !cancelled() && hashFiles('fuzz-result.json') != '' }}
        run: |
          {
            echo "### Fuzz \`${{ matrix.target }}\`"
            echo
            echo '| Status | Runs | Crashes | Corpus size |'
            echo '|---|---:|---:|---:|'
            jq -r '"| \(.status) | \(.runs) | \(.crashes) | \(.corpus_size) |"' fuzz-result.json
          } >> "$GITHUB_STEP_SUMMARY"

      # Main-only: ship to Tigris (Fly's S3-compatible scratch bucket)
      # so the `report` job can pull all 7 targets back and publish
      # one merged fuzz.json. See `.github/scripts/ci-scratch.rs`;
      # mutants uses the same transport.
      - name: Ship fuzz result to Tigris scratch
        if: github.ref == 'refs/heads/main'
        env:
          TIGRIS_ACCESS_KEY_ID: ${{ secrets.TIGRIS_ACCESS_KEY_ID }}
          TIGRIS_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_SECRET_ACCESS_KEY }}
          SHA: ${{ github.sha }}
          TARGET: ${{ matrix.target }}
        run: |
          rustc -O .github/scripts/ci-scratch.rs -o /tmp/ci-scratch
          /tmp/ci-scratch put fuzz "${SHA}" "${TARGET}" fuzz-result.json

      # Crash candidates flow: surface anything libFuzzer flagged as a
      # real bug (`crash-*` / `oom-*` / `leak-*` / `timeout-*`,
      # excluding `slow-unit-*`) inline — via the run's Summary panel
      # AND the workflow log — with each crash seed base64-encoded so
      # a triager can paste it into a `base64 -d` heredoc and reproduce
      # locally. No artifact upload, no auto-PR, no auth surface.

      - name: Summarize crash candidates
        if: ${{ !cancelled() }}
        run: |
          # libFuzzer writes several artifact classes into
          # `fuzz/artifacts/<target>/`:
          #   - `crash-*` / `oom-*` / `leak-*` / `timeout-*` — real
          #     bugs worth surfacing.
          #   - `slow-unit-*` — single iteration exceeded ~1 s. Sign /
          #     keygen targets are intrinsically slow and spam these
          #     on every run; we partition them as noise so the
          #     summary stays signal-heavy.
          shopt -s nullglob
          REAL=( fuzz/artifacts/*/crash-*    \
                 fuzz/artifacts/*/oom-*      \
                 fuzz/artifacts/*/leak-*     \
                 fuzz/artifacts/*/timeout-*  )
          SLOW=( fuzz/artifacts/*/slow-unit-* )
          shopt -u nullglob

          if [ ${#REAL[@]} -eq 0 ] && [ ${#SLOW[@]} -eq 0 ]; then
            echo "No fuzz artifacts produced this run."
            exit 0
          fi

          TARGET="${{ matrix.target }}"
          SHA="${{ github.sha }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Pull just the Rust panic + backtrace out of the libFuzzer
          # output. The panic block ends at the libFuzzer `==N== ERROR`
          # marker; everything after that is libFuzzer / ASan internal
          # frames that the full tail (further down) already shows.
          # If the crash isn't a Rust panic (e.g., pure ASan, OOM,
          # timeout), this is empty and the section is skipped.
          RUST_PANIC=$(awk '
            /^==[0-9]+== ERROR/ && in_panic { exit }
            /thread .*panicked at/ { in_panic = 1 }
            in_panic { print }
          ' fuzz/fuzz-output.txt 2>/dev/null)

          # Render the rich, human-readable summary into the run's
          # Summary panel.
          {
            echo "## Fuzz crash candidates — \`${TARGET}\`"
            echo
            echo "**Commit:** ${SHA}"
            echo "**Run:** ${RUN_URL}"
            echo
            if [ -n "$RUST_PANIC" ]; then
              echo "### Rust panic"
              echo
              echo '~~~'
              echo "$RUST_PANIC"
              echo '~~~'
              echo
            fi
            if [ ${#REAL[@]} -gt 0 ]; then
              echo "### Real bug candidates (${#REAL[@]})"
              echo
              for f in "${REAL[@]}"; do
                fname=$(basename "$f")
                size=$(wc -c < "$f" | tr -d ' ')
                echo "<details>"
                echo "<summary><code>${fname}</code> (${size} bytes)</summary>"
                echo
                echo "Reproduce locally:"
                echo
                echo '~~~bash'
                echo "base64 -d <<'EOF' > /tmp/${fname}"
                base64 < "$f"
                echo "EOF"
                echo "cargo +nightly fuzz run ${TARGET} /tmp/${fname}"
                echo '~~~'
                echo
                echo "Keep as a regression seed (if confirmed bug):"
                echo
                echo '~~~bash'
                echo "mv /tmp/${fname} fuzz/corpus/${TARGET}/"
                echo "git add -f fuzz/corpus/${TARGET}/${fname}"
                echo "git commit -m \"fuzz: add crash input for ${TARGET} (${SHA:0:7})\""
                echo '~~~'
                echo
                echo "</details>"
              done
              echo
            fi
            if [ ${#SLOW[@]} -gt 0 ]; then
              echo "### Slow-unit noise (${#SLOW[@]}) — ignored"
              echo
              echo "Sign / keygen targets generate these on every run; not crashes."
              echo
            fi
            echo "### libFuzzer output (tail, 80 lines)"
            echo
            echo '~~~'
            tail -80 fuzz/fuzz-output.txt 2>/dev/null \
              || echo "(fuzz/fuzz-output.txt missing)"
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

          # Also dump the same base64 blobs to the workflow log so the
          # bytes are grep-able from `gh run view --log` and survive in
          # the raw log record alongside the Summary. `::group::` keeps
          # the UI tidy; the bytes are still there to copy.
          if [ ${#REAL[@]} -gt 0 ]; then
            echo "::group::Crash inputs (base64) — ${TARGET}"
            for f in "${REAL[@]}"; do
              fname=$(basename "$f")
              size=$(wc -c < "$f" | tr -d ' ')
              echo "----- ${fname} (${size} bytes) -----"
              base64 < "$f"
            done
            echo "::endgroup::"

            echo "::warning::Found ${#REAL[@]} crash candidate(s) for ${TARGET}; see the run Summary for reproducers."
          fi

  report:
    name: Upload fuzz report
    needs: fuzz
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, fly, linux, x64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      - name: Pull per-target results from Tigris scratch
        env:
          TIGRIS_ACCESS_KEY_ID: ${{ secrets.TIGRIS_ACCESS_KEY_ID }}
          TIGRIS_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_SECRET_ACCESS_KEY }}
          SHA: ${{ github.sha }}
        run: |
          rustc -O .github/scripts/ci-scratch.rs -o /tmp/ci-scratch
          mkdir -p results
          /tmp/ci-scratch get fuzz "${SHA}" results
          ls -la results
          if [ -z "$(ls -A results)" ]; then
            echo "::error::No fuzz shard results found in fuzz/${SHA}/"
            exit 1
          fi

      - name: Merge results
        run: |
          rustc -O .github/scripts/fuzz-report.rs -o /tmp/fuzz-report
          /tmp/fuzz-report merge "${{ github.sha }}" results > fuzz.json

      - name: Verify fuzz payload has data
        run: jq -e '.targets | length > 0' fuzz.json > /dev/null || { echo "::error::fuzz.json has no targets"; cat fuzz.json >&2; exit 1; }
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Upload to CI site
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: rustc -O .github/scripts/ci-upload.rs -o /tmp/ci-upload && /tmp/ci-upload fuzz fuzz.json "${{ github.sha }}"

      # Sweep the per-SHA scratch intermediates now that the merged
      # fuzz.json is published. The bucket lifecycle rule auto-
      # expires objects after 7 days, so a failed clean is non-fatal;
      # this is hygiene, not durability.
      - name: Prune Tigris scratch
        env:
          TIGRIS_ACCESS_KEY_ID: ${{ secrets.TIGRIS_ACCESS_KEY_ID }}
          TIGRIS_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_SECRET_ACCESS_KEY }}
          SHA: ${{ github.sha }}
        run: |
          /tmp/ci-scratch clean fuzz "${SHA}"
          /tmp/ci-scratch clean fuzz-seed "${SHA}"
