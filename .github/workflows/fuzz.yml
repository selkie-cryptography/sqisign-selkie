name: Fuzzing

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'fuzz/**'
      - 'Cargo.toml'
      - '.github/scripts/**'
      - '.github/workflows/fuzz.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_signature_parse
          - fuzz_verifying_key_parse
          - fuzz_signing_key_parse
          - fuzz_verify
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          key: fuzz-${{ matrix.target }}
          workspaces: fuzz
      - uses: taiki-e/install-action@3fa6878dc4ae603f73960271565a082bf196ab96
        with:
          tool: cargo-fuzz

      # cargo-fuzz on x86_64 Linux defaults to `--target
      # x86_64-unknown-linux-musl` (static-link convenience), but the
      # ubuntu-24.04 runner ships no musl C++ toolchain
      # (`x86_64-linux-musl-g++`), which `libfuzzer-sys`'s build script
      # needs to compile libFuzzer's C++ sources via cc-rs. ASan also
      # refuses static libc. The host gnu target has g++ and dynamic
      # libc out of the box — pin all `cargo fuzz` invocations to it.
      - name: Build fuzzer
        run: |
          cd fuzz
          cargo +nightly fuzz build --target x86_64-unknown-linux-gnu ${{ matrix.target }}

      - name: Run fuzzer (10 min)
        run: |
          cd fuzz
          set -o pipefail
          timeout 600 cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} --no-build -- \
            -max_total_time=600 2>&1 | tee fuzz-output.txt || true

      - name: Collect results
        run: |
          rustc -O .github/scripts/fuzz-report.rs -o /tmp/fuzz-report
          /tmp/fuzz-report target "${{ matrix.target }}" "${{ github.sha }}" fuzz/fuzz-output.txt > fuzz-result.json

      - name: Upload crash artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-${{ matrix.target }}
          path: |
            fuzz/artifacts/
            fuzz-result.json

      - name: Open PR on crash
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CRASHES=$(find fuzz/artifacts -type f 2>/dev/null | head -5)
          if [ -z "$CRASHES" ]; then
            echo "No crashes found."
            exit 0
          fi
          TARGET="${{ matrix.target }}"
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:7}"
          BRANCH="fuzz-crash/${TARGET}-${SHORT_SHA}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

          mkdir -p "fuzz/corpus/${TARGET}"
          for f in $CRASHES; do
            cp "$f" "fuzz/corpus/${TARGET}/"
          done
          git add -f "fuzz/corpus/${TARGET}/"
          git commit -m "fuzz: add crash inputs for ${TARGET} (${SHORT_SHA})"
          git push origin "$BRANCH"

          # Build crash list for the PR body.
          CRASH_LIST=""
          for f in $CRASHES; do
            FNAME=$(basename "$f")
            HEX=$(xxd -p "$f" | tr -d '\n')
            CRASH_LIST+='```'$'\n'"${FNAME}: ${HEX}"$'\n''```'$'\n\n'
          done

          # Fill in the PR template.
          BODY=$(sed \
            -e "s|__TARGET__|${TARGET}|g" \
            -e "s|__SHA__|${SHA}|g" \
            -e "s|__RUN_URL__|${RUN_URL}|g" \
            .github/fuzz-crash-pr.md)
          BODY="${BODY/__CRASH_LIST__/$CRASH_LIST}"

          gh pr create \
            --title "fuzz: crash in ${TARGET} (${SHORT_SHA})" \
            --body "$BODY" \
            --base main \
            --head "$BRANCH"

  report:
    name: Upload fuzz report
    needs: fuzz
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download results
        uses: actions/download-artifact@v8
        with:
          pattern: fuzz-*
          path: results

      - name: Merge results
        run: |
          rustc -O .github/scripts/fuzz-report.rs -o /tmp/fuzz-report
          /tmp/fuzz-report merge "${{ github.sha }}" results > fuzz.json

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Upload to CI site
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: rustc -O .github/scripts/ci-upload.rs -o /tmp/ci-upload && /tmp/ci-upload fuzz fuzz.json "${{ github.sha }}"
