name: Audits

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'benches/**'
      - 'Cargo.toml'
      - '.config/nextest.toml'
      - 'deny.toml'
      - '.github/workflows/audit.yml'
  schedule:
    # Nightly fallback so audits still run when a day's pushes all
    # miss the path filter above (e.g., workflow-only changes).
    - cron: "30 6 * * *"
  workflow_dispatch:

# Audit runs on main pushes (and the nightly fallback); cancel a
# superseded run if a newer commit lands before the previous one
# finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Cron fallback: skip the scheduled firing if any non-cron run on
  # main has fired in the last 24h. The nightly cron is a fallback
  # for days where pushes miss the path filter (workflow-only
  # changes, etc.); when main has already triggered audit recently,
  # the cron's value is redundant.
  cron-gate:
    name: Cron gate (skip if recent run on main)
    if: github.event_name == 'schedule'
    runs-on: [self-hosted, fly, linux, x64]
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Look for non-cron runs on main in last 24h
        id: check
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        with:
          script: |
            const cutoff = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'audit.yml',
              per_page: 50,
            });
            const recent = data.workflow_runs.filter(r =>
              r.id !== context.runId &&
              r.event !== 'schedule' &&
              r.head_branch === 'main' &&
              r.created_at >= cutoff
            ).length;
            core.setOutput('skip', recent > 0 ? 'true' : 'false');
            core.info(recent > 0
              ? `Found ${recent} non-cron audit run(s) on main since ${cutoff}; skipping this cron firing.`
              : `No non-cron audit runs on main since ${cutoff}; proceeding with cron firing.`);

  deny:
    name: cargo deny
    needs: [cron-gate]
    if: |
      !cancelled() &&
      (github.event_name != 'schedule' ||
       needs.cron-gate.outputs.skip == 'false')
    runs-on: [self-hosted, fly, linux, x64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@3fa6878dc4ae603f73960271565a082bf196ab96
        with:
          tool: cargo-deny

      - name: Run cargo deny
        run: |
          rustc -O .github/scripts/deny-report.rs -o /tmp/deny-report
          /tmp/deny-report "${{ github.sha }}" > deny.json

      - name: Verify deny payload has data
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: jq -e '.status != null and .status != ""' deny.json > /dev/null || { echo "::error::deny.json missing status field"; cat deny.json >&2; exit 1; }
      - name: Upload
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/ci-upload
        with:
          kind: deny
          payload: deny.json
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}

  unsafe-audit:
    name: Unsafe audit
    needs: [cron-gate]
    if: |
      !cancelled() &&
      (github.event_name != 'schedule' ||
       needs.cron-gate.outputs.skip == 'false')
    runs-on: [self-hosted, fly, linux, x64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      - name: Count unsafe
        run: |
          rustc -O .github/scripts/unsafe-count.rs -o /tmp/unsafe-count
          /tmp/unsafe-count "${{ github.sha }}" > unsafe.json

      - name: Verify unsafe payload has data
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: jq -e '.modules | length > 0' unsafe.json > /dev/null || { echo "::error::unsafe.json has no modules"; cat unsafe.json >&2; exit 1; }
      - name: Upload
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/ci-upload
        with:
          kind: unsafe
          payload: unsafe.json
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}

  panic-freedom:
    name: Panic-freedom
    needs: [cron-gate]
    if: |
      !cancelled() &&
      (github.event_name != 'schedule' ||
       needs.cron-gate.outputs.skip == 'false')
    runs-on: [self-hosted, fly, linux, x64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      # `llvm-tools-preview` provides `llvm-objdump`, which `panic-count.rs`
      # uses to attribute each panic call site to its calling Rust
      # function (via the `--reloc --demangle` disassembly).
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae

      - name: Count panic sites
        run: |
          rustc -O .github/scripts/panic-count.rs -o /tmp/panic-count
          /tmp/panic-count "${{ github.sha }}" > panic.json

      - name: Verify panic payload has data
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: jq -e 'has("total") and (.total | type) == "number"' panic.json > /dev/null || { echo "::error::panic.json missing total field"; cat panic.json >&2; exit 1; }
      - name: Upload
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/ci-upload
        with:
          kind: panic
          payload: panic.json
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}

  zeroize:
    name: Zeroize verification
    needs: [cron-gate]
    if: |
      !cancelled() &&
      (github.event_name != 'schedule' ||
       needs.cron-gate.outputs.skip == 'false')
    runs-on: [self-hosted, fly, linux, x64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae

      - name: Run zeroize test
        run: |
          cargo test --profile release-checked --test zeroize --features expose-internals
          rustc -O .github/scripts/zeroize-report.rs -o /tmp/zeroize-report
          /tmp/zeroize-report "${{ github.sha }}" > zeroize.json

      - name: Verify zeroize payload has data
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: jq -e '.status != null and .status != ""' zeroize.json > /dev/null || { echo "::error::zeroize.json missing status field"; cat zeroize.json >&2; exit 1; }
      - name: Upload
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/ci-upload
        with:
          kind: zeroize
          payload: zeroize.json
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}

  binary-size:
    name: Binary & stack size
    needs: [cron-gate]
    if: |
      !cancelled() &&
      (github.event_name != 'schedule' ||
       needs.cron-gate.outputs.skip == 'false')
    runs-on: [self-hosted, fly, linux, x64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - uses: taiki-e/install-action@3fa6878dc4ae603f73960271565a082bf196ab96
        with:
          tool: cargo-bloat

      - name: Build release and collect sizes
        run: |
          cargo build --release
          rustc -O .github/scripts/size-report.rs -o /tmp/size-report
          /tmp/size-report "${{ github.sha }}" > size.json

      - name: Verify size payload has data
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: jq -e '.binary.total_bytes > 0' size.json > /dev/null || { echo "::error::size.json missing binary.total_bytes"; cat size.json >&2; exit 1; }
      - name: Upload
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/ci-upload
        with:
          kind: size
          payload: size.json
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}

  alloc-budget:
    name: Allocation budget
    needs: [cron-gate]
    if: |
      !cancelled() &&
      (github.event_name != 'schedule' ||
       needs.cron-gate.outputs.skip == 'false')
    runs-on: [self-hosted, fly, linux, x64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae

      - name: Run allocation tests
        run: |
          if cargo test --profile release-checked --test alloc_budget --features expose-internals 2>&1; then
            STATUS=pass
          else
            STATUS=fail
          fi
          rustc -O .github/scripts/alloc-report.rs -o /tmp/alloc-report
          /tmp/alloc-report "${{ github.sha }}" "$STATUS" alloc-report.json > alloc.json

      - name: Verify alloc payload has data
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: jq -e '.status != null and .status != ""' alloc.json > /dev/null || { echo "::error::alloc.json missing status field"; cat alloc.json >&2; exit 1; }
      - name: Upload
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/ci-upload
        with:
          kind: alloc
          payload: alloc.json
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}

  doc-coverage:
    name: Doc coverage
    needs: [cron-gate]
    if: |
      !cancelled() &&
      (github.event_name != 'schedule' ||
       needs.cron-gate.outputs.skip == 'false')
    runs-on: [self-hosted, fly, linux, x64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae

      - name: Check docs
        run: |
          rustc -O .github/scripts/docs-report.rs -o /tmp/docs-report
          /tmp/docs-report "${{ github.sha }}" > docs.json

      - name: Verify docs payload has data
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: jq -e '.status != null and .status != ""' docs.json > /dev/null || { echo "::error::docs.json missing status field"; cat docs.json >&2; exit 1; }
      - name: Upload
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/ci-upload
        with:
          kind: docs
          payload: docs.json
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}

  msrv:
    name: MSRV compliance
    needs: [cron-gate]
    if: |
      !cancelled() &&
      (github.event_name != 'schedule' ||
       needs.cron-gate.outputs.skip == 'false')
    runs-on: [self-hosted, fly, linux, x64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1286434836c885251bdb8ef3bbb693bec6749247  # 1.81.0
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae

      - name: Check MSRV
        run: |
          rustc -O .github/scripts/msrv-report.rs -o /tmp/msrv-report
          /tmp/msrv-report "${{ github.sha }}" "1.81.0" > msrv.json

      - name: Verify msrv payload has data
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: jq -e '.msrv != null and .msrv != ""' msrv.json > /dev/null || { echo "::error::msrv.json missing msrv field"; cat msrv.json >&2; exit 1; }
      - name: Upload
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/ci-upload
        with:
          kind: msrv
          payload: msrv.json
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}

  stack-depth:
    name: Stack depth
    needs: [cron-gate]
    if: |
      !cancelled() &&
      (github.event_name != 'schedule' ||
       needs.cron-gate.outputs.skip == 'false')
    runs-on: [self-hosted, fly, linux, x64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: Measure stack depth
        run: |
          rustc -O .github/scripts/stack-depth.rs -o /tmp/stack-depth
          /tmp/stack-depth "${{ github.sha }}" > stack.json
      - name: Verify stack payload has data
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: jq -e '.peak_stack_bytes > 0' stack.json > /dev/null || { echo "::error::stack.json has zero peak_stack_bytes"; cat stack.json >&2; exit 1; }
      - name: Upload
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/ci-upload
        with:
          kind: stack
          payload: stack.json
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}

  api-surface:
    name: API surface
    needs: [cron-gate]
    if: |
      !cancelled() &&
      (github.event_name != 'schedule' ||
       needs.cron-gate.outputs.skip == 'false')
    runs-on: [self-hosted, fly, linux, x64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2  # nightly
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - uses: taiki-e/install-action@3fa6878dc4ae603f73960271565a082bf196ab96
        with:
          tool: cargo-public-api
      - name: Capture API surface
        run: |
          rustc -O .github/scripts/api-surface.rs -o /tmp/api-surface
          /tmp/api-surface "${{ github.sha }}" > api.json
      - name: Verify api payload has data
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: jq -e '.total > 0' api.json > /dev/null || { echo "::error::api.json has zero items"; cat api.json >&2; exit 1; }
      - name: Upload
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/ci-upload
        with:
          kind: api
          payload: api.json
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}
