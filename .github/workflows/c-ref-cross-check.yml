name: C reference cross-check

# C-reference byte-interop tests. Two jobs:
#   - c-ref-cross-check: baked-vector tests (basis, all-bases, KAT
#     verification) via plain `cargo test`; no live C ref needed.
#   - randomized-byte-interop: builds a live C ref (mini-gmp) and drives
#     keygen+sign over fresh seeds beyond the 100 baked KATs, comparing
#     byte-for-byte (asserts keygen and signature byte-identity).
# Split out of ci.yml so this is its own status check rather than a
# gated Tier-3 job on the main CI run.

on:
  push:
    branches: [main, next]
    paths:
      - 'src/**'
      - 'tests/cref_xtest.rs'
      - 'tools/cref_xtest/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/c-ref-cross-check.yml'
  pull_request:
    branches: [main, next]
    paths:
      - 'src/**'
      - 'tests/cref_xtest.rs'
      - 'tools/cref_xtest/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/c-ref-cross-check.yml'
  schedule:
    - cron: "0 6 * * 0"   # weekly Sunday 06:00 UTC; conditionally skipped — see `cron-gate`.
  workflow_dispatch:
    inputs:
      xtest_count:
        description: "Randomized byte-interop cross-check: number of fresh seeds"
        required: false
        default: "256"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # C reference pinned to a commit byte-compatible with our KATs (keygen
  # is byte-identical; the byte-interop job asserts that over fresh seeds).
  CREF_REPO: SQIsign/the-sqisign
  CREF_REF: dd133d7aca576c361a270c8e6434832535b42ecc
  # Fresh seeds for the randomized byte-interop. 256 spans a broad set of
  # keygen/sign rejection trajectories (~3 min after the cached C-ref
  # build); weekly cron sweeps more. Override via workflow_dispatch.
  XTEST_COUNT: ${{ github.event.inputs.xtest_count || (github.event_name == 'schedule' && '1024' || '256') }}

jobs:
  # Cron fallback: skip the scheduled firing if any non-cron run on a
  # protected branch (main or next) has fired in the last 7d. With
  # `src/**` triggering most pushes, the weekly cron is a fallback for
  # quiet weeks only.
  cron-gate:
    name: Cron gate (skip if recent run on main/next)
    if: github.event_name == 'schedule'
    runs-on: [self-hosted, fly, linux, x64]
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Look for non-cron runs on main/next in last 7d
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const cutoff = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString();
            const branches = ['main', 'next'];
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'c-ref-cross-check.yml',
              per_page: 50,
            });
            const recent = data.workflow_runs.filter(r =>
              r.id !== context.runId &&
              r.event !== 'schedule' &&
              branches.includes(r.head_branch) &&
              r.created_at >= cutoff
            ).length;
            core.setOutput('skip', recent > 0 ? 'true' : 'false');
            core.info(recent > 0
              ? `Found ${recent} non-cron c-ref-cross-check run(s) on main/next since ${cutoff}; skipping this cron firing.`
              : `No non-cron c-ref-cross-check runs on main/next since ${cutoff}; proceeding with cron firing.`);

  c-ref-cross-check:
    name: C reference cross-check
    needs: [cron-gate]
    if: |
      !cancelled() &&
      (github.event_name != 'schedule' ||
       needs.cron-gate.outputs.skip == 'false')
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","fly","linux","x64"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae

      - name: Run C ref basis cross-check
        run: cargo test c_ref_basis_cross_check -- --ignored

      - name: Run C ref all-bases cross-check
        run: cargo test c_ref_all_bases_cross_check -- --ignored

      - name: Run C ref KAT verification cross-check
        run: cargo test c_ref_kat_cross_check -- --ignored

  # Randomized byte-interop: drive a live C reference and this crate over
  # fresh seeds (beyond the 100 baked KATs) and compare byte-for-byte.
  # Asserts keygen and signature byte-identity (and that signatures
  # verify); fails until sign byte-interop is complete -- see
  # tests/cref_xtest.rs.
  randomized-byte-interop:
    name: Randomized byte-interop cross-check
    needs: [cron-gate]
    if: |
      !cancelled() &&
      (github.event_name != 'schedule' ||
       needs.cron-gate.outputs.skip == 'false')
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","fly","linux","x64"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          persist-credentials: false

      # The oracle compiles against the C ref's source headers, so the
      # source is cloned every run; only the (slow) configure + compile of
      # the static archives is cached.
      - name: Clone C reference at pinned commit
        run: |
          git clone --no-checkout "https://github.com/${CREF_REPO}.git" cref
          git -C cref checkout "${CREF_REF}"

      - name: Restore C ref build cache
        id: cref-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: cref/build
          key: cref-build-${{ runner.os }}-${{ env.CREF_REF }}-mini-gmp-ref-tests-v1

      - name: Patch stray unconditional gmp.h include
        # ibz_division.c includes <gmp.h> unconditionally, bypassing the
        # MINI_GMP toggle; mirror the toggle so the mini-gmp build finds
        # the right type definitions when system libgmp is absent.
        if: steps.cref-cache.outputs.cache-hit != 'true'
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("cref/src/quaternion/ref/generic/hnf/ibz_division.c")
          src = p.read_text()
          old = "#include <gmp.h>\n"
          new = (
              "#if defined(MINI_GMP)\n"
              "#include <mini-gmp.h>\n"
              "#include <mini-gmp-extra.h>\n"
              "#else\n"
              "#include <gmp.h>\n"
              "#endif\n"
          )
          assert src.count(old) == 1, "expected exactly one unconditional include"
          p.write_text(src.replace(old, new, 1))
          PY

      - name: Configure C ref (mini-gmp + ref GF, NIST-I, tests on)
        # ENABLE_TESTS=ON builds the test-nistapi archive, which provides
        # the deterministic NIST KAT randombytes / randombytes_init the
        # oracle seeds per case.
        if: steps.cref-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S cref -B cref/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DGMP_LIBRARY=MINI \
            -DSQISIGN_BUILD_TYPE=ref \
            -DENABLE_TESTS=ON \
            -DENABLE_STRICT=OFF

      - name: Build C ref signature stack + KAT RNG
        # PQCgenKAT_sign_lvl1 links exactly the archives the oracle needs,
        # so building it produces all of them.
        if: steps.cref-cache.outputs.cache-hit != 'true'
        run: cmake --build cref/build -j --target PQCgenKAT_sign_lvl1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae

      - name: Build cross-test oracle
        run: |
          ORACLE=$(SQISIGN_C_REF="$PWD/cref" SQISIGN_C_REF_BUILD="$PWD/cref/build" \
            tools/cref_xtest/build.sh)
          echo "ORACLE=$ORACLE" >> "$GITHUB_ENV"

      - name: Run randomized byte-interop cross-check
        run: |
          SELKIE_XTEST_ORACLE="$ORACLE" SELKIE_XTEST_COUNT="${XTEST_COUNT}" \
            cargo test --release --test cref_xtest --features expose-internals \
            -- --ignored --nocapture
