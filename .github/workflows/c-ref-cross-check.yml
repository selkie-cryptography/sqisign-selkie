name: C reference cross-check

# Runs three C-reference differential tests: basis cross-check,
# all-bases cross-check, and KAT verification cross-check. The KAT
# cross-check verifies signatures end-to-end through
# `VerifyingKey::verify`, so its filter has to be broad (any `src/`
# path). Split out of ci.yml so this is its own status check rather
# than a gated Tier-3 job on the main CI run.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/c-ref-cross-check.yml'
  pull_request:
    branches: [main, next]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/c-ref-cross-check.yml'
  schedule:
    - cron: "0 6 * * 0"   # weekly Sunday 06:00 UTC; conditionally skipped — see `cron-gate`.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Cron fallback: skip the scheduled firing if any non-cron run on
  # main has fired in the last 7d. With `src/**` triggering most
  # pushes, the weekly cron is a fallback for quiet weeks only.
  cron-gate:
    name: Cron gate (skip if recent run on main)
    if: github.event_name == 'schedule'
    runs-on: [self-hosted, fly, linux, x64]
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Look for non-cron runs on main in last 7d
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const cutoff = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString();
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'c-ref-cross-check.yml',
              per_page: 50,
            });
            const recent = data.workflow_runs.filter(r =>
              r.id !== context.runId &&
              r.event !== 'schedule' &&
              r.head_branch === 'main' &&
              r.created_at >= cutoff
            ).length;
            core.setOutput('skip', recent > 0 ? 'true' : 'false');
            core.info(recent > 0
              ? `Found ${recent} non-cron c-ref-cross-check run(s) on main since ${cutoff}; skipping this cron firing.`
              : `No non-cron c-ref-cross-check runs on main since ${cutoff}; proceeding with cron firing.`);

  c-ref-cross-check:
    name: C reference cross-check
    needs: [cron-gate]
    if: |
      !cancelled() &&
      (github.event_name != 'schedule' ||
       needs.cron-gate.outputs.skip == 'false')
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","fly","linux","x64"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae

      - name: Run C ref basis cross-check
        run: cargo test c_ref_basis_cross_check -- --ignored

      - name: Run C ref all-bases cross-check
        run: cargo test c_ref_all_bases_cross_check -- --ignored

      - name: Run C ref KAT verification cross-check
        run: cargo test c_ref_kat_cross_check -- --ignored
