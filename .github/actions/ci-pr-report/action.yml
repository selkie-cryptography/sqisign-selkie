name: CI PR report
description: >-
  Render a Markdown report for one CI data kind (bench, instructions, kat, dudect,
  tacet, mutants, coverage) comparing the current payload to main's stored
  baseline. Always writes a job summary; on same-repo pull requests, posts
  or updates a sticky comment.

inputs:
  kind:
    description: Data kind (bench, instructions, kat, dudect, tacet, mutants, coverage).
    required: true
  payload:
    description: Path to the current payload JSON this run produced.
    required: true
  github-token:
    description: Token with pull-requests:write, for the PR comment.
    required: true

runs:
  using: composite
  steps:
    - name: Render ${{ inputs.kind }} report
      shell: bash
      run: |
        site=https://sqisign-selkie-ci.fly.dev
        curl -sf "$site/${{ inputs.kind }}/latest.json" -o /tmp/ci-baseline.json \
          || echo '{}' > /tmp/ci-baseline.json
        # For instructions, also pull alloc/stack PR-sha + main-latest so the
        # report can surface PR-vs-main resource deltas (perf-metrics jobs
        # write /<kind>/<sha>.json on PRs via ci-upload --pr-only).
        extra=()
        if [ "${{ inputs.kind }}" = "instructions" ]; then
          for k in alloc stack; do
            curl -sf "$site/$k/${{ github.sha }}.json" -o "/tmp/$k-pr.json" \
              || echo '{}' > "/tmp/$k-pr.json"
            curl -sf "$site/$k/latest.json" -o "/tmp/$k-latest.json" \
              || echo '{}' > "/tmp/$k-latest.json"
            extra+=("/tmp/$k-pr.json" "/tmp/$k-latest.json")
          done
        fi
        # Empty RUSTC_WRAPPER: skip sccache for this tiny standalone
        # compile in jobs (e.g. ci.yml) that set a wrapper for the crate.
        RUSTC_WRAPPER= rustc -O .github/scripts/ci-report.rs -o /tmp/ci-report
        /tmp/ci-report "${{ inputs.kind }}" /tmp/ci-baseline.json \
          "${{ inputs.payload }}" "${extra[@]}" \
          > /tmp/ci-report.md
        cat /tmp/ci-report.md >> "$GITHUB_STEP_SUMMARY"

    # Same-repo PRs, whether triggered directly (pull_request) or
    # indirectly (workflow_run after another workflow finishes — e.g.
    # the mutants run, which fires on CI completion, not on the PR).
    - name: Comment ${{ inputs.kind }} report
      if: >-
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.event == 'pull_request' &&
         github.event.workflow_run.head_repository.full_name == github.repository)
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const body = fs.readFileSync('/tmp/ci-report.md', 'utf8');
          // First line is the hidden per-kind marker, e.g. `<!-- ci-report:instructions -->`.
          const marker = body.split('\n', 1)[0];
          const { owner, repo } = context.repo;

          // PR number is direct on pull_request events; on workflow_run it
          // must be resolved from the triggering run (its payload carries
          // the head sha/branch but no issue number).
          let issue_number = context.payload.pull_request?.number;
          if (!issue_number && context.payload.workflow_run) {
            const wr = context.payload.workflow_run;
            issue_number = wr.pull_requests?.[0]?.number;
            if (!issue_number) {
              const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner, repo, commit_sha: wr.head_sha,
              });
              issue_number = prs.find(p => p.state === 'open')?.number;
            }
          }
          if (!issue_number) {
            core.info('No associated PR; skipping comment (job summary already written).');
            return;
          }

          const comments = await github.paginate(github.rest.issues.listComments, {
            owner, repo, issue_number,
          });
          const prev = comments.find(c => c.body && c.body.includes(marker));

          if (prev) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: prev.id, body });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }
