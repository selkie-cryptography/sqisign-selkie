name: Upload CI data
description: >-
  Compile ci-upload and push to the Fly CI site. Two modes: JSON-payload
  (set `kind` + `payload`, stored under /<kind>/) or asset upload (set
  `assets` + `remote-subdir`, hosts flamegraph SVGs under /<remote-subdir>/).
  Gate the calling step via its `if:`. In JSON mode ci-upload validates the
  payload's per-kind floor internally and fails the step on empty data.

inputs:
  kind:
    description: Data kind (the /<kind>/ path on the CI site). JSON mode.
    required: false
    default: ''
  payload:
    description: Path to the payload JSON to upload. JSON mode.
    required: false
    default: ''
  assets:
    description: Local root to scan for flamegraph SVGs. Asset mode.
    required: false
    default: ''
  remote-subdir:
    description: Remote subdir under /data for assets (e.g. instructions/flamegraphs/<sha>).
    required: false
    default: ''
  sha:
    description: Commit SHA the data belongs to (JSON mode).
    required: false
    default: ${{ github.sha }}
  fly-api-token:
    description: Fly API token with access to the CI-site app.
    required: true

runs:
  using: composite
  steps:
    - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
    - name: Upload to CI site
      shell: bash
      env:
        FLY_API_TOKEN: ${{ inputs.fly-api-token }}
      run: |
        # Empty RUSTC_WRAPPER: skip sccache for this standalone compile in
        # jobs (e.g. ci.yml) that set a wrapper for the crate build.
        RUSTC_WRAPPER= rustc -O .github/scripts/ci-upload.rs -o /tmp/ci-upload
        if [ -n "${{ inputs.assets }}" ]; then
          /tmp/ci-upload --assets "${{ inputs.assets }}" "${{ inputs.remote-subdir }}"
        else
          /tmp/ci-upload "${{ inputs.kind }}" "${{ inputs.payload }}" "${{ inputs.sha }}"
        fi
