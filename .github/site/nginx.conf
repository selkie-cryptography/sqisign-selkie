events {}
http {
    include mime.types;
    sendfile on;

    server {
        listen 8080;
        listen [::]:8080;
        port_in_redirect off;

        resolver 127.0.0.11;
        autoindex off;

        server_name _;
        server_tokens off;

        root /app;
        gzip_static on;

        location /coverage/ {
            alias /data/coverage/;
        }

        location /bench/ {
            alias /data/bench/;
        }

        location /mutants/ {
            alias /data/mutants/;
        }

        location /dudect/ {
            alias /data/dudect/;
        }

        location /tacet/ {
            alias /data/tacet/;
        }

        location /kat/ {
            alias /data/kat/;
        }

        location /deny/ {
            alias /data/deny/;
        }

        location /unsafe/ {
            alias /data/unsafe/;
        }

        location /size/ {
            alias /data/size/;
        }

        location /docs/ {
            alias /data/docs/;
        }

        location /msrv/ {
            alias /data/msrv/;
        }

        location /panic/ {
            alias /data/panic/;
        }

        location /fuzz/ {
            alias /data/fuzz/;
        }

        location /iai/ {
            alias /data/iai/;
        }

        location /alloc/ {
            alias /data/alloc/;
        }

        location /platform/ {
            alias /data/platform/;
        }

        location /stack/ {
            alias /data/stack/;
        }

        location /ctgrind/ {
            alias /data/ctgrind/;
        }

        location /api/ {
            alias /data/api/;
        }

        location = /manifest.json {
            alias /data/manifest.json;
        }

        location /rustdoc/ {
            alias /data/rustdoc/;
        }

        error_page 404 /404.html;
        location = /404.html {
          internal;
        }

        location /metrics {
           stub_status on;
        }
    }
}
