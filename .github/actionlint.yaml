# actionlint configuration.
#
# Declares the self-hosted runner labels we use so actionlint doesn't
# warn on them. Labels here must stay in sync with whatever the
# orchestrator's `MachineSize::from_labels` (in
# `infra/orchestrator/src/fly.rs`) accepts.
self-hosted-runner:
  labels:
    - fly
    - perf-2x
    - perf-4x
    - perf-8x
    - perf-16x
    - shared-2x
    - shared-4x
