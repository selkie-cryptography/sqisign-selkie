# Use `mold` as the Linux linker. ~5× faster than `ld`, ~2× faster
# than `lld`. Cuts cargo link time noticeably on every build.
#
# Requires `mold` on PATH on Linux build hosts:
#   - Fly runner image: installed via `infra/runners/Dockerfile`.
#   - Local Linux dev: `apt-get install mold` (Ubuntu 22.04+) or
#     `dnf install mold` (Fedora 37+).
#
# macOS and Windows targets are unaffected — only the two Linux
# target tables set the flag. gcc 12+ / clang 12+ understands
# `-fuse-ld=mold` natively, so no linker driver override is needed
# (Ubuntu 24.04 ships gcc 13).
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[env]
# Tests run signing on width-60 BigInts (480 bytes each); debug-mode
# stack frames in `Lattice::product`'s `det(first_block)` and the
# laplace-expanded chained `ct_mul`/`ct_sub` ladder push past the
# default 2 MiB per test thread on the response-phase cross-order
# path (KAT 001 was the first to overflow). 16 MiB is conservative.
RUST_MIN_STACK = "16777216"
