# cargo-mutants configuration
# https://mutants.rs/
#
# Run locally:
#   cargo mutants -- --lib                     # full run
#   cargo mutants --in-diff git.diff -- --lib  # only changed code

# Timeout: 5x baseline with a floor of 60s.  Some quaternion tests are
# slow; 60s prevents false "timeout" kills on legitimate test runs.
timeout_multiplier = 5
minimum_test_timeout = 60

# --- Exclusions ---
#
# Keep this list minimal.  A surviving mutant is a signal, not noise.
# Only exclude when mutation *cannot* produce a meaningful test failure.

exclude_re = [
  # Zeroize::zeroize is a security property (memory scrubbing), not a
  # correctness property.  Mutating it to a no-op won't fail any
  # functional test — and that's expected, not a test gap.
  "impl Zeroize for",

  # `Fp::is_square` returns `r.ct_eq(&Fp::ONE) | self.ct_eq(&Fp::ZERO)`.
  # The two `Choice` operands are mutually exclusive: when `self == 0`
  # the `pow_p3div4().square() * self` chain is 0, so `r.ct_eq(&Fp::ONE)`
  # is 0; when `self != 0` the second operand is 0. With one side always
  # zero, `|` and `^` produce identical results on every input — the
  # `replace | with ^ in Fp::is_square` mutant is provably equivalent
  # and cannot be killed by any test.
  "Fp::is_square",
]
