# cargo-mutants configuration. https://mutants.rs/
#
# Run locally:
#   cargo mutants                     # full run
#   cargo mutants --in-diff git.diff  # only changed code
#
# (No `-- --lib`: the suite runs lib unit tests AND integration
# tests under `tests/` so wycheproof and other end-to-end checks
# participate in killing mutants.)
#
# Requires `cargo-nextest` on PATH (the default test tool, see below).
# Override with `--test-tool cargo` to fall back to plain `cargo test`.

# nextest as default test tool. CI workflows assume this.
test_tool = "nextest"

# Skip the long-running sign-KAT class during mutant verification.
# Each `sign_kat_derand_NNN` runs a full keygen + sign + verify on
# one KAT seed; running 100 of them per mutant dominates wall time
# without commensurate kill signal. The mutants that would only be
# killed by signing flows are caught faster by the lib + integration
# tests already in the default suite. The cross-product
# `(n_bt > 0, r_rsp > 0)` class is preserved via
# `keys::tests::verify_kat_*` (always run) so excluding the slow
# signers here doesn't lose meaningful coverage.
#
# This was briefly removed (the experiment hit `cargo-mutants` taking
# 5-7 min/mutant under the full 100-KAT suite, every shard timing out
# at 3h with ~21 outcomes done out of 246). Restored. If a future
# regression shows up only via sign KATs and nothing else catches it,
# revisit the trade-off — but the bound this saves is real.
#
# `--cargo-profile release-checked` builds and runs each mutant under
# the release-optimization profile with `debug-assertions` and
# `overflow-checks` retained (Cargo.toml). cargo-mutants compiles a
# fresh tree per mutant, so cumulative compile time is significant —
# the release build is slower per-mutant but the resulting tests run
# fast enough that the net wall time drops substantially.
additional_cargo_test_args = ["--cargo-profile", "release-checked", "-E", "not test(/sign_kat_derand_/)"]

# Timeout: 3x baseline with a floor of 60s.
#
# 5x was the original value; pulled back to 3x after the post-sign-KAT-
# exclusion full run showed a long tail of timeout-inducing mutations
# (e.g. infinite loops introduced by mutating a divisor / shift) eating
# ~13 min each at 5×159s baseline = 795s. 3×159s = 477s caps the
# wasted-on-broken-mutant time at ~8 min, freeing shard budget for
# real outcomes. Trade: legitimately-slow-but-correct tests may now
# false-positive as TIMEOUT outcomes. The 60s floor still guards
# against fast baselines clamping the cap absurdly low.
timeout_multiplier = 3
minimum_test_timeout = 60

# --- Exclusions ---
#
# Keep this list minimal.  A surviving mutant is a signal, not noise.
# Only exclude when mutation *cannot* produce a meaningful test failure.

exclude_re = [
  # Zeroize::zeroize is a security property (memory scrubbing), not a
  # correctness property.  Mutating it to a no-op won't fail any
  # functional test — and that's expected, not a test gap.
  "impl Zeroize for",

  # `Fp::is_square` returns `r.ct_eq(&Fp::ONE) | self.ct_eq(&Fp::ZERO)`.
  # The two `Choice` operands are mutually exclusive: when `self == 0`
  # the `pow_p3div4().square() * self` chain is 0, so `r.ct_eq(&Fp::ONE)`
  # is 0; when `self != 0` the second operand is 0. With one side always
  # zero, `|` and `^` produce identical results on every input — the
  # `replace | with ^ in Fp::is_square` mutant is provably equivalent
  # and cannot be killed by any test.
  "Fp::is_square",
]
