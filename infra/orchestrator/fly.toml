# Fly app config for the orchestrator service.
#
# Long-lived HTTP service that:
#   - receives `workflow_job` webhooks from GitHub
#   - HMAC-verifies them
#   - mints JIT runner registration tokens via the GitHub App
#   - spawns ephemeral Fly Machines via the Machines API
#
# Deployed from `infra/` as cwd so the Dockerfile has the right
# build context. flyctl defaults `fly.toml` to the cwd, so we pass
# `--config` explicitly to point it at this file:
#
#   cd infra
#   fly deploy --app sqisign-infra-orchestrator \
#     --config orchestrator/fly.toml \
#     --dockerfile orchestrator/Dockerfile

app = "sqisign-infra-orchestrator"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false        # always-on; we need to receive webhooks
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 50
    soft_limit = 30

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[checks.health]
  type = "http"
  port = 8080
  path = "/healthz"
  interval = "30s"
  timeout = "5s"
  grace_period = "30s"
  method = "GET"
