# Fly app for the orchestrator service.
# Long-lived HTTP receiver: webhook → JIT mint → spawn Fly Machine.
#
# Deploy from `infra/` so the Dockerfile has the right build context.
# `fly.toml` defaults to cwd, so pass `--config` explicitly:
#
#   cd infra
#   fly deploy --app sqisign-infra-orchestrator \
#     --config orchestrator/fly.toml \
#     --dockerfile orchestrator/Dockerfile

app = "sqisign-infra-orchestrator"
# Co-located with the runners app in `iad` — close to Azure East US 2
# (GitHub Actions / api.machines.dev / api.github.com). Webhook
# ingest latency drops a few ms; not critical for correctness, but
# keeps everything in one region.
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false        # always-on for webhook delivery
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 50
    soft_limit = 30

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[checks.health]
  type = "http"
  port = 8080
  path = "/healthz"
  interval = "30s"
  timeout = "5s"
  grace_period = "30s"
  method = "GET"
