[package]
name = "orchestrator"
version = "0.0.0"
edition = "2021"
publish = false

# Long-lived HTTP service deployed to Fly. Receives `workflow_job`
# webhooks from GitHub, mints JIT runner configs, spawns ephemeral
# Fly Machines.

[dependencies]
anyhow = "1"
axum = "0.7"
hmac = "0.12"
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
