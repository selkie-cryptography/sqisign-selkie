[package]
name = "sqisign-selkie-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.sqisign-selkie]
path = ".."

[workspace]
members = ["."]

[[bin]]
name = "fuzz_signature_parse"
path = "fuzz_targets/signature_parse.rs"
test = false
doc = false

[[bin]]
name = "fuzz_verifying_key_parse"
path = "fuzz_targets/verifying_key_parse.rs"
test = false
doc = false

[[bin]]
name = "fuzz_signing_key_parse"
path = "fuzz_targets/signing_key_parse.rs"
test = false
doc = false

[[bin]]
name = "fuzz_verify"
path = "fuzz_targets/verify.rs"
test = false
doc = false

# Structure-aware companion to fuzz_verify: anchors pk and the
# sig.curve_aux region to KAT 0, XORs the remaining sig bytes from
# libFuzzer's input. Every iteration reaches the (2,2)-chain instead
# of bouncing at Signature::from_bytes.
[[bin]]
name = "fuzz_verify_typed"
path = "fuzz_targets/verify_typed.rs"
test = false
doc = false

# Slow targets: keygen and sign each take seconds-to-minutes per
# iteration, so coverage-guided fuzzing is impractical for the
# millions-of-executions metric libFuzzer normally wants. Kept
# because they catch a different bug class — panic-on-input — that
# raw exec/s doesn't reflect. Worth running for hours after touching
# keygen/sign internals, even at single-digit exec/s; one panic is
# enough.
[[bin]]
name = "fuzz_keygen_panic"
path = "fuzz_targets/keygen_panic.rs"
test = false
doc = false

[[bin]]
name = "fuzz_sign_panic"
path = "fuzz_targets/sign_panic.rs"
test = false
doc = false
